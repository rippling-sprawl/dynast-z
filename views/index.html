<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/primary/index.css">
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="index-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <script>initPage();</script>

  <main class="home">
    <div class="home-grid">
      <a class="home-tile" href="/football">
        <span class="home-tile-emoji">🏈</span>
        <span class="home-tile-text">
          <span class="home-tile-title">Football</span>
          <span class="home-tile-desc">Trade tools &amp; dynasty leagues</span>
        </span>
      </a>
      <a class="home-tile" href="/bets">
        <span class="home-tile-emoji">🎯</span>
        <span class="home-tile-text">
          <span class="home-tile-title">Bets</span>
          <span class="home-tile-desc">Track your wagers &amp; history</span>
        </span>
      </a>
      <a class="home-tile" href="/golf">
        <span class="home-tile-emoji">🏌️</span>
        <span class="home-tile-text">
          <span class="home-tile-title">Golf</span>
          <span class="home-tile-desc">Majors, leaderboards, 3-balls &amp; groups</span>
        </span>
      </a>
      <a class="home-tile" href="https://sharplystupid.substack.com/" target="_blank">
        <span class="home-tile-emoji">📰</span>
        <span class="home-tile-text">
          <span class="home-tile-title">News</span>
          <span class="home-tile-desc">The Sharply Stupid blog</span>
        </span>
      </a>
      <a class="home-tile" href="/acknowledgements">
        <span class="home-tile-emoji">🧠</span>
        <span class="home-tile-text">
          <span class="home-tile-title">About</span>
          <span class="home-tile-desc">Resources &amp; acknowledgements</span>
        </span>
      </a>
    </div>
  </main>
</body>
</html>
