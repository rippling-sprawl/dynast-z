<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>2026 Golf Season | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <link rel="stylesheet" href="/styles/primary/golf.css">
  <link rel="stylesheet" href="/styles/style/score-colors.css">
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <script>initPage();</script>

  <div class="masters-content">
    <h2 id="page-title">Golf Season</h2>
    <p class="subtitle">Major Championships</p>

    <div class="hub-grid" id="season-grid">
      <div class="masters-loading">Loading tournaments...</div>
    </div>
  </div>

  <style>
    .tournament-card {
      background: var(--panel-hi);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 16px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s;
      display: block;
    }
    .tournament-card:hover {
      border-color: var(--accent-2);
    }
    .tournament-card h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 4px;
    }
    .tournament-card .venue {
      font-size: 11px;
      color: var(--text-3);
      margin: 0 0 8px;
    }
    .tournament-card .dates {
      font-size: 11px;
      color: var(--text-2);
      font-family: monospace;
    }
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 3px;
      margin-left: 8px;
    }
    .status-badge.complete { background: var(--good); color: var(--panel-lo); }
    .status-badge.live { background: var(--warn); color: var(--panel-lo); }
    .status-badge.upcoming { background: var(--hairline); color: var(--text-3); }
  </style>

  <script>
    // Parse year from URL: /season/2026 or /golf/2026
    const parts = window.location.pathname.split('/').filter(Boolean);
    const year = parts[1] || '2026'; // works for both /season/2026 and /golf/2026
    document.getElementById('page-title').textContent = year + ' Golf Season';
    document.title = year + ' Golf Season | Dynast-Z';

    fetch('/data/tournaments.json')
      .then(r => r.json())
      .then(data => {
        const season = data[year];
        if (!season) {
          document.getElementById('season-grid').innerHTML = '<p class="masters-empty">No tournaments found for ' + year + '</p>';
          return;
        }

        const slugs = Object.keys(season);
        document.getElementById('season-grid').innerHTML = slugs.map(slug => {
          const t = season[slug];
          const badgeClass = t.status === 'complete' ? 'complete' : t.status === 'live' ? 'live' : 'upcoming';
          const badgeText = t.status === 'complete' ? 'COMPLETE' : t.status === 'live' ? 'LIVE' : 'UPCOMING';
          return `<a class="tournament-card" href="/golf/${year}/${slug}">
            <h3>${t.name} <span class="status-badge ${badgeClass}">${badgeText}</span></h3>
            <p class="venue">${t.venue}</p>
            <p class="dates">${t.dates}</p>
          </a>`;
        }).join('');
      })
      .catch(() => {
        document.getElementById('season-grid').innerHTML = '<p class="masters-empty">Failed to load tournaments</p>';
      });
  </script>
</body>
</html>
