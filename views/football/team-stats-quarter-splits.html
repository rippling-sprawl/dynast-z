<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/app-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynast-Z">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Quarter Splits | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <!-- The schedule's chrome: the team picker below is that page's modal. -->
  <link rel="stylesheet" href="/styles/components/nfl-pickers.css">
  <link rel="stylesheet" href="/styles/primary/nfl-schedule.css">
  <link rel="stylesheet" href="/styles/primary/quarter-splits.css">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/standalone.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <!-- The team grid is /football/schedule's, as on /football/defense-vs-players;
       the league's team list and the next opponent come from the same
       schedule file that page reads. -->
  <script src="/scripts/components/nfl-pickers.js"></script>
  <script src="/scripts/components/nfl-schedule.js"></script>
  <script>initPage();</script>

  <div class="masters-content">
    <div class="masters-breadcrumbs">
      <a href="/football">Football</a><span class="separator">/</span><a href="/football/team-stats">Team Stats</a><span class="separator">/</span><span>Quarter Splits</span>
    </div>

    <h2>Quarter Splits</h2>

    <!-- Markup contract for scripts/components/nfl-pickers.js. -->
    <div class="dd-row qs-controls">
      <div class="qs-filter">
        <span class="qs-flabel" id="l-team">Team</span>
        <div class="dd" id="dd-team">
          <button type="button" class="dd-btn" id="f-team" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="l-team f-team">
            <span class="dd-value">Pick a team</span>
          </button>
          <div class="dd-pop dd-overlay" id="team-overlay" role="dialog" aria-modal="true" aria-label="Team" hidden>
            <div class="tp" id="team-grid"></div>
          </div>
        </div>
      </div>
      <div class="qs-seg" role="group" aria-label="Points">
        <button type="button" data-view="for" aria-pressed="true">Scored</button>
        <button type="button" data-view="against" aria-pressed="false">Allowed</button>
        <button type="button" data-view="diff" aria-pressed="false">Diff</button>
      </div>
    </div>

    <div id="board"><p class="sched-empty">Loading teams…</p></div>
    <p class="qs-note" id="note"></p>
  </div>

  <script>
  (function () {
    'use strict';

    /* A team's points by quarter, game by game, read three ways: what it
     * scored, what it allowed, and the difference. One table, two sections
     * under the same columns: the next opponent's season first, read from the
     * other side of the matchup (a team's scoring sits under what its opponent
     * allows), then the team's own games, newest first. Built weekly by
     * scripts/build_quarter_splits.py, so the page only reads and adds up. */

    var season = SCHED_CURRENT_SEASON;
    var sched = null;
    var teams = [];
    var team = '';
    var view = 'for';     // for | against | diff
    var doc = null;       // the picked team's games
    var oppDoc = null;    // its next opponent's games, or null
    var next = null;      // { opp, week, home, neutral } from the schedule

    var VIEWS = ['for', 'against', 'diff'];
    var VIEW_WORD = { 'for': 'scored', against: 'allowed', diff: 'diff' };
    // The opponent's side of what the toggle shows: what the team scores is
    // set against what the opponent allows, and the other way round.
    var OPP_VIEW = { 'for': 'against', against: 'for', diff: 'diff' };

    var board = document.getElementById('board');
    var note = document.getElementById('note');
    var teamBtn = document.getElementById('f-team');
    var teamGrid = document.getElementById('team-grid');
    var segBtns = [].slice.call(document.querySelectorAll('.qs-seg button'));

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function logo(abbr) {
      return '<img src="/assets/icons/nfl/' + esc(abbr) + '.svg" alt="' + esc(abbr) + '" title="' + esc(abbr) + '">';
    }

    /* ---------- the URL is the state ----------
     *   ?team=DAL&view=against     (view=for, the default, is left out) */
    function writeParams() {
      var q = new URLSearchParams();
      if (team) q.set('team', team);
      if (view !== 'for') q.set('view', view);
      var str = q.toString();
      var url = location.pathname + (str ? '?' + str : '');
      if (url !== location.pathname + location.search) history.replaceState(null, '', url);
    }

    function applyParams(search) {
      var q = new URLSearchParams(search);
      var t = (q.get('team') || '').toUpperCase();
      team = t && schedTeamsByAbbr(sched)[t] ? t : '';
      var v = (q.get('view') || '').toLowerCase();
      view = VIEWS.indexOf(v) >= 0 ? v : 'for';
      syncSeg();
    }

    function syncSeg() {
      segBtns.forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-view') === view));
      });
    }

    /* ---------- the numbers ----------
     * A game's line is [q1, q2, q3, q4, ot]. The periods shown are the four
     * quarters plus two running totals: HT after the 2nd, FT at the end with
     * overtime folded in. OT never gets a column of its own.
     *
     * Everything below takes the view `v` it reads, since the opponent's rows
     * read the opposite one to the team's. */

    function lineOf(g, v) {
      if (v === 'for') return g.pf;
      if (v === 'against') return g.pa;
      return g.pf.map(function (x, i) { return x - g.pa[i]; });
    }

    // Did OT points land on the side this view reads?
    function otScored(g, v) {
      if (v === 'for') return g.pf[4] > 0;
      if (v === 'against') return g.pa[4] > 0;
      return g.pf[4] > 0 || g.pa[4] > 0;
    }

    // -> [q1, q2, ht, q3, q4, ft]
    function periods(l) {
      return [l[0], l[1], l[0] + l[1], l[2], l[3], l[0] + l[1] + l[2] + l[3] + l[4]];
    }

    var COLS = ['1st', '2nd', 'HT', '3rd', '4th', 'FT'];
    var IS_TOT = [false, false, true, false, false, true];
    var NCOL = COLS.length + 1;

    function fmt(x, v, dp) {
      var s = dp ? x.toFixed(dp) : String(x);
      return v === 'diff' && x > 0 ? '+' + s : s;
    }

    /* ---------- the heatmap ----------
     * Every colour is read from the PICKED team's side: green is good for it,
     * red is bad, and the deeper the colour the further from the middle.
     *
     *   Scored   high is green, low red — for the team's scoring and for what
     *            the opponent allows alike: a defense that gives up a lot is
     *            the team's chance to score.
     *   Allowed  low is green, high red — for what the team allows and for
     *            what the opponent scores.
     *   Diff     the team's differential green when positive; the opponent's
     *            green when negative, since a quarter the opponent loses is
     *            one the team can win.
     *
     * The range is FIXED, the same for every team and every row, so a colour
     * means the same thing across the league: points in a quarter run from 0
     * (the floor) through 5.5 (about the league average, uncoloured), 7
     * (above average) and 10 (high) to 13 or more (the ceiling). A
     * differential is read off the same steps either side of zero. Returns
     * a cell's "goodness", -1..1. */
    var PTS_STEPS = [[0, -1], [5.5, 0], [7, 0.3], [10, 0.7], [13, 1]];
    var DIFF_STEPS = [[-10, -1], [-7, -0.7], [-3, -0.3], [0, 0], [3, 0.3], [7, 0.7], [10, 1]];

    function interp(steps, x) {
      if (x <= steps[0][0]) return steps[0][1];
      for (var i = 1; i < steps.length; i++) {
        var a = steps[i - 1], b = steps[i];
        if (x <= b[0]) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      }
      return steps[steps.length - 1][1];
    }

    function heat(x, opp) {
      if (view === 'diff') { var d = interp(DIFF_STEPS, x); return opp ? -d : d; }
      var s = interp(PTS_STEPS, x);
      return view === 'for' ? s : -s;
    }

    // HT and FT are not heatmapped, but a differential's total is still
    // coloured by whose favour it runs, from the picked team's side.
    function totTone(x, opp) {
      if (!x) return '';
      return (x > 0) !== !!opp ? 'is-pos' : 'is-neg';
    }

    // One period cell. `opp` marks the opponent's rows.
    function cell(x, i, v, dp, star, opp) {
      var cls = [];
      var style = '';
      if (IS_TOT[i]) {
        cls.push('qs-tot');
        if (v === 'diff') cls.push(totTone(x, opp));
      } else {
        var g = heat(x, opp);
        if (Math.abs(g) > 0.001) {
          cls.push('heat', g > 0 ? 'is-pos' : 'is-neg');
          style = ' style="--heat:' + Math.min(1, Math.abs(g)).toFixed(3) + '"';
        }
      }
      if (!x && !style) cls.push('is-zero');
      return '<td class="' + cls.join(' ') + '"' + style +
        (star ? ' title="Includes points scored in overtime"' : '') + '>' +
        esc(fmt(x, v, dp)) + (star ? '<span class="qs-ot">*</span>' : '') + '</td>';
    }

    function median(xs) {
      if (!xs.length) return 0;
      var s = xs.slice().sort(function (a, b) { return a - b; });
      var m = s.length >> 1;
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    }

    function round1(x) { return Math.round(x * 10) / 10; }

    // -> { avg: [6], med: [6], n, ot } over a list of games, to one decimal as
    // shown. Each column's median is its own: HT's is the median halftime
    // score, not 1st + 2nd.
    function aggregate(games, v) {
      var cols = [[], [], [], [], [], []], ot = 0;
      games.forEach(function (g) {
        periods(lineOf(g, v)).forEach(function (x, i) { cols[i].push(x); });
        if (otScored(g, v)) ot++;
      });
      var n = games.length;
      return {
        avg: cols.map(function (c) { return n ? round1(c.reduce(function (a, b) { return a + b; }, 0) / n) : 0; }),
        med: cols.map(function (c) { return round1(median(c)); }),
        n: n,
        ot: ot
      };
    }

    /* ---------- the rows ---------- */

    // A section opens with a full-width row naming whose numbers follow and
    // which side of them.
    function groupRow(abbr, word, sub) {
      return '<tr class="qs-group"><th colspan="' + NCOL + '"><span class="qs-glabel">' +
        logo(abbr) + '<b>' + esc(abbr) + '</b> ' + esc(word) +
        (sub ? '<span class="qs-sub">' + sub + '</span>' : '') + '</span></th></tr>';
    }

    function msgRow(text) {
      return '<tr><td class="qs-none" colspan="' + NCOL + '">' + esc(text) + '</td></tr>';
    }

    // Average and median per game, from aggregate(). `opp` marks the
    // opponent's rows.
    function aggRows(a, v, opp) {
      function row(label, vals) {
        return '<tr class="qs-aggrow"><th class="qs-rowhead qs-agg">' + esc(label) + '</th>' +
          vals.map(function (x, i) { return cell(x, i, v, 1, a.ot > 0 && i === 5, opp); }).join('') +
          '</tr>';
      }
      return row('Average', a.avg) + row('Median', a.med);
    }

    function gamesLabel(n) { return n + ' game' + (n === 1 ? '' : 's'); }

    function byeRow(w) {
      return '<tr class="qs-bye"><th colspan="' + NCOL + '">Wk ' + w + ' · Bye</th></tr>';
    }

    function weekLabel(g) {
      return g.postseason ? 'P' + g.week : 'Wk ' + g.week;
    }

    function oppRows(a) {
      var v = OPP_VIEW[view];
      if (!next) {
        return groupRow(team, 'opponent', '') + msgRow('No game left on ' + team + '\'s schedule.');
      }
      var sub = 'Wk ' + esc(next.week) + ' · ' + esc(team) + ' ' +
        (next.home || next.neutral ? 'vs' : '@') + ' ' + esc(next.opp) +
        (a.n ? ' · ' + gamesLabel(a.n) : '');
      return groupRow(next.opp, VIEW_WORD[v], sub) +
        (a.n ? aggRows(a, v, true) : msgRow('No completed games yet for ' + next.opp + '.'));
    }

    // The team's own games, newest first, under its average and median.
    // A regular-season week skipped between two games is a bye, and so is one
    // between its latest game and the one coming up.
    function teamRows(a) {
      var games = (doc.games || []).slice().reverse();
      var head = groupRow(team, VIEW_WORD[view], games.length ? gamesLabel(games.length) : '');
      if (!games.length) return head + msgRow('No completed games yet this season.');
      var lines = games.map(function (g) { return periods(lineOf(g, view)); });
      var lastWeek = next && !games[0].postseason ? next.week : null;
      var body = games.map(function (g, k) {
        var out = '';
        if (lastWeek != null && !g.postseason) {
          for (var w = lastWeek - 1; w > g.week; w--) out += byeRow(w);
        }
        lastWeek = g.postseason ? null : g.week;
        var star = otScored(g, view);
        return out + '<tr><th class="qs-rowhead"><span class="qs-wk"><b>' + esc(weekLabel(g)) + '</b>' +
          '<span class="qs-at">' + (g.home || g.neutral ? 'vs' : '@') + '</span>' + logo(g.opp) + '</span></th>' +
          lines[k].map(function (x, i) { return cell(x, i, view, 0, star && i === 5); }).join('') +
          '</tr>';
      }).join('');
      return head + aggRows(a, view, false) + body;
    }

    function render() {
      if (!doc) return;
      var oppAgg = aggregate((next && oppDoc && oppDoc.games) || [], OPP_VIEW[view]);
      var teamAgg = aggregate(doc.games || [], view);
      board.innerHTML = '<div class="qs-scroll"><table class="qs-table">' +
        '<thead><tr><th class="qs-rowhead"></th>' +
        COLS.map(function (c, i) { return '<th' + (IS_TOT[i] ? ' class="qs-tot"' : '') + '>' + c + '</th>'; }).join('') +
        '</tr></thead><tbody>' + oppRows(oppAgg) + teamRows(teamAgg) + '</tbody></table></div>';
      note.textContent = 'Every colour is relative to ' + team + ': green is good for ' + team + ', red is bad · ' +
        (view === 'diff'
          ? 'Colours run on a fixed league-wide range: even at 0, deepest at ±10 or more in a quarter · '
          : 'Colours run on a fixed league-wide range: 0 points in a quarter, 5.5 average (uncoloured), 7 above average, 10 high, 13+ the most · ') +
        'The opponent is read from the other side: under Scored it shows what they allow, under Allowed what they score · ' +
        'HT and FT are running totals and are not heatmapped · OT has no column of its own: its points are in FT, marked * · ' +
        (view === 'diff' ? 'Diff is points scored minus points allowed in that period · ' : '') +
        'rebuilt Tuesdays 5am ET';
    }

    /* ---------- the next opponent ----------
     * The first game on the picked team's schedule that has not finished. A
     * game counts as finished four hours after kickoff, which is when the
     * weekly build would have it anyway. */
    var GAME_MS = 4 * 3600 * 1000;
    function nextGame(abbr) {
      var now = Date.now();
      for (var i = 0; i < sched.weeks.length; i++) {
        var wk = sched.weeks[i];
        for (var j = 0; j < (wk.games || []).length; j++) {
          var g = wk.games[j];
          if (g.away !== abbr && g.home !== abbr) continue;
          if (new Date(g.kickoff).getTime() + GAME_MS < now) continue;
          var home = g.home === abbr;
          return { opp: home ? g.away : g.home, week: wk.week, home: home && !g.neutral, neutral: !!g.neutral };
        }
      }
      return null;
    }

    function fetchTeam(abbr) {
      return fetch('/api/quarter-splits?team=' + encodeURIComponent(abbr) +
                   '&season=' + encodeURIComponent(season), { cache: 'no-store' })
        .then(function (r) {
          // Read as text first: a route that is not wired up answers with an
          // HTML page, and r.json() on that fails with a message (Safari's
          // "string did not match the expected pattern") that says nothing.
          return r.text().then(function (text) {
            var body;
            try { body = JSON.parse(text); } catch (e) {
              throw new Error('quarter splits unavailable (HTTP ' + r.status + ')');
            }
            if (r.status === 404) return { games: [] };
            if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
            return body;
          });
        });
    }

    var loadToken = 0;

    function load() {
      writeParams();
      syncTeamPicker(teamBtn, teamGrid, team, teams, { emptyLabel: 'Pick a team', nicknameOnly: true });
      note.textContent = '';
      doc = oppDoc = null;
      var token = ++loadToken;
      if (!team) {
        board.innerHTML = '<p class="sched-empty">Pick a team to see its points by quarter, game by game.</p>';
        return;
      }
      board.innerHTML = '<p class="sched-empty">Loading…</p>';
      next = nextGame(team);
      Promise.all([fetchTeam(team), next ? fetchTeam(next.opp) : Promise.resolve(null)])
        .then(function (res) {
          if (token !== loadToken) return;
          doc = res[0];
          oppDoc = res[1];
          render();
        })
        .catch(function (e) {
          if (token !== loadToken) return;
          board.innerHTML = '<p class="sched-empty">Error: ' + esc(e.message) + '</p>';
        });
    }

    segBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        view = b.getAttribute('data-view');
        syncSeg();
        writeParams();
        render();
      });
    });

    var teamDd = registerDropdown(document.getElementById('dd-team'));

    teamGrid.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.tp-team, .tp-any') : null;
      if (!btn || !teamGrid.contains(btn)) return;
      team = btn.getAttribute('data-team');
      closeDropdown(teamDd, true);
      load();
    });

    window.addEventListener('popstate', function () {
      if (!sched) return;
      applyParams(location.search);
      load();
    });

    schedLoad(season).then(function (d) {
      sched = d;
      teams = d.teams;
      buildTeamPicker(teamGrid, teams, { anyLabel: 'No team' });
      applyParams(location.search);
      load();
    }).catch(function (e) {
      board.innerHTML = '<p class="sched-empty">Error: ' + esc(e.message) + '</p>';
    });
  })();
  </script>
</body>
</html>
