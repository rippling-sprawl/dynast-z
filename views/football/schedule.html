<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Home-screen install. The two *-capable tags are what make an iOS icon
       launch the site standalone — its own window, no address bar — instead of
       opening a Safari tab; the manifest says the same thing to everyone else,
       and to iOS 16.4+. standalone.js keys the drawer's share row off exactly
       that state, so dropping these tags silently removes the row too. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/app-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynast-Z">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Odds | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <link rel="stylesheet" href="/styles/components/nfl-pickers.css">
  <link rel="stylesheet" href="/styles/components/nfl-schedule.css">
  <link rel="stylesheet" href="/styles/primary/nfl-schedule.css">
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/standalone.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <!-- Both shared with /football/bakers-buns: the pickers below, and the rows
       the card renders a team's season with. -->
  <script src="/scripts/components/nfl-pickers.js"></script>
  <script src="/scripts/components/nfl-schedule.js"></script>
  <script>initPage();</script>

  <div class="masters-content">
    <div class="masters-breadcrumbs">
      <a href="/football">Football</a><span class="separator">/</span><span>Odds</span>
    </div>

    <h2>Odds</h2>

    <!-- Markup contract for scripts/components/nfl-pickers.js. -->
    <div class="dd-row">
      <div class="dd" id="dd-week">
        <button type="button" class="dd-btn" id="f-week" aria-haspopup="true" aria-expanded="false">
          <span class="dd-value">All weeks</span>
        </button>
        <div class="dd-pop dd-menu" id="week-menu" role="menu" aria-label="Week" hidden></div>
      </div>

      <div class="dd" id="dd-team">
        <button type="button" class="dd-btn" id="f-team" aria-haspopup="dialog" aria-expanded="false">
          <span class="dd-value">Teams</span>
        </button>
        <div class="dd-pop dd-overlay" id="team-overlay" role="dialog" aria-modal="true" aria-label="Team" hidden>
          <div class="tp" id="team-grid"></div>
        </div>
      </div>

      <!-- Last, not first: the season is the control that moves least, and week
           and team are where a reader who has been here before expects them. -->
      <div class="dd" id="dd-season">
        <button type="button" class="dd-btn" id="f-season" aria-haspopup="true" aria-expanded="false">
          <span class="dd-value">2026</span>
        </button>
        <div class="dd-pop dd-menu" id="season-menu" role="menu" aria-label="Season" hidden></div>
      </div>

      <button type="button" class="sched-reset" id="f-reset" hidden>Reset</button>
    </div>

    <div id="list"><p class="sched-empty">Loading schedule…</p></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* The rows, the time handling and the three lists live in
     * scripts/components/nfl-schedule.js, because the team card on
     * /football/bakers-buns renders a team's season too. What stays here is what
     * is particular to a page with filters on it: which season and week are
     * being looked at, what the three controls do, and how that survives a
     * reload in the URL. */

    var doc = null;
    /* Scores, spreads and totals for the season in view, keyed by game id —
     * /api/game-odds, fetched alongside the fixture list rather than with it.
     * Empty until it lands and empty for ever if it never does, which is the
     * page as it was before it carried a line. */
    var live = {};
    // The week the clock is in, for the season in view — and null for a season
    // that has already finished, which has no current week to be in. It decides
    // which week the page opens on and when Reset has anything to do; it is not
    // labelled in the menu, because the week it names is the one the page is
    // already showing.
    var nowWeek = null;
    var state = { season: SCHED_CURRENT_SEASON, week: 1, team: '' };

    var listEl = document.getElementById('list');
    var weekBtn = document.getElementById('f-week');
    var weekMenu = document.getElementById('week-menu');
    var teamBtn = document.getElementById('f-team');
    var teamPicker = document.getElementById('team-grid');
    var seasonBtn = document.getElementById('f-season');
    var seasonMenu = document.getElementById('season-menu');
    var resetBtn = document.getElementById('f-reset');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ---------- params ----------
     * The season is read before anything loads, since it decides what loads.
     * The week and the team are read after, because both are only meaningful
     * against a file: a week has to be one the season has, and a team has to be
     * one the file knows.
     */

    function readSeasonParam() {
      var v = Number(new URLSearchParams(location.search).get('season'));
      return SCHED_SEASONS.indexOf(v) >= 0 ? v : SCHED_CURRENT_SEASON;
    }

    function readParams() {
      var q = new URLSearchParams(location.search);
      var w = q.get('week');
      var t = (q.get('team') || '').toUpperCase();

      if (w === 'all') state.week = 'all';
      else if (w && doc.weeks.some(function (x) { return String(x.week) === w; })) state.week = Number(w);

      if (t && schedTeamsByAbbr(doc)[t]) state.team = t;
    }

    // The season is written only when it is not the current one, so every URL
    // that worked before this page had seasons still reads the same and still
    // means the same thing.
    function writeParams() {
      var q = new URLSearchParams();
      q.set('week', String(state.week));
      if (state.team) q.set('team', state.team);
      if (state.season !== SCHED_CURRENT_SEASON) q.set('season', String(state.season));
      history.replaceState(null, '', location.pathname + '?' + q.toString());
    }

    /* ---------- the filter controls ----------
     * The controls themselves — the option menus, the league's logo grid, and
     * the open/shut behaviour they share — live in
     * scripts/components/nfl-pickers.js, because /football/bakers-buns files a
     * note against the same team and the same week this page filters by. What
     * stays here is what is particular to a schedule: which weeks the file
     * actually has, which one is "now", and what picking one means.
     */

    function weekOptions() {
      return [{ value: 'all', label: 'All weeks' }].concat(
        doc.weeks.map(function (w) {
          return { value: w.week, label: 'Week ' + w.week };
        }));
    }

    function weekLabel() {
      return state.week === 'all' ? 'All weeks' : 'Week ' + state.week;
    }

    function seasonOptions() {
      return SCHED_SEASONS.map(function (s) {
        return {
          value: s,
          label: String(s),
          note: s === SCHED_CURRENT_SEASON ? 'current' : ''
        };
      });
    }

    // The week the page opens a season on. For the season in progress that is
    // whichever week the clock is in — the page is read during the season far
    // more often than before it, and week 1 in December is never what was
    // wanted. A finished season has no such week, so it opens at its start.
    function defaultWeek() {
      return nowWeek || 1;
    }

    function syncFilters() {
      syncWeekMenu(weekBtn, weekMenu, state.week, weekLabel());
      // "Teams", not the component's default "All teams": the control sits
      // beside a week menu that does say "All weeks", and the two are not the
      // same kind of word. A week filter set to all weeks is showing all of
      // them; a team filter is a search, and what it says when nothing is
      // picked is what it is for rather than a state it is in.
      syncTeamPicker(teamBtn, teamPicker, state.team, doc.teams,
                     { emptyLabel: 'Teams' });
      syncOptionMenu(seasonBtn, seasonMenu, state.season, String(state.season), 'season');
    }

    // Rebuilt on every load: the week list is the file's, and a season the page
    // has not shown yet has its own.
    function refreshPanels() {
      buildWeekMenu(weekMenu, weekOptions());
      buildTeamPicker(teamPicker, doc.teams);
    }

    // Wired once. The panels below them are replaced on every season change, so
    // every handler here is delegated to the panel rather than to its options.
    function wireFilters() {
      buildOptionMenu(seasonMenu, seasonOptions(), 'season');

      var weekDd = registerDropdown(document.getElementById('dd-week'));
      var teamDd = registerDropdown(document.getElementById('dd-team'));
      var seasonDd = registerDropdown(document.getElementById('dd-season'));

      weekMenu.addEventListener('click', function (e) {
        var opt = e.target.closest ? e.target.closest('.dd-opt') : null;
        if (!opt || !weekMenu.contains(opt)) return;
        var v = opt.getAttribute('data-week');
        state.week = v === 'all' ? 'all' : Number(v);
        closeDropdown(weekDd, true);
        apply();
      });

      // Picking a team means looking for that team, and a team plays once a
      // week — a single-week view answers "are they playing Sunday" and nothing
      // else. The week snaps to all-weeks so the pick lands on their season.
      // Clicking the picked team again is how you get back to all teams; the
      // week stays where it was put.
      teamPicker.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.tp-team') : null;
        if (!btn || !teamPicker.contains(btn)) return;
        var abbr = btn.getAttribute('data-team');
        state.team = state.team === abbr ? '' : abbr;
        if (state.team) state.week = 'all';
        closeDropdown(teamDd, true);
        apply();
      });

      // The team survives a season change — comparing a team's two seasons is
      // the reason to have both — but the week cannot: "this week" means
      // something different in each, and week 1 of a finished season is not the
      // week the reader was just looking at either.
      seasonMenu.addEventListener('click', function (e) {
        var opt = e.target.closest ? e.target.closest('.dd-opt') : null;
        if (!opt || !seasonMenu.contains(opt)) return;
        var season = Number(opt.getAttribute('data-season'));
        closeDropdown(seasonDd, true);
        if (season !== state.season) load(season, false);
      });

      resetBtn.addEventListener('click', function () {
        state.team = '';
        closeAllDropdowns();
        if (state.season !== SCHED_CURRENT_SEASON) {
          load(SCHED_CURRENT_SEASON, false);
        } else {
          state.week = defaultWeek();
          apply();
        }
      });
    }

    function apply() {
      syncFilters();
      resetBtn.hidden = state.season === SCHED_CURRENT_SEASON &&
        state.week === nowWeek && !state.team;
      var html = state.week === 'all'
        ? schedRenderAll(doc, { team: state.team, lines: live })
        : schedRenderWeek(doc, state.week, { team: state.team, lines: live });
      // Below the schedule, not above it: the games are what was asked for and
      // the links are where to go next.
      listEl.innerHTML = html + (state.team ? schedTeamLinks(doc, state.team) : '');
      writeParams();
    }

    /* Asked for after the fixture list has been drawn, never waited on. The
     * schedule is the page and it is a committed file; the lines are what the
     * page says about it and they come from an API that can be slow or down,
     * and holding 272 rows back for them would trade the whole page for a
     * column of it.
     *
     * The season guard is the reader having moved on: they can pick 2025 while
     * 2026's lines are still in the air, and a late answer must not repaint
     * the season they left. */
    function loadLines(season) {
      schedLoadLines(season).then(function (byId) {
        if (state.season !== season) return;
        live = byId;
        apply();
      });
    }

    /* `fromParams` is the first load only: an explicit ?week=/?team= is the
     * reader arriving with a question already asked, and it outranks the
     * defaults. A season picked from the menu is a question asked here, and
     * carrying the old URL's week into it would be answering the wrong one. */
    function load(season, fromParams) {
      listEl.innerHTML = '<p class="sched-empty">Loading schedule…</p>';
      live = {};
      schedLoad(season).then(function (d) {
        doc = d;
        state.season = season;
        nowWeek = season === SCHED_CURRENT_SEASON ? schedCurrentWeek(doc) : null;
        state.week = state.team ? 'all' : defaultWeek();

        if (fromParams) readParams();
        refreshPanels();
        apply();
        loadLines(season);
      }).catch(function (e) {
        listEl.innerHTML = '<p class="sched-empty">Error: ' + esc(e.message) + '</p>';
      });
    }

    /* A restored page is not a loaded one. iOS keeps open tabs as a rendered
     * snapshot and hands the DOM back untouched — no fetch, no script — so a
     * tab left open across a deploy keeps drawing rows built from whatever the
     * schedule file said at the time. That is not hypothetical here: the ids
     * these rows link by changed from ESPN's to balldontlie's, and a restored
     * tab links every game to a page that cannot resolve it. `no-store` on the
     * document does not prevent this; Safari's back/forward cache keeps
     * no-store pages anyway.
     *
     * Re-fetch and repaint rather than calling load(): the reader's week and
     * team are still on the screen and still what they asked for, and load()
     * would reset them to the defaults for the season. */
    function restore() {
      schedInvalidate();
      schedLoad(state.season).then(function (d) {
        doc = d;
        refreshPanels();
        apply();
        loadLines(state.season);
      }).catch(function () {
        // Offline, most likely. What is on the page is stale but readable, and
        // wiping it for an error message trades one wrong thing for a worse one.
      });
    }

    window.addEventListener('pageshow', function (e) {
      if (e.persisted) restore();
    });

    /* Coming back to a tab that was already open.
     *
     * The week's order is an answer about right now — what is on, what is next,
     * what just finished — and a page rendered at 12:55 is still claiming a
     * one o'clock kickoff is "scheduled" at half past three. So the lines are
     * re-read when the tab is looked at again, which is the only moment the
     * answer is being read. Not the fixture list: it is a committed file and
     * the copy in hand is correct.
     *
     * Rate-limited because this fires on every app switch and the schedule is
     * a page people leave open. A minute is shorter than the two-minute sweep
     * that refreshes a live game upstream, so nothing is ever waiting on this
     * that the data itself could have answered sooner. */
    var REFRESH_FLOOR_MS = 60000;
    var refreshedAt = Date.now();

    document.addEventListener('visibilitychange', function () {
      if (document.hidden || !doc) return;
      if (Date.now() - refreshedAt < REFRESH_FLOOR_MS) return;
      refreshedAt = Date.now();
      schedInvalidateLines();
      loadLines(state.season);
    });

    state.season = readSeasonParam();
    wireFilters();
    load(state.season, true);
  })();
  </script>
</body>
</html>
