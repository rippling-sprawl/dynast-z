<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>NFL Schedule | Dynast-Z</title>
  <link rel="stylesheet" href="/styles/base/styles.css?v=abec71e4">
  <link rel="stylesheet" href="/styles/base/hub.css?v=2b363e8e">
  <link rel="stylesheet" href="/styles/primary/nfl-schedule.css?v=4344f113">
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js?v=8ab3e67e"></script>
  <script src="/scripts/base/nav.js?v=1d4c0225"></script>
  <script>initPage();</script>

  <div class="masters-content">
    <div class="masters-breadcrumbs">
      <a href="/">Home</a><span class="separator">/</span><a href="/football">Football</a><span class="separator">/</span><span>Schedule</span>
    </div>

    <h2>NFL Schedule</h2>

    <div class="sched-filters">
      <select id="f-week" aria-label="Week"></select>
      <select id="f-team" aria-label="Team"></select>
      <button type="button" class="sched-reset" id="f-reset" hidden>Reset</button>
    </div>

    <div id="list"><p class="sched-empty">Loading schedule…</p></div>
  </div>

  <script>
  (function () {
    'use strict';

    var DATA_URL = '/data/nfl_schedule.json';

    var data = null;
    var teamsByAbbr = {};
    var state = { week: 1, team: '' };   // week: 1-18 or 'all'; team: abbr or ''

    var listEl = document.getElementById('list');
    var weekSel = document.getElementById('f-week');
    var teamSel = document.getElementById('f-team');
    var resetBtn = document.getElementById('f-reset');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ---------- time ----------
     * Every kickoff in the file is a UTC instant; every label on this page is
     * US Eastern, because that is the timezone the league schedules in and the
     * one the odd/regular split is defined against (see the fetch script).
     * Rendering in the viewer's own zone would put a "1:00 PM slate" game at
     * 10:00 AM for a west-coast reader and make the badges look wrong.
     */
    var TZ = 'America/New_York';

    function fmt(opts) {
      opts.timeZone = TZ;
      return new Intl.DateTimeFormat('en-US', opts);
    }

    var fmtTime = fmt({ hour: 'numeric', minute: '2-digit' });
    var fmtDayLong = fmt({ weekday: 'long', month: 'long', day: 'numeric' });
    // The badge label for an odd game: "THU", "MON", "SUN".
    var fmtDayAbbr = fmt({ weekday: 'short' });

    // ET morning, read off the same formatter that renders the time cell so the
    // badge and the time it sits next to can never disagree.
    function isMorningET(d) {
      return fmtTime.formatToParts(d).some(function (p) {
        return p.type === 'dayPeriod' && /^a/i.test(p.value);
      });
    }

    // The time cell, without the meridiem: every kickoff that renders here is
    // "1:00" through "9:30" and every one of them is a 4-character string, so
    // the column is exactly as wide as its content and the AM/PM that used to
    // follow it said nothing — no NFL game kicks at 1:00 in the morning. The
    // one genuine morning slot, the 9:30 international, is the case the SUN
    // A.M. badge exists to mark.
    function timeLabel(d) {
      return fmtTime.formatToParts(d).filter(function (p) {
        return p.type !== 'dayPeriod' && !(p.type === 'literal' && p.value !== ':');
      }).map(function (p) { return p.value; }).join('');
    }

    // The per-row date in any all-weeks list: "Sep 14". The weekday is dropped
    // because the badge column now carries it for every game where it matters —
    // an unbadged row is a Sunday by definition.
    var fmtDayRowFmt = fmt({ month: 'short', day: 'numeric' });
    function fmtDayRow(d) { return fmtDayRowFmt.format(d); }
    // en-CA yields YYYY-MM-DD, which is the calendar-day grouping key.
    var fmtDayKey = new Intl.DateTimeFormat('en-CA',
      { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
    // 24-hour ET, for the slate boundary below. en-GB so the hour is plain
    // "16" rather than en-US's "16" plus a meridiem to strip.
    var fmtHour24 = new Intl.DateTimeFormat('en-GB',
      { timeZone: TZ, hour: '2-digit', hour12: false });
    function etHour(d) { return Number(fmtHour24.format(d)); }

    /* The Sunday slate break. The early games all kick at 1:00 and the late
     * ones at 4:05/4:25, and they are two separate blocks of the afternoon
     * rather than one continuous run of rows — the rule is drawn at 4:00 ET,
     * between the last of the early games and the first of the late ones.
     * Same calendar day only, so it never fires across a day or week boundary
     * in the all-weeks lists. */
    function isSlateBreak(prev, cur) {
      return !!prev && fmtDayKey.format(prev) === fmtDayKey.format(cur) &&
        etHour(prev) < 16 && etHour(cur) >= 16;
    }

    function toDate(iso) {
      // "2026-09-10T00:20Z" — Safari parses this, but be explicit about the
      // zone rather than relying on it.
      return new Date(iso.replace(' ', 'T'));
    }

    /* ---------- which week is it right now? ----------
     * The file ships each week's window as [start, end) in UTC: midnight ET on
     * the day of that week's first game, to midnight ET after its last. The
     * windows never overlap and the only uncovered days are Tuesdays, so the
     * first week that has not yet ended is unambiguously "now" — including
     * during a Tuesday, when it correctly reads as the week about to start.
     *
     * Before the season that is week 1, which is also the plain default. After
     * the last game it falls through to week 18 rather than to nothing.
     */
    function currentWeek(now) {
      for (var i = 0; i < data.weeks.length; i++) {
        if (now < toDate(data.weeks[i].end)) return data.weeks[i].week;
      }
      return data.weeks[data.weeks.length - 1].week;
    }

    /* ---------- filters ---------- */

    function readParams() {
      var q = new URLSearchParams(location.search);
      var w = q.get('week');
      var t = (q.get('team') || '').toUpperCase();

      if (w === 'all') state.week = 'all';
      else if (w && data.weeks.some(function (x) { return String(x.week) === w; })) state.week = Number(w);

      if (t && teamsByAbbr[t]) state.team = t;
    }

    function writeParams() {
      var q = new URLSearchParams();
      q.set('week', String(state.week));
      if (state.team) q.set('team', state.team);
      history.replaceState(null, '', location.pathname + '?' + q.toString());
    }

    function buildFilters(nowWeek) {
      weekSel.innerHTML = '<option value="all">All weeks</option>' +
        data.weeks.map(function (w) {
          return '<option value="' + w.week + '">Week ' + w.week +
            (w.week === nowWeek ? ' — this week' : '') + '</option>';
        }).join('');

      teamSel.innerHTML = '<option value="">All teams</option>' +
        data.teams.slice().sort(function (a, b) { return a.name < b.name ? -1 : 1; })
          .map(function (t) {
            return '<option value="' + esc(t.abbr) + '">' + esc(t.name) + '</option>';
          }).join('');

      weekSel.value = String(state.week);
      teamSel.value = state.team;

      weekSel.addEventListener('change', function () {
        state.week = weekSel.value === 'all' ? 'all' : Number(weekSel.value);
        apply(nowWeek);
      });
      teamSel.addEventListener('change', function () {
        state.team = teamSel.value;
        apply(nowWeek);
      });
      resetBtn.addEventListener('click', function () {
        state.week = nowWeek;
        state.team = '';
        weekSel.value = String(nowWeek);
        teamSel.value = '';
        apply(nowWeek);
      });
    }

    function matches(g) {
      return !state.team || g.away === state.team || g.home === state.team;
    }

    /* ---------- render ---------- */

    /* One game, one line. `opts` adds leading columns for the lists that need
     * them: `week` for a team's season, where the week number is the only
     * ordering the reader has, and `date` for any all-weeks list, where the
     * rows are no longer under a day header that says which day it is. */
    function gameRow(g, opts) {
      opts = opts || {};
      var d = toDate(g.kickoff);
      var tbd = g.slot === 'tbd';
      var away = teamsByAbbr[g.away] || { abbr: g.away };
      var home = teamsByAbbr[g.home] || { abbr: g.home };

      // The picked-team highlight says which side of a home/away pairing is
      // "yours". A neutral-site game has no such pairing — neither team is at
      // home — so the row carries the venue instead and no side is coloured.
      function team(t, side) {
        var picked = !g.neutral && state.team === t.abbr;
        return '<span class="sched-team ' + side + (picked ? ' is-picked' : '') +
          '" title="' + esc(t.name || t.abbr) + '">' + esc(t.abbr) + '</span>';
      }

      // A neutral-site game has no true home team, so "@" would be a lie and
      // the venue is the whole point of the row — it's the only case where the
      // stadium earns its space in a condensed list.
      var sep = g.neutral ? 'vs' : '@';
      var venue = g.neutral && g.venue
        ? '<span class="sched-venue">' + esc(g.venue) + '</span>' : '';

      // Only the exceptions are labelled. A regular Sunday-afternoon game is
      // the default case on 181 of 272 rows, and stamping every one of them
      // "regular" would bury the ~67 that are actually worth noticing — the
      // badge means something precisely because most rows don't have one.
      //
      // The label is the day the game is played, which is what makes the game
      // odd in the first place. Sunday is the exception that needs a second
      // word: the odd Sundays are the morning international kickoffs and the
      // night game, so "SUN" alone would not say which — hence "SUN A.M." on
      // the morning ones. The night games keep a bare "SUN"; their time cell
      // already reads 8:20 PM.
      var badge = '';
      if (g.slot === 'odd') {
        var day = fmtDayAbbr.format(d);
        badge = '<span class="sched-slot odd">' +
          esc(day + (day === 'Sun' && isMorningET(d) ? ' a.m.' : '')) + '</span>';
      } else if (g.slot !== 'regular') {
        badge = '<span class="sched-slot ' + g.slot + '">' + g.slot + '</span>';
      }

      // A TBD game still has a known calendar day — only the kickoff time is
      // unset — so the date cell is real even where the time cell isn't.
      return '<div class="sched-game' + (tbd ? ' is-tbd' : '') +
          (opts.week ? ' has-week' : '') + (opts.date ? ' has-date' : '') +
          (opts.slateBreak ? ' is-slate-break' : '') + '">' +
        (opts.week ? '<span class="sched-wk">' + esc(opts.week) + '</span>' : '') +
        (opts.date ? '<span class="sched-date">' + esc(fmtDayRow(d)) + '</span>' : '') +
        '<span class="sched-time">' + (tbd ? 'TBD' : esc(timeLabel(d))) + '</span>' +
        '<span class="sched-matchup">' +
          '<span class="sched-teams">' + team(away, 'away') +
            '<span class="sched-at">' + sep + '</span>' + team(home, 'home') + '</span>' +
          badge + venue + '</span>' +
        '</div>';
    }

    function groupHeader(title, sub) {
      return '<div class="sched-group"><h3>' + esc(title) + '</h3>' +
        (sub ? '<span class="sched-group-sub">' + esc(sub) + '</span>' : '') + '</div>';
    }

    // One week: group by ET calendar day, so a week reads Thu / Sun / Mon.
    function renderWeek(wk) {
      var games = wk.games.filter(matches);
      if (!games.length) {
        return '<p class="sched-empty">' + (state.team
          ? esc((teamsByAbbr[state.team] || {}).name || state.team) +
            ' are on bye in week ' + wk.week + '.'
          : 'No games in week ' + wk.week + '.') + '</p>';
      }
      // Rows are wrapped per day so the zebra striping restarts with each
      // group — counted across the whole list, the headers are siblings too and
      // the stripes land on arbitrary rows.
      var html = '', lastKey = null, prev = null;
      games.forEach(function (g) {
        var d = toDate(g.kickoff);
        var key = fmtDayKey.format(d);
        if (key !== lastKey) {
          if (lastKey !== null) html += '</div>';
          html += groupHeader(fmtDayLong.format(d)) + '<div class="sched-rows">';
          lastKey = key;
        }
        html += gameRow(g, { slateBreak: isSlateBreak(prev, d) });
        prev = d;
      });
      return html + '</div>';
    }

    // A team across all weeks — one game a week, so eighteen week headers would
    // be eighteen headers over eighteen rows. The week number becomes a column
    // instead and the whole season renders as one uninterrupted block, at the
    // same density as a single week of the all-teams view. Byes are rows rather
    // than omissions: a missing week 7 would otherwise read as a data gap.
    function renderSeason() {
      var rows = data.weeks.map(function (wk) {
        var g = wk.games.filter(matches)[0];
        return g
          ? gameRow(g, { week: wk.week, date: true })
          : '<div class="sched-game sched-bye has-week has-date">' +
              '<span class="sched-wk">' + wk.week + '</span>' +
              '<span class="sched-date">—</span><span class="sched-time"></span>' +
              '<span class="sched-matchup">Bye week</span></div>';
      }).join('');
      return '<div class="sched-rows">' + rows + '</div>';
    }

    // All weeks, all teams: still grouped by week, because 272 rows need the
    // breaks. Each row carries its own date — the week's date range said less
    // than the day the game is actually on.
    function renderAll() {
      if (state.team) return renderSeason();
      return data.weeks.map(function (wk) {
        var games = wk.games.filter(matches);
        if (!games.length) return '';
        var prev = null;
        return groupHeader('Week ' + wk.week) + '<div class="sched-rows">' +
          games.map(function (g) {
            var d = toDate(g.kickoff);
            var row = gameRow(g, { date: true, slateBreak: isSlateBreak(prev, d) });
            prev = d;
            return row;
          }).join('') + '</div>';
      }).join('');
    }

    function apply(nowWeek) {
      resetBtn.hidden = (state.week === nowWeek && !state.team);
      listEl.innerHTML = state.week === 'all'
        ? renderAll()
        : renderWeek(data.weeks.filter(function (w) { return w.week === state.week; })[0]);
      writeParams();
    }

    fetch(DATA_URL)
      .then(function (r) {
        if (!r.ok) throw new Error('schedule data unavailable (' + r.status + ')');
        return r.json();
      })
      .then(function (doc) {
        data = doc;
        data.teams.forEach(function (t) { teamsByAbbr[t.abbr] = t; });

        // The default is week 1, then moved to whichever week the clock is
        // actually in — the page is read during the season far more often than
        // before it, and week 1 in December is never what was wanted.
        var nowWeek = currentWeek(new Date());
        state.week = nowWeek;
        readParams();          // an explicit ?week=/?team= still wins

        buildFilters(nowWeek);
        apply(nowWeek);
      })
      .catch(function (e) {
        listEl.innerHTML = '<p class="sched-empty">Error: ' + esc(e.message) + '</p>';
      });
  })();
  </script>
</body>
</html>
