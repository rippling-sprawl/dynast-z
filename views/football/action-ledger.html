<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/app-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynast-Z">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Action Ledger | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <!-- The /football look: the hub shell, the shared dd-row pickers, and
       nfl-schedule.css for the VegasInsider skin and its repaint of them. -->
  <link rel="stylesheet" href="/styles/base/hub.css">
  <link rel="stylesheet" href="/styles/components/nfl-pickers.css">
  <link rel="stylesheet" href="/styles/primary/nfl-schedule.css">
  <link rel="stylesheet" href="/styles/primary/action-ledger.css">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/standalone.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/components/table-sort.js"></script>
  <script src="/scripts/components/nfl-pickers.js"></script>
  <script>initPage();</script>

  <main class="masters-content al-content">
    <div class="masters-breadcrumbs">
      <a href="/football">Football</a><span class="separator">/</span><span>Sandbox</span><span class="separator">/</span><span>Action Ledger</span>
    </div>

    <h2>Action Ledger</h2>
    <p class="al-sub" id="al-sub">Loading…</p>

    <!-- Three views of the same rows. The filter row below narrows all three;
         the date range only applies to All Bets, since Pending and Futures are
         defined by a date window of their own. -->
    <div class="al-tabs" role="tablist" aria-label="Ledger view">
      <button type="button" class="al-tab" role="tab" data-view="all" aria-selected="true">All Bets</button>
      <button type="button" class="al-tab" role="tab" data-view="pending" aria-selected="false">Pending <span class="al-tab-hint">next 2 wks</span></button>
      <button type="button" class="al-tab" role="tab" data-view="futures" aria-selected="false">Futures <span class="al-tab-hint">NFL, 2027+</span></button>
    </div>

    <!-- The schedule's dropdowns (nfl-pickers.js), one per filter, each showing
         only its value, in the order they cut: when, what, where, who, how it
         ended -- then the free-text search and Reset. -->
    <div class="dd-row al-filters" id="al-filters">
      <div class="dd al-date-only" id="dd-range">
        <button type="button" class="dd-btn" id="f-range" aria-haspopup="true" aria-expanded="false" aria-label="Date range">
          <span class="dd-value">Last 60 days</span>
        </button>
        <div class="dd-pop dd-menu" id="range-menu" role="menu" aria-label="Date range" hidden></div>
      </div>
      <div class="al-custom al-date-only" hidden>
        <input class="al-input" type="date" id="f-from" aria-label="From">
        <span class="al-to">to</span>
        <input class="al-input" type="date" id="f-to" aria-label="To">
      </div>
      <div class="dd" id="dd-type">
        <button type="button" class="dd-btn" id="f-type" aria-haspopup="true" aria-expanded="false" aria-label="Bet type">
          <span class="dd-value">All types</span>
        </button>
        <div class="dd-pop dd-menu" id="type-menu" role="menu" aria-label="Bet type" hidden></div>
      </div>
      <div class="dd" id="dd-league">
        <button type="button" class="dd-btn" id="f-league" aria-haspopup="true" aria-expanded="false" aria-label="League">
          <span class="dd-value">All leagues</span>
        </button>
        <div class="dd-pop dd-menu" id="league-menu" role="menu" aria-label="League" hidden></div>
      </div>
      <div class="dd" id="dd-team">
        <button type="button" class="dd-btn" id="f-team" aria-haspopup="true" aria-expanded="false" aria-label="Team">
          <span class="dd-value">All teams</span>
        </button>
        <div class="dd-pop dd-menu" id="team-menu" role="menu" aria-label="Team" hidden></div>
      </div>
      <div class="dd" id="dd-result">
        <button type="button" class="dd-btn" id="f-result" aria-haspopup="true" aria-expanded="false" aria-label="Result">
          <span class="dd-value">Any result</span>
        </button>
        <div class="dd-pop dd-menu" id="result-menu" role="menu" aria-label="Result" hidden></div>
      </div>
      <div class="al-search">
        <label class="al-glass" for="f-q" title="Search bets">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.5"/><line x1="10.6" y1="10.6" x2="14" y2="14"/></svg>
        </label>
        <input class="al-input" type="search" id="f-q" placeholder="Search bets…" aria-label="Search bets" autocomplete="off" spellcheck="false">
      </div>
      <button type="button" class="sched-reset" id="f-reset">Reset</button>
    </div>

    <div class="al-stats" id="al-stats"></div>
    <div class="al-graph" id="al-graph"></div>
    <!-- Bet type = Future only: open futures bucketed by their Chances. -->
    <div class="al-buckets" id="al-buckets" hidden></div>

    <div class="al-table-wrap">
      <table class="al-table" id="al-table">
        <thead id="al-head"></thead>
        <tbody id="al-body"></tbody>
      </table>
    </div>
    <div class="al-more" id="al-more"></div>
  </main>

  <script src="/scripts/primary/action-ledger.js"></script>
</body>
</html>
