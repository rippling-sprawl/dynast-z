          if (propPlayer) {
            rows = rows.filter(function (r) {
              return String(r.player_id) === propPlayer;
            });
          }
          html = rows.length ? propsTable(b, rows) : '';
        }
        tableEl.innerHTML = html ||
          '<div class="go-empty">No quotes for that combination.</div>';
      }

      viewsEl.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('button[data-prop-view]') : null;
        if (!btn || btn.disabled || !viewsEl.contains(btn)) return;
        propView = btn.getAttribute('data-prop-view');
        syncViews();
        draw();
      });

      mktMenu.addEventListener('click', function (e) {
        var opt = e.target.closest ? e.target.closest('.dd-opt') : null;
        if (!opt || !mktMenu.contains(opt)) return;
        propMarket = opt.getAttribute('data-mkt') || '';
        closeDropdown(mktDd, true);
        syncMarket();
        syncPlayers();
        draw();
      });

      plMenu.addEventListener('click', function (e) {
        var opt = e.target.closest ? e.target.closest('.dd-opt') : null;
        if (!opt || !plMenu.contains(opt)) return;
        propPlayer = opt.getAttribute('data-pl') || '';
        closeDropdown(plDd, true);
        syncPlayers();
        draw();
      });

      /* Delegated, because the tables under it are replaced on every draw and
       * a listener per price cell would be several hundred of them rebound
       * each time a view or a market changes. */
      tableEl.addEventListener('click', function (e) {
        var row = e.target, anchor = null;
        while (row && row !== tableEl &&
               !(row.getAttribute && row.getAttribute('data-pd'))) {
          /* The panel opens off the cell that was tapped rather than off the
           * row, which on a two-sided board is the width of the card: anchored
           * to the row it would open under the middle of the table however far
           * to one side the finger actually was. */
          if (row.nodeName === 'TD' || row.nodeName === 'TH') anchor = row;
          row = row.parentNode;
        }
        if (row && row !== tableEl) openPricePop(row, anchor);
      });

      syncViews();
      syncMarket();
      syncPlayers();
      draw();
    }

    /* ---------- injuries ----------
     * /player_injuries returns no team of its own — the team hangs off the
     * player — and embeds the full player record, so the generic table would
     * spread height, weight, college and jersey number across fourteen columns.
     * Five fields are worth reading and only two of them want a column.
     *
     * The club is a rowgroup heading rather than a column: the bundle already
     * sorts the report into away, home and whatever it could not place, so as
     * a column it was one of two values repeated down thirty rows, and finding
     * one team's injuries meant finding the boundary between them. Position,
     * designation and report time went the other way, down into the player
     * cell -- see injuryRow. Both moves hand their width to the comment, which
     * is the column that wanted it. */

    /* The feed reports in full ISO UTC — 2026-08-11T23:27:00.000Z, twenty-four
     * characters to say a Tuesday, sitting beside a designation badge on a
     * caption line. Cut to the day, in Eastern so the date agrees with the one
     * the club reported it on: a report is read for whether it is this week's
     * word or last week's, and the minute it was filed never changed that
     * reading. No year either -- nothing on this page is a season old. The
     * full stamp stays on the span's title for anyone who wants the rest. */
    function reportedET(iso) {
      var t = stamp(iso);
      if (t === null) return '';
      try {
        return new Date(t * 1000).toLocaleString('en-US', {
          timeZone: 'America/New_York', month: 'short', day: 'numeric'
        });
      } catch (e) { return String(iso); }
    }

    var INJ_COLS = 2;

    /* Two windows on the report date, both measured from now rather than from
     * the capture: the section only renders for a game that has not been
     * played (see injuriesApply), so the bundle behind it is one the refresh
     * plan is still touching, and the reader's today is the today the question
     * "is this still true?" is asked in.
     *
     * 18 days is a fortnight and change -- long enough that a designation
     * filed before the previous game still reads as current, short enough that
     * it lapses within a month. 27 stops a day short of four weeks, which is
     * about the point at which a note stops describing the player and starts
     * describing the roster: a man is a month into a season on IR, the comment
     * still says what he did in August, and it is not what anyone opened an
     * injury report for. Dropped rather than dimmed, because a stale row costs
     * the same height as a live one and the table is read by scanning it.
     *
     * A row with no date at all is kept. The feed sends those for a live
     * designation as readily as an old one -- that is the whole reason
     * carry_injury_dates exists -- and a missing timestamp is not evidence of
     * age. Better a stale row survives than a current one is hidden by
     * something the feed simply did not say. */
    var INJ_HOT_DAYS = 18;
    var INJ_STALE_DAYS = 27;

    /* -> days since the report, or null if it carries no date. */
    function reportAge(iso) {
      var t = stamp(iso);
      return t === null ? null : (Date.now() / 1000 - t) / 86400;
    }

    function dropStale(rows) {
      return rows.filter(function (r) {
        var age = reportAge(r.date);
        return age === null || age <= INJ_STALE_DAYS;
      });
    }

    /* Position, designation and report date are each one or two characters
     * wide, and as three columns of their own they were narrow strips holding
     * the comment -- the column a report is actually read for -- off the right
     * edge of the table. They sit in the player's cell instead, in two lines:
     * the name with its position after it, which is how a player is said out
     * loud, and under it the designation with the date it was given. The table
     * drops to the two things it is really carrying: who, and what the club
     * said about him.
     *
     * reportedCell went with them: the stamp is part of a caption now rather
     * than a cell of its own, and there is no other table asking for it. */
    function injuryRow(r) {
      var pl = r.player || {};
      var pos = String(pl.position_abbreviation || pl.position || '').trim();
      var meta = [];
      var age = reportAge(r.date);
      var badge = statusBadge(r.status, age !== null && age <= INJ_HOT_DAYS);
      if (badge) meta.push(badge);
      var upd = reportedET(r.date);
      if (upd) {
        meta.push('<span class="go-iupd" title="' + esc(r.date) + '">' +
          esc(upd) + '</span>');
      }
      return '<tr>' +
        '<td>' +
          '<span class="go-iname">' +
            esc(initialName(pl.first_name, pl.last_name)) +
            (pos ? '<span class="go-ipos">' + esc(pos) + '</span>' : '') +
          '</span>' +
          (meta.length ? '<span class="go-imeta">' + meta.join('') + '</span>'
                       : '') +
        '</td>' +
        '<td class="go-note">' + esc(r.comment || '') + '</td>' +
      '</tr>';
    }

    /* Copied before sorting: the rows belong to the bundle, which the rest of
     * the page reads too, and a table is not the place to reorder them for
     * everyone. Ties break on the name so a club's Out block is alphabetical
     * rather than in whatever order the feed happened to list it. */
    function sortByStatus(rows) {
      return rows.slice().sort(function (a, b) {
        var d = statusRank(a.status) - statusRank(b.status);
        if (d) return d;
        var an = String(((a.player || {}).last_name) || '');
        var bn = String(((b.player || {}).last_name) || '');
        return an.localeCompare(bn);
      });
    }

    function injuryTable(groups) {
      var body = groups.map(function (g) {
        return '<tr class="go-igrp"><th scope="rowgroup" colspan="' + INJ_COLS + '">' +
            '<span class="go-grp">' +
              (g.abbr ? teamLogo(g.abbr, 'go-logo-sm') : '') + esc(g.name) +
            '</span>' +
          '</th></tr>' +
          sortByStatus(g.rows).map(injuryRow).join('');
      }).join('');
      /* Comment is the one free-text column on the page, so it is the one
       * column that wraps and is capped rather than run out to whatever the
       * longest note happens to be. */
      return '<div class="go-scroll"><table class="go-table go-pinned go-inj">' +
        '<thead><tr>' +
        thCell(heading('Player', 'Position, designation and last report')) +
        thCell(heading('Comment', null), 'go-note') +
        '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }

    /* Whether the injury report still describes this game.
     *
     * /player_injuries has no as-of parameter and no history: it answers who is
     * hurt right now, league-wide, and a capture stores whatever it said the
     * day it ran. Backfilling 2025 therefore filed September 2026's injury list
     * under last November's games, where it reads as the report the clubs
     * actually published that week -- the caption line carries a day and a
     * month and deliberately no year, because nothing on this page was supposed
     * to be a season old.
     *
     * So the section is dropped once the game is behind us rather than shown
     * with a disclaimer: a current report is worth reading about a game that
     * has not happened, and about one in progress, and about a played one it is
     * only a wrong answer dressed as a right one. The test is final, or a
     * kickoff already gone by for a game the feed has not caught up with -- a
     * live game is still ahead of the injuries in the sense that matters. */
    function injuriesApply(b) {
      if (b.phase === 'live') return true;
      if (b.phase === 'final') return false;
      var k = stamp(b.game.kickoff_raw || b.game.kickoff_utc);
      return k === null || k >= Date.now() / 1000;
    }

    function injuriesSection(b) {
      var inj = b.injuries || {};
      var groups = [];
      var held = ['away', 'home', 'unknown'].reduce(function (n, side) {
        return n + (inj[side] || []).length;
      }, 0);
      /* Filtered here rather than in injuryTable so a club whose every row
       * has gone stale drops its heading with them, and a report that is
       * entirely stale falls through to the empty state below rather than
       * rendering as two logos over nothing. */
      ['away', 'home'].forEach(function (side) {
        var rows = dropStale(inj[side] || []);
        if (rows.length) {
          groups.push({ abbr: b.game[side].abbr, name: b.game[side].name,
            rows: rows });
        }
      });
      /* A row the bundle could not place against either club still carries a
       * team on the player, so it heads a block of its own rather than being
       * tipped into one anonymous "other" pile. */
      var byAbbr = {}, extra = [];
      dropStale(inj.unknown || []).forEach(function (r) {
        var t = (r.player || {}).team || {};
        var k = t.abbreviation || '';
        if (!byAbbr[k]) {
          byAbbr[k] = { abbr: k, name: t.full_name || 'Unplaced', rows: [] };
          extra.push(byAbbr[k]);
        }
        byAbbr[k].rows.push(r);
      });
      groups = groups.concat(extra);

      if (!groups.length) {
        /* Two different facts, and the fix for one is not the fix for the
         * other: an endpoint that answered with nothing is a bundle to re-run,
         * and a report whose every row has aged out is the filter working.
         * Saying so is also the only place the reader is told the filter
         * exists -- a row it drops from a report that still has rows left is
         * not worth a footnote, but a whole section is. */
        if (held) {
          return card('Injury report',
            '<div class="go-empty">Nothing reported in the last ' +
            INJ_STALE_DAYS + ' days. ' + held +
            (held === 1 ? ' older entry is' : ' older entries are') +
            ' held back as stale.</div>', true);
        }
        return card('Injury report',
          emptyState(b, ['/player_injuries'], 'injury data'), true);
      }
      return card('Injury report', injuryTable(groups));
    }

    /* Sibling games. This listed every captured game when there were four of
     * them; backfilling 2025 turned that into a 278-chip wall on every page,
     * and trimming it to the game's own slate only moved the problem — a
     * capped, re-sorted list of sixteen still spends the bottom of a page
     * about one game on fifteen others, and still has to explain what it left
     * out. The whole set has a page of its own now, so what stays here is the
     * door to it: one line, one link, and the count that says how much is
     * behind it. */
    function othersSection(index, currentId) {
      var games = (index && index.games) || {};
      var n = Object.keys(games).filter(function (id) {
        return id !== String(currentId);
      }).length;
      if (!n) return '';
      return card('Other captured games',
        '<div class="go-empty">' +
          '<a href="/football/schedule/archive">Browse the capture archive</a>' +
          ' — ' + n + ' other game' + (n === 1 ? '' : 's') +
          ' captured, listed by season and week.</div>', true);
    }

    function provenance(b) {
      var n = (b.unavailable || []).length;
      // Say so when the capture is not everything on offer. A prop board that
      // silently omits six books looks like a thin market rather than a choice.
      var filt = b.books_filter && b.books_filter.length
        ? ' · books <code>' + esc(b.books_filter.join(', ')) + '</code>'
        : '';
      return '<p class="go-prov">' +
        'Source <code>balldontlie</code> · game <code>' + esc(b.game.id) + '</code> · ' +
        'captured <code>' + esc(b.fetched_at) + '</code>' + filt +
        (n ? ' · <b>' + n + '</b> endpoint' + (n === 1 ? '' : 's') +
             ' unavailable on the key that fetched this' : '') +
        (b.refresh ? '<br>Refresh policy <code>' + esc(b.refresh.policy) +
          '</code> — ' + esc(b.refresh.note || '') +
          (b.refresh.frozen ? '' :
            ', so this is re-captured every ' + esc(gap(b.refresh.interval_s)) +
            ' by <code>scripts/bdl_refresh.py</code>') + '.' : '') +
        '<br>Published to Supabase by <code>scripts/fetch_bdl_game.py --publish</code>, ' +
        'swept by <code>scripts/bdl_refresh.py</code>. The page re-checks on the ' +
        'same schedule, so it does not need reloading.</p>';
    }

    /* ---------- render ---------- */

    /* ---------- nothing captured yet ----------
     *
     * The interesting half of this page. A bundle exists only once something
     * has fetched it, and until this sweep existed that meant somebody typing a
     * command, so 270-odd of the 272 rows on the schedule landed here. Now the
     * honest answer is a time, not an instruction — so the empty state looks the
     * game up in the committed schedule and says when it gets captured.
     *
     * Mirrors DISTANT_HORIZON in scripts/fetch_bdl_game.py, and is the only
     * piece of the refresh policy this page has to know for itself: a captured
     * game carries refresh_plan()'s real answer in its bundle, and a game that
     * was never captured has no bundle to carry one. */
    var CAPTURE_HORIZON_DAYS = 8;

    /* The season is named for the year it starts in and runs into February, so
     * through the winter both are live. Two files, ~40 KB each, served with an
     * hour of cache — and only ever fetched on this path, where the page has
     * nothing else to say. */
    function likelySeasons() {
      var d = new Date(), y = d.getFullYear();
      var cur = d.getMonth() >= 2 ? y : y - 1;
      return [cur, cur - 1];
    }

    var schedCache = null;

    function scheduleLookup(id) {
      if (!schedCache) {
        schedCache = Promise.all(likelySeasons().map(function (yr) {
          return fetch('/data/nfl_schedule_' + yr + '.json')
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }));
      }
      return schedCache.then(function (docs) {
        for (var i = 0; i < docs.length; i++) {
          var doc = docs[i];
          if (!doc) continue;
          for (var w = 0; w < (doc.weeks || []).length; w++) {
            var wk = doc.weeks[w];
            for (var j = 0; j < (wk.games || []).length; j++) {
              var g = wk.games[j];
              if (String(g.id) === String(id)) {
                return { id: String(g.id), away: g.away, home: g.home,
                         kickoff: g.kickoff, venue: g.venue, neutral: !!g.neutral,
                         week: wk.week, season: doc.season };
              }
            }
          }
        }
        return null;
      }).catch(function () { return null; });
    }

    function whenCaptured(row) {
      if (!row) {
        return 'This id is not on the 2026 or 2025 schedule, so nothing is ' +
          'scheduled to capture it. Check the id, or fetch it directly:';
      }
      var k = stamp(row.kickoff);
      if (k === null) return 'This game has no kickoff time yet, so there is ' +
        'nothing to schedule a capture against.';
      var now = Date.now() / 1000, out = k - now;
      var horizon = CAPTURE_HORIZON_DAYS * 86400;
      if (out > horizon) {
        var opens = new Date((k - horizon) * 1000);
        return 'Capture starts ' + CAPTURE_HORIZON_DAYS + ' days before kickoff — ' +
          'around ' + opens.toLocaleDateString('en-US',
            { weekday: 'short', month: 'short', day: 'numeric' }) +
          ', in about ' + gap(out - horizon) + '. Before then there is nothing ' +
          'to publish: the books have not posted a line.';
      }
      if (out > 0) {
        return 'This game is inside the capture window and has not been swept ' +
          'yet. The next sweep publishes it, and this page picks it up on its ' +
          'own — no reload needed.';
      }
      return 'This game finished without ever being captured. Settled games ' +
        'never change, so nothing re-checks them on a schedule; they get filled ' +
        'in deliberately:';
    }

    function needsCommand(row) {
      if (!row) return true;
      var k = stamp(row.kickoff);
      return k !== null && k < Date.now() / 1000;
    }

    function renderMissing(id, index, row) {
      var games = (index && index.games) || {};
      var known = Object.keys(games).length;
      var head = 'No game selected', body;

      if (!id) {
        crumbEl.textContent = 'Game';
        body = 'A game page is <code>/football/schedule/game/&lt;id&gt;</code>. ' +
          'Pick one below, or start from <a href="/football/schedule">the schedule</a>.';
      } else {
        var tag = row ? row.away + ' @ ' + row.home : 'game ' + id;
        crumbEl.textContent = tag;
        head = 'Not captured yet — ' + tag;
        body = (row
          ? '<div class="go-miss-head">' +
              '<span class="go-matchup go-matchup-sm">' +
                '<span class="go-side">' + teamLogo(row.away, 'go-logo-sm') +
                  esc(row.away) + '</span>' +
                '<span class="go-at">' + (row.neutral ? 'vs' : '@') + '</span>' +
                '<span class="go-side">' + teamLogo(row.home, 'go-logo-sm') +
                  esc(row.home) + '</span>' +
              '</span>' +
              '<span class="go-miss-when">' + esc(kickoffET(row.kickoff)) +
                (row.week ? ' \u00b7 week ' + esc(row.week) : '') + '</span>' +
            '</div>'
          : '') +
          whenCaptured(row) +
          (needsCommand(row)
            ? '<br><br><code>python3 scripts/bdl_refresh.py --game-id ' + esc(id) +
              ' --publish</code>'
            : '');
      }

      pageEl.innerHTML = card(head, '<div class="go-empty">' + body + '</div>', true) +
        (known ? othersSection(index, id) : '') +
        '<p class="go-prov">Every row on <a href="/football/schedule">the schedule</a> ' +
        'links here. ' + known + ' game' + (known === 1 ? '' : 's') +
        ' published so far, swept by <code>scripts/bdl_refresh.py</code>.</p>';
    }

    function render(b, index) {
      var g = b.game;
      crumbEl.textContent = g.away.abbr + ' @ ' + g.home.abbr;
      document.title = g.away.abbr + ' @ ' + g.home.abbr + ' | Dynast-Z';
      /* Before kickoff the prop board is the page: there is no box score and
       * no play log, and the lines are the only thing that has moved all week.
       * Once the game is under way that inverts -- what happened outranks what
       * it was priced at -- so the board drops below the play log rather than
       * sitting between the odds and the game itself. Built once either way;
       * only its position in the string changes. */
      var props = propsSection(b);
      var pregame = b.phase === 'pregame';
      pageEl.innerHTML =
        heroSection(b) +
        oddsSection(b) +
        (pregame ? props : '') +
        teamStatsSection(b) +
        playerStatsSection(b) +
        playsSection(b) +
        (pregame ? '' : props) +
        (injuriesApply(b) ? injuriesSection(b) : '') +
        othersSection(index, g.id);
      wireProps(b);
      wirePlays(b);
    }

    /* ---------- load, and keep loading ----------
     *
     * A game page left open across a kickoff should not have to be reloaded by
     * hand, so it re-checks on the bundle's own schedule: `refresh.next_ts` is
     * the moment the sweep intends to have replaced it. A settled game is never
     * polled at all. Being wrong about it is cheap: an unchanged game answers
     * `{unchanged: true}` in about sixty bytes and the endpoint reads only its
     * etag column to say so (see fetchBundle), so the cost of a poll that finds
     * nothing is a round trip and no more.
     *
     * Held to a 60-second floor whatever the plan says, paused while the tab is
     * hidden, and resumed on the way back — a backgrounded tab polling a live
     * game every two minutes for three hours is somebody's battery. */
    var MIN_POLL = 60;
    var MISSING_POLL = 180;     // not captured yet: the sweep decides, not us
    var currentIndex = null;
    var timer = null;
    var frozen = false;         // settled: nothing upstream will change again

    /* `cache: 'no-store'` is not belt-and-braces, it is the fix. The endpoint's
     * own headers do not survive the hop: every /api/* response comes back
     * re-encoded and stripped of its ETag, so a 404 arrives with nothing to
     * revalidate against — exactly the response iOS Safari keeps on disk and
     * replays, which is how a phone ends up pinned to "not captured yet" while
     * a desktop shows the full board. Going around the HTTP cache is what makes
     * the page correct.
     *
     * Going around it would also mean re-reading a megabyte on every poll, so
     * revalidation moved into the request instead: `known` is the etag of the
     * bundle already on the screen, and a game that has not moved answers with
     * `{unchanged: true}` and about sixty bytes. The endpoint reads only its
     * etag column to decide that, so an unchanged poll costs nothing at either
     * end. Nothing between here and the function can strip a query parameter.
     *
     * Three sentinels, because "keep what is on the screen" and "the screen is
     * wrong" are different answers:
     *   null       no bundle stored yet — repaint as empty, this is real news
     *   FAILED     the request fell over; a dropped connection on a phone is
     *              not evidence the game is uncaptured, and treating it as such
     *              wipes a board that was on the screen
     *   UNCHANGED  the bundle we are holding is still current */
    var FAILED = {};
    var UNCHANGED = {};
    var lastBundle = null;      // what is on the screen, for its etag and plan

    function fetchBundle(id) {
      var url = '/api/game-odds?game=' + encodeURIComponent(id);
      if (lastBundle && lastBundle.etag) {
        url += '&known=' + encodeURIComponent(lastBundle.etag);
      }
      // A 404 here is the ordinary "not captured yet" case, not an error.
      return fetch(url, { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) return r.status === 404 ? null : FAILED;
          return r.json().then(function (b) {
            return (b && b.unchanged) ? UNCHANGED : b;
          });
        })
        .catch(function () { return FAILED; });
    }

    function schedulePoll(id, b) {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!id) return;
      var wait;
      if (!b) {
        wait = MISSING_POLL;
      } else if (b.refresh && b.refresh.frozen) {
        frozen = true;          // settled: there is no next capture to wait for
        return;
      } else if (b.refresh && b.refresh.next_ts) {
        wait = b.refresh.next_ts - Date.now() / 1000;
      } else {
        wait = 300;             // a bundle from before refresh_plan existed
      }
      timer = setTimeout(function () { poll(id); },
                         Math.max(MIN_POLL, wait) * 1000);
    }

    function paint(id, b) {
      if (b === FAILED) {
        // Leave whatever is on the page alone and come back sooner than the
        // sweep would have us: the request failed, the game did not change.
        if (timer) { clearTimeout(timer); timer = null; }
        if (id) timer = setTimeout(function () { poll(id); }, MIN_POLL * 1000);
        return;
      }
      if (b === UNCHANGED) {
        // Confirmed current. Nothing to repaint; re-arm on the plan the bundle
        // we are already holding gave us.
        schedulePoll(id, lastBundle);
        return;
      }
      lastBundle = b || null;
      /* A repaint replaces the cell the panel is hanging off, and the panel is
       * on the body rather than in the table, so it would be left pointing at
       * a row that no longer exists. A poll that lands mid-read closes it. */
      closePop();
      if (b) render(b, currentIndex);
      else if (!id) renderMissing('', currentIndex, null);
      schedulePoll(id, b);
      if (!b && id) {
        scheduleLookup(id).then(function (row) {
          renderMissing(id, currentIndex, row);
        });
      }
    }

    function poll(id) {
      if (document.hidden) {
        // Come back when the tab does, rather than burning the request now.
        return schedulePoll(id, null);
      }
      fetchBundle(id).then(function (b) { paint(id, b); });
    }

    /* Coming back to the page is the moment its contents are most likely to be
     * wrong, and the two ways back are different events. `visibilitychange`
     * covers a tab switch; `pageshow` with `persisted` covers a bfcache
     * restore, where iOS hands back the rendered DOM from hours ago and
     * re-runs no script at all. Neither is gated on `timer` any more — a page
     * restored with no pending timer is the case that most needs the poll. */
    function resume() {
      var id = gameParam();
      if (id && !frozen) poll(id);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) resume();
    });

    window.addEventListener('pageshow', function (e) {
      if (e.persisted) resume();
    });

    function load() {
      var id = gameParam();
      // The index is fetched either way: it is what turns "nothing here" into
      // "nothing here, but these exist".
      var idxP = fetch(INDEX_URL, { cache: 'no-store' }).then(function (r) {
        return r.ok ? r.json() : null;
      }).catch(function () { return null; });

      Promise.all([id ? fetchBundle(id) : Promise.resolve(null), idxP])
        .then(function (res) {
          currentIndex = res[1];
          paint(id, res[0]);
        });
    }

    load();
  })();
  </script>
</body>
</html>
