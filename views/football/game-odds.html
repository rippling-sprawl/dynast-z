<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Home-screen install. The two *-capable tags are what make an iOS icon
       launch the site standalone — its own window, no address bar — instead of
       opening a Safari tab; the manifest says the same thing to everyone else,
       and to iOS 16.4+. standalone.js keys the drawer's share row off exactly
       that state, so dropping these tags silently removes the row too. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/app-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynast-Z">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Game Odds | Dynast-Z</title>
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <!-- The dropdown the props board filters with is /football/schedule's week
       menu, unchanged: same trigger, same panel, same keyboard. -->
  <link rel="stylesheet" href="/styles/components/nfl-pickers.css">
  <link rel="stylesheet" href="/styles/primary/game-odds.css">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/standalone.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/components/nfl-pickers.js"></script>
  <script>initPage();</script>

  <div class="masters-content go-wrap">
    <div class="masters-breadcrumbs">
      <a href="/football">Football</a><span class="separator">/</span>
      <a href="/football/schedule">Games</a><span class="separator">/</span>
      <span id="crumb">Game</span>
    </div>

    <div id="page"><p class="go-empty">Loading game…</p></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* One game, from /api/game-odds?game=<id> — the bundle
     * scripts/fetch_bdl_game.py writes to Supabase with --publish.
     *
     * Not a file under /data: a bundle is ~900 KB, nearly all of it player
     * props, and committing one per game would add ~15 MB a week during the
     * season to the repo forever. It lives in Supabase `game_odds` and moves on
     * a push with no deploy, the same split the Action Network book uses.
     *
     * Deep-linked by balldontlie game id, as the last segment of the path:
     * /football/schedule/game/1392216. It sits under the schedule because that
     * is the only thing that links to it, and the id is the same one the rows
     * carry since data/nfl_schedule_*.json moved to balldontlie as its source —
     * so there is no lookup table in between.
     *
     * The page is built to be mostly empty and still say something useful. Of
     * the six sections below, five are behind balldontlie's paid tiers, so on a
     * free key the honest render is a game header plus five explanations. Each
     * section states which tier it needs, taken from the bundle's own
     * `unavailable` notes rather than from a constant here — the fetcher already
     * recorded exactly why each endpoint refused, and repeating that judgement
     * in the page would be a second place to get it wrong.
     *
     * ES5 globals, like the rest of scripts/ — no modules, no build step.
     */

    var INDEX_URL = '/api/game-odds';

    var pageEl = document.getElementById('page');
    var crumbEl = document.getElementById('crumb');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* The same 32 files /football/schedule and the team picker use, served
     * from this app rather than hotlinked. No lazy loading here: there are at
     * most four on the page and two of them are above the fold. */
    var LOGO_DIR = '/assets/icons/nfl/';

    function teamLogo(abbr, cls, alt) {
      // The crest is decorative wherever the abbreviation sits beside it. In
      // the hero it is the only thing naming the team, so it takes the name.
      return '<img class="' + cls + '" src="' + LOGO_DIR + esc(abbr) +
        '.svg" alt="' + (alt ? esc(abbr) : '') + '"' +
        (alt ? '' : ' aria-hidden="true"') + '>';
    }

    /* The id is the last path segment, not a query parameter. Anchored and
     * digits-only for the same reason api/game-odds.py validates it: this value
     * ends up in a request URL, and a path is as capable of carrying junk as a
     * query string is. */
    var PATH_RE = /^\/football\/schedule\/game\/([0-9]{1,12})\/?$/;

    function gameParam() {
      var m = PATH_RE.exec(location.pathname || '');
      return m ? m[1] : '';
    }

    /* ---------- formatting ---------- */

    /* Stat keys arrive as snake_case straight off the API. Title-casing them is
     * the floor, and it is what keeps the bundle a faithful copy of what was
     * fetched: a field the API adds tomorrow still renders under a readable
     * name rather than vanishing because nobody updated a map.
     *
     * Above that floor sit the ABBR maps below, which shorten the ~130 headings
     * this page can draw to the forms a box score is actually read in. The
     * widths are the argument: "Long Reception" is four times the width of the
     * number under it and pushes eight sibling columns off the screen, where
     * "LNG" does not. They are overrides, not a replacement — a key with no
     * entry falls through to label() — and every abbreviated heading carries
     * its long form as a title, so nothing that was on the page is gone, only
     * folded up. */
    function label(key) {
      return String(key).replace(/_/g, ' ').replace(/\b\w/g, function (c) {
        return c.toUpperCase();
      });
    }

    /* The tooltips are built out of label(), which title-cases every word and
     * so turns the acronyms in these keys into words: `qbr` reads "Qbr" and
     * `anytime_td` reads "Anytime Td". Spelled-out is the whole point of a
     * tooltip, so the handful of keys that are acronyms are put back up. */
    var ACRONYM = {
      Qb: 'QB', Qbr: 'QBR', Td: 'TD', Tds: 'TDs', Fg: 'FG', Fgs: 'FGs',
      Int: 'INT', Ints: 'INTs', Rz: 'RZ', Xp: 'XP', Ot: 'OT', Pat: 'PAT'
    };

    function fullLabel(key) {
      return label(key).replace(/[A-Za-z]+/g, function (w) {
        return ACRONYM[w] || w;
      });
    }

    /* A heading is the short form plus the long one it stands for. `t` is null
     * when the two say the same thing, so an unabbreviated heading gets no
     * tooltip rather than one that repeats the text already under the cursor.
     * Compared case-insensitively: "QBR" abbreviates nothing when the long form
     * is also QBR, however label() happened to case it. */
    function heading(short, full) {
      var same = full && String(full).toLowerCase() === String(short).toLowerCase();
      return { s: short, t: (full && !same) ? full : null };
    }

    function thCell(h, cls) {
      if (typeof h === 'string') h = heading(h, null);
      return '<th' + (cls ? ' class="' + cls + '"' : '') +
        (h.t ? ' title="' + esc(h.t) + '"' : '') + '>' + esc(h.s) + '</th>';
    }

    /* ---------- abbreviations ----------
     * Keyed on the JSON path a value arrives under rather than on its rendered
     * string, so a heading can be traced back to the field it came from by
     * grepping the key, and the map does not break the day balldontlie changes
     * its own title-casing.
     *
     * Scoped per section because the same key wants a different width in
     * different places: `passing_attempts` is "Att" in a team comparison with
     * one stat per row and acres of space, and "ATT" in a box score where nine
     * numeric columns share that row. */

    /* team_stats.away|home.* */
    var TEAM_ABBR = {
      first_downs: '1st Downs', first_downs_passing: '1st D Pass',
      first_downs_rushing: '1st D Rush', first_downs_penalty: '1st D Pen',
      third_down_efficiency: '3rd Down %', third_down_conversions: '3rd Down Conv',
      third_down_attempts: '3rd Down Att', fourth_down_efficiency: '4th Down %',
      fourth_down_conversions: '4th Down Conv', fourth_down_attempts: '4th Down Att',
      total_offensive_plays: 'Off Plays', total_yards: 'Tot Yds',
      yards_per_play: 'Y/P', total_drives: 'Drives',
      net_passing_yards: 'Net Pass Yds', passing_completions: 'Comp',
      passing_attempts: 'Att', yards_per_pass: 'Y/A', sacks: 'Sacks',
      sack_yards_lost: 'Sack Yds', rushing_yards: 'Rush Yds',
      rushing_attempts: 'Rush Att', yards_per_rush_attempt: 'Y/C',
      red_zone_scores: 'RZ Scores', red_zone_attempts: 'RZ Att',
      penalties: 'Pen', penalty_yards: 'Pen Yds', turnovers: 'TO',
      fumbles_lost: 'Fum Lost', interceptions_thrown: 'INT',
      defensive_touchdowns: 'Def TD', possession_time: 'TOP'
    };

    /* player_stats.away|home[].<group>.* */
    var STAT_ABBR = {
      passing: {
        passing_completions: 'CMP', passing_attempts: 'ATT',
        passing_yards: 'YDS', yards_per_pass_attempt: 'Y/A',
        passing_touchdowns: 'TD', passing_interceptions: 'INT',
        sacks: 'SK', sacks_loss: 'SKYL', qbr: 'QBR', qb_rating: 'RTG'
      },
      rushing: {
        rushing_attempts: 'ATT', rushing_yards: 'YDS',
        yards_per_rush_attempt: 'AVG', rushing_touchdowns: 'TD',
        long_rushing: 'LNG'
      },
      receiving: {
        receptions: 'REC', receiving_yards: 'YDS',
        yards_per_reception: 'AVG', receiving_touchdowns: 'TD',
        long_reception: 'LNG', receiving_targets: 'TGT'
      },
      defense: {
        total_tackles: 'TCK', defensive_sacks: 'SK', solo_tackles: 'SOLO',
        tackles_for_loss: 'TFL', passes_defended: 'PD', qb_hits: 'QBH',
        defensive_interceptions: 'INT', interception_yards: 'IYDS',
        interception_touchdowns: 'ITD'
      },
      kicking: {
        field_goal_attempts: 'FGA', field_goals_made: 'FGM',
        field_goal_pct: 'FG%', long_field_goal_made: 'LNG',
        extra_points_made: 'XPM', total_points: 'PTS'
      },
      returns: {
        kick_returns: 'KR', kick_return_yards: 'KR YDS',
        yards_per_kick_return: 'KR AVG', long_kick_return: 'KR LNG',
        kick_return_touchdowns: 'KR TD', punt_returns: 'PR',
        punt_return_yards: 'PR YDS', yards_per_punt_return: 'PR AVG',
        long_punt_return: 'PR LNG', punt_return_touchdowns: 'PR TD'
      },
      punting: {
        punts: 'PUNTS', punt_yards: 'YDS', gross_avg_punt_yards: 'AVG',
        touchbacks: 'TB', punts_inside_20: 'IN20', long_punt: 'LNG'
      },
      fumbles: {
        fumbles: 'FUM', fumbles_lost: 'LOST', fumbles_recovered: 'REC',
        fumbles_touchdowns: 'TD'
      }
    };

    /* player_props.markets[] / player_props.<which>[].prop_type — the market
     * <select>. A period is a mechanical suffix on half of the 35 markets, so
     * it is split off, the base abbreviated, and the period put back. Listing
     * every combination would be 35 rows that disagree with each other the
     * first time a market picks up a suffix the list does not have. */
    var MARKET_ABBR = {
      anytime_td: 'Anytime TD', first_td: 'First TD', fg_made: 'FG Made',
      kicking_points: 'Kicking Pts', interceptions: 'INT Thrown',
      passing_attempts: 'Pass Att', passing_completions: 'Pass Comp',
      passing_tds: 'Pass TD', passing_yards: 'Pass Yds',
      receptions: 'Rec', receiving_yards: 'Rec Yds',
      rushing_attempts: 'Rush Att', rushing_yards: 'Rush Yds',
      rushing_receiving_yards: 'Rush+Rec Yds', longest_rush: 'Long Rush'
    };

    var PERIOD = { '1q': '1Q', '2q': '2Q', '3q': '3Q', '4q': '4Q',
                   '1h': '1H', '2h': '2H' };

    function marketHeading(key) {
      var k = String(key == null ? '' : key), suffix = '';
      var m = /^(.*)_(1q|2q|3q|4q|1h|2h)$/.exec(k);
      if (m) { k = m[1]; suffix = ' (' + PERIOD[m[2]] + ')'; }
      return heading((MARKET_ABBR[k] || label(k)) + suffix,
                     fullLabel(k) + suffix);
    }

    function teamHeading(key) {
      return heading(TEAM_ABBR[key] || label(key), fullLabel(key));
    }

    /* injuries.away|home|unknown[].status. Matched case-insensitively and
     * carrying more than the six statuses these bundles happen to contain: the
     * rest of the designation list turns up in-season, and a status with no
     * entry renders whole rather than blank. */
    var STATUS_ABBR = {
      'questionable': 'Q', 'doubtful': 'D', 'out': 'OUT',
      'injured reserve': 'IR', 'ir': 'IR', 'ir-r': 'IR-R',
      'pup-p': 'PUP-P', 'pup-r': 'PUP-R', 'nfi-a': 'NFI-A', 'nfi-r': 'NFI-R',
      'reserve-dnr': 'DNR', 'suspended': 'SUSP', 'active': 'ACT'
    };

    /* Questionable and Out are the two designations the report is scanned for
     * -- one is a lineup question and the other closes it -- so those two
     * carry colour and the rest of the list stays neutral. A season-long
     * designation like IR or PUP is a fact about the roster rather than about
     * Sunday, and colouring all twelve would leave nothing standing out. */
    var STATUS_TONE = { 'questionable': 'is-q', 'out': 'is-out' };

    /* The exception to the paragraph above, and the reason it is worded as it
     * is: a reserve designation is a fact about the roster *once it has been
     * one for a while*. In the fortnight after it is filed it is the loudest
     * thing on the report -- a starter has just gone on IR, and the club has
     * not replaced him yet -- and reading it off a grey pill identical to the
     * eleven men who went on the list in July is the one case where the
     * neutral default hides the news. So a reserve status carries the same red
     * as Out while its report is recent, and fades to grey on its own. */
    var STATUS_RESERVE = {
      'injured reserve': 1, 'ir': 1, 'ir-r': 1, 'pup-p': 1, 'pup-r': 1
    };

    /* Sort order within a club. The feed hands the report back in no order
     * anyone would choose -- roughly the order the rows were written -- so the
     * player who is ruled out sits between two men on IR from August. Ordered
     * by how much the designation says about Sunday instead: the three game
     * statuses first, hardest first, then the season-long reserve lists, then
     * anyone listed active. A designation with no entry lands between the two
     * halves rather than at either end, on the reasoning that an unrecognised
     * status is more likely to be a new game designation than a new list. */
    var STATUS_RANK = {
      'out': 0, 'doubtful': 1, 'questionable': 2,
      'injured reserve': 4, 'ir': 4, 'ir-r': 5, 'pup-p': 6, 'pup-r': 7,
      'nfi-a': 8, 'nfi-r': 9, 'reserve-dnr': 10, 'suspended': 11,
      'active': 12
    };

    function statusRank(v) {
      var k = String(v == null ? '' : v).trim().toLowerCase();
      var r = STATUS_RANK[k];
      return r === undefined ? 3 : r;
    }

    /* `hot` is passed by the injury report for a reserve designation filed
       inside INJ_HOT_DAYS; nothing else on the page calls this with it. */
    function statusBadge(v, hot) {
      var full = String(v == null ? '' : v).trim();
      if (!full) return '';
      var k = full.toLowerCase();
      var h = heading(STATUS_ABBR[k] || full, full);
      var tone = STATUS_TONE[k] || (hot && STATUS_RESERVE[k] ? 'is-hot'
                                                            : 'is-plain');
      return '<span class="go-ibadge ' + tone + '"' +
        (h.t ? ' title="' + esc(h.t) + '"' : '') + '>' + esc(h.s) + '</span>';
    }

    function isNum(v) { return typeof v === 'number'; }

    /* Players are named in three tables that are all short on width -- the box
     * score, the prop board and the injury report -- and the given name is the
     * part none of them are read for. "P. Mahomes" identifies the same player
     * and hands the width back to the numbers beside it. */
    function initialName(first, last) {
      var f = String(first == null ? '' : first).trim();
      var l = String(last == null ? '' : last).trim();
      if (!f) return l;
      if (!l) return f;
      return f.charAt(0).toUpperCase() + '. ' + l;
    }

    /* The prop board carries the name already joined, so it is split back on
     * the first space only -- everything after it is the surname, which leaves
     * "Amon-Ra St. Brown" and "Michael Pittman Jr." intact. */
    function shortenName(full) {
      var s = String(full == null ? '' : full).trim();
      var i = s.indexOf(' ');
      return i < 0 ? s : initialName(s.slice(0, i), s.slice(i + 1));
    }

    function cell(v) {
      if (v === null || v === undefined || v === '') {
        return '<td class="is-null">—</td>';
      }
      if (isNum(v)) return '<td class="is-num">' + esc(v) + '</td>';
      if (typeof v === 'object') return '<td>' + esc(JSON.stringify(v)) + '</td>';
      return '<td>' + esc(v) + '</td>';
    }

    /* ---------- freshness ----------
     * When this bundle was captured, and when it changes next. Both are read
     * off the bundle rather than decided here: `fetched_at` is stamped by the
     * fetcher, and `refresh` is refresh_plan()'s answer in
     * scripts/fetch_bdl_game.py — the same function scripts/bdl_refresh.py
     * sweeps on. So the "next in 6h" this page prints is the cadence a sweep
     * will actually run, not a second guess at it. */

    function gap(secs) {
      var s = Math.abs(Math.round(secs));
      if (s < 60) return s + 's';
      if (s < 5400) return Math.round(s / 60) + 'm';
      if (s < 172800) return Math.round(s / 3600) + 'h';
      return Math.round(s / 86400) + 'd';
    }

    function stamp(iso) {
      if (!iso) return null;
      var t = Date.parse(String(iso).replace(/T(\d\d:\d\d)Z$/, 'T$1:00Z'));
      return isFinite(t) ? t / 1000 : null;
    }

    function kickoffET(iso) {
      var t = stamp(iso);
      if (t === null) return '';
      try {
        return new Date(t * 1000).toLocaleString('en-US', {
          timeZone: 'America/New_York', weekday: 'short', month: 'short',
          day: 'numeric', hour: 'numeric', minute: '2-digit'
        }) + ' ET';
      } catch (e) { return String(iso); }
    }

    /* Rendered next to the phase chip, because "final" and "captured four
     * months ago" are two different facts and only one of them was on the page.
     * A bundle written before refresh_plan existed has no `refresh` block, so
     * the age stands on its own rather than the whole line disappearing. */
    function freshness(b) {
      var now = Date.now() / 1000;
      var at = stamp(b.fetched_at);
      var r = b.refresh || null;
      var bits = [];
      if (at !== null) bits.push('updated ' + gap(now - at) + ' ago');
      if (r && r.frozen) bits.push('no longer updating');
      else if (r && r.next_ts) {
        bits.push(now >= r.next_ts ? 'next due now'
                                   : 'next in ' + gap(r.next_ts - now));
      }
      if (!bits.length) return '';
      return '<span class="go-fresh"' +
        (r && r.note ? ' title="' + esc(r.note) + '"' : '') + '>' +
        esc(bits.join(' \u00b7 ')) + '</span>';
    }

    /* ---------- generic table ----------
     * Used for odds and props, whose row shapes are undocumented and have never
     * been observed against a live key. Rendering the union of whatever keys
     * arrive cannot be wrong, and is the quickest way to learn the real shape
     * the first time a paid key runs. Nested objects (a player, a team) are
     * flattened one level so their fields become columns rather than JSON. */
    function flatten(row) {
      var out = {};
      Object.keys(row).forEach(function (k) {
        var v = row[k];
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          Object.keys(v).forEach(function (k2) {
            if (v[k2] === null || typeof v[k2] !== 'object') out[k + '.' + k2] = v[k2];
          });
        } else {
          out[k] = v;
        }
      });
      return out;
    }

    function genericTable(rows, labelFn) {
      var headFn = labelFn || label;
      if (!rows || !rows.length) return '';
      var flat = rows.map(flatten);
      var keys = [];
      flat.forEach(function (r) {
        Object.keys(r).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
      });
      // Drop columns that are null in every row — an undocumented payload
      // carries a lot of them and they add nothing but width.
      keys = keys.filter(function (k) {
        return flat.some(function (r) { return r[k] !== null && r[k] !== undefined; });
      });
      return '<div class="go-scroll"><table class="go-table"><thead><tr>' +
        keys.map(function (k) { return thCell(headFn(k)); }).join('') +
        '</tr></thead><tbody>' +
        flat.map(function (r) {
          return '<tr>' + keys.map(function (k) { return cell(r[k]); }).join('') + '</tr>';
        }).join('') +
        '</tbody></table></div>';
    }

    /* ---------- sections ---------- */

    function unavailableFor(bundle, paths) {
      var notes = bundle.unavailable || [];
      for (var i = 0; i < notes.length; i++) {
        if (paths.indexOf(notes[i].path) >= 0) return notes[i];
      }
      return null;
    }

    function emptyState(bundle, paths, what) {
      var note = unavailableFor(bundle, paths);
      if (!note) {
        return '<div class="go-empty">No ' + esc(what) +
          ' in this bundle — the endpoint answered, with nothing in it.</div>';
      }
      var tier = String(note.needs_tier || '').toUpperCase();
      var reason = note.error === 'CassetteMiss'
        ? 'was never recorded, so <code>--replay</code> has nothing to serve'
        : 'needs a plan this key is not on';
      return '<div class="go-empty">' +
        'No ' + esc(what) + ' captured. <code>' + esc(note.path) + '</code> ' + reason +
        ' — <span class="go-tier">' + esc(tier) + '</span><br>' +
        'Re-run <code>python3 scripts/fetch_bdl_game.py --game-id ' +
        esc(bundle.game.id) + ' --record --publish</code> on a ' + esc(tier) +
        ' key and this section fills in.</div>';
    }

    /* `head` is markup dropped in the card head beside the title rather than
     * appended to the body: a control that switches the whole card belongs on
     * the same line as the card's name, not on a strip the reader has to take
     * as a first row of content. Escaped titles, raw head -- the only caller
     * passing one builds it here. */
    function card(title, body, flush, head) {
      return '<section class="go-card">' +
        '<div class="go-card-head"><h3>' + esc(title) + '</h3>' +
        (head || '') + '</div>' +
        '<div class="go-card-body' + (flush ? ' is-flush' : '') + '">' +
        body + '</div></section>';
    }

    /* The chip is the whole status line now. Before kickoff that is the
     * kickoff itself -- the only fact a scheduled game has -- and afterwards it
     * is where the game is, in words rather than the bundle's `pregame` /
     * `live` / `final` enum. An unrecognised phase falls back to its own name
     * so a new one from the feed shows up rather than rendering blank. */
    var PHASE_TEXT = { live: 'In progress', final: 'Final' };

    function phaseText(b) {
      var g = b.game;
      if (b.phase === 'pregame') {
        return kickoffET(g.kickoff_raw || g.kickoff_utc) || g.kickoff_et || 'Scheduled';
      }
      return PHASE_TEXT[b.phase] || label(b.phase || '');
    }

    function heroSection(b) {
      var g = b.game;
      var sc = g.score;
      var aw = '', hw = '';
      if (sc && sc.away !== null && sc.home !== null) {
        aw = sc.away > sc.home ? ' is-win' : (sc.away < sc.home ? ' is-loss' : '');
        hw = sc.home > sc.away ? ' is-win' : (sc.home < sc.away ? ' is-loss' : '');
      }
      // The quarter table is drawn only once there is a game to draw it from.
      var line = '';
      if (sc && sc.away_line) {
        var cols = ['1', '2', '3', '4', 'OT'];
        // Overtime column only when someone actually scored in it.
        var n = (sc.away_line[4] || sc.home_line[4]) ? 5 : 4;
        line = '<table class="go-line"><thead><tr><th></th>' +
          cols.slice(0, n).map(function (c) { return '<th>' + c + '</th>'; }).join('') +
          '<th>T</th></tr></thead><tbody>' +
          [['away', g.away.abbr, sc.away_line, sc.away],
           ['home', g.home.abbr, sc.home_line, sc.home]].map(function (r) {
            return '<tr><td>' + esc(r[1]) + '</td>' +
              r[2].slice(0, n).map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') +
              '<td class="go-total">' + esc(r[3]) + '</td></tr>';
          }).join('') + '</tbody></table>';
      }

      /* The two crests are the headline and they sit at the far edges, away on
       * the left and home on the right, so the column between them is free for
       * everything that answers "where is this game": the neutral-site marker,
       * the status chip with its freshness line, and the venue. The venue needs
       * no "Venue" label down there -- a stadium name between two crests is
       * only ever the place they are playing. */
      return '<div class="go-hero"><div class="go-hero-top">' +
        '<span class="go-team' + aw + '">' +
          teamLogo(g.away.abbr, 'go-crest', true) + '</span>' +
        '<div class="go-hero-mid">' +
          '<span class="go-at">' + (g.neutral ? 'vs' : '@') + '</span>' +
          '<span class="go-status">' +
            '<span class="go-phase ' + esc(b.phase) + '">' + esc(phaseText(b)) + '</span>' +
            freshness(b) +
          '</span>' +
          (g.venue ? '<span class="go-venue">' + esc(g.venue) + '</span>' : '') +
        '</div>' +
        '<span class="go-team' + hw + '">' +
          teamLogo(g.home.abbr, 'go-crest', true) + '</span>' +
        '</div>' +
        line + '</div>';
    }

    /* An empty section is worth a card only once there is something for it to
     * be empty *of*. After kickoff "no team stats" is news — the capture is
     * behind, or the key is on the wrong plan, and the card says which. Before
     * it, the same card says a game that has not been played has no statistics,
     * three times over, between the odds and the injury report. So team stats,
     * the box score and the play log draw nothing at all in the pregame phase,
     * and reappear the moment the bundle has rows for them — the test is the
     * data, not the phase, so a game whose phase is behind its feed still
     * renders what arrived. */
    function playedYet(b) { return b.phase !== 'pregame'; }

    function teamStatsSection(b) {
      var a = b.team_stats && b.team_stats.away;
      var h = b.team_stats && b.team_stats.home;
      if (!a || !h) {
        return playedYet(b)
          ? card('Team stats', emptyState(b, ['/team_stats'], 'team stats'), true)
          : '';
      }
      /* possession_time_seconds is possession_time in a unit nobody reads a
       * clock in — 33:11 and 1991 are one row, not two. */
      var skip = { game: 1, team: 1, home_away: 1, possession_time_seconds: 1 };
      var keys = Object.keys(a).filter(function (k) {
        return !skip[k] && (typeof a[k] !== 'object' || a[k] === null);
      });
      var rows = keys.map(function (k) {
        var av = a[k], hv = h[k];
        var ab = isNum(av) && isNum(hv) && av > hv ? ' is-better' : '';
        var hb = isNum(av) && isNum(hv) && hv > av ? ' is-better' : '';
        var hd = teamHeading(k);
        return '<tr><td class="go-val' + ab + '">' + esc(av === null ? '—' : av) + '</td>' +
          '<td class="go-stat"' + (hd.t ? ' title="' + esc(hd.t) + '"' : '') + '>' +
            esc(hd.s) + '</td>' +
          '<td class="go-val' + hb + '">' + esc(hv === null ? '—' : hv) + '</td></tr>';
      }).join('');
      /* The crest alone names the column -- the abbreviation beside it said the
       * same thing twice in a table three columns wide, so the logo takes the
       * space it was using and the alt text it was carrying. */
      return card('Team stats',
        '<table class="go-vs"><thead><tr>' +
          '<th class="go-vs-team">' +
            teamLogo(b.game.away.abbr, 'go-vs-logo', true) + '</th><th></th>' +
          '<th class="go-vs-team">' +
            teamLogo(b.game.home.abbr, 'go-vs-logo', true) + '</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>');
    }

    /* The fallback for a box-score key STAT_ABBR has no entry for — a field
     * balldontlie adds after this map was written.
     *
     * A stat's group already names it. Under the Receiving heading, a column
     * called "Receiving Targets" says "receiving" twice and pushes the word that
     * distinguishes it — Targets — to where it is read last. So the group's own
     * prefix comes off its children, which is most of the way to the
     * abbreviation and costs nothing to keep for the keys nobody has seen yet.
     *
     * The prefixes are listed rather than derived from the group name, because
     * three of them do not match it: defense's fields are `defensive_*`,
     * kicking's are `field_goal*`, punting's are `punt_*`. And `returns` is
     * deliberately empty — its fields are `kick_return_yards` and
     * `punt_return_yards`, so stripping to "Yards" would produce two identically
     * named columns and lose the only thing that told them apart.
     *
     * Only a prefix that leaves something behind is removed: the `fumbles` group
     * contains a bare `fumbles`, which must stay "Fumbles" rather than become
     * blank. */
    var GROUP_PREFIX = {
      passing: ['passing_'],
      rushing: ['rushing_'],
      receiving: ['receiving_'],
      fumbles: ['fumbles_'],
      defense: ['defensive_'],
      kicking: ['field_goals_', 'field_goal_'],
      punting: ['punt_'],
      returns: []
    };

    function groupLabel(grp) {
      var prefixes = GROUP_PREFIX[grp] || [grp + '_'];
      var map = STAT_ABBR[grp] || {};
      /* The tooltip is always the whole key spelled out — "Receiving Yards",
       * not the "Yards" the prefix-stripping would leave. Under a Receiving
       * heading the group is obvious in the column and useless in the tooltip,
       * which is read on its own. */
      return function (key) {
        if (map[key]) return heading(map[key], fullLabel(key));
        for (var i = 0; i < prefixes.length; i++) {
          var p = prefixes[i];
          if (key.indexOf(p) === 0 && key.length > p.length) {
            return heading(label(key.slice(p.length)), fullLabel(key));
          }
        }
        return heading(label(key), null);
      };
    }

    function playerStatsSection(b) {
      var ps = b.player_stats || {};
      var total = ['away', 'home'].reduce(function (n, s) {
        return n + ((ps[s] || []).length);
      }, 0);
      if (!total) {
        return playedYet(b)
          ? card('Box score', emptyState(b, ['/stats'], 'player stats'), true)
          : '';
      }
      var groups = ['passing', 'rushing', 'receiving', 'defense', 'kicking',
                    'returns', 'punting', 'fumbles'];
      var html = '';
      ['away', 'home'].forEach(function (side) {
        var rows = ps[side] || [];
        if (!rows.length) return;
        html += '<h4 class="go-bs-team">' + esc(b.game[side].name) + '</h4>';
        groups.forEach(function (grp) {
          var withGrp = rows.filter(function (r) { return r[grp]; });
          if (!withGrp.length) return;
          var flat = withGrp.map(function (r) {
            var o = { player: initialName((r.player || {}).first_name,
              (r.player || {}).last_name) || (r.player || {}).id };
            Object.keys(r[grp]).forEach(function (k) { o[k] = r[grp][k]; });
            return o;
          });
          html += '<div class="go-sub go-bs-grp">' + esc(label(grp)) + '</div>' +
            genericTable(flat, groupLabel(grp));
        });
      });
      return card('Box score', html);
    }

    /* Overtime is period 5 and up, so it was rendering as "Q5" -- not a
     * quarter, and not something the quarter filters below could name either.
     * One label function now answers both. */
    function periodLabel(n) {
      var p = Number(n);
      if (!(p > 0)) return '';
      return p > 5 ? 'OT' + (p - 4) : (p > 4 ? 'OT' : 'Q' + p);
    }

    function playRow(pl) {
      return '<div class="go-play' + (pl.scoring_play ? ' is-scoring' : '') + '">' +
        '<span class="go-clock">' + esc(periodLabel(pl.period)) + ' ' +
          esc(pl.clock_display || '') + '</span>' +
        '<span class="go-pteam">' + esc((pl.team || {}).abbreviation || '') + '</span>' +
        '<span class="go-ptext">' + esc(pl.text || pl.short_text || '') + '</span>' +
        '<span class="go-pscore">' + esc(pl.away_score) + '–' + esc(pl.home_score) +
        '</span></div>';
    }

    /* A filter is one predicate over rows that are already on the page -- the
     * whole log ships inside the bundle, so switching view is not a fetch and
     * not a re-render of anything but the list. `scoring` reads the feed's own
     * flag rather than matching on the play text, and a quarter key is just the
     * period number it ends with, which is what lets the overtime chips fall
     * out of the same three lines. */
    function playPredicate(key) {
      if (key === 'scoring') return function (pl) { return !!pl.scoring_play; };
      if (key.charAt(0) === 'q') {
        var n = parseInt(key.slice(1), 10);
        return function (pl) { return Number(pl.period) === n; };
      }
      return function () { return true; };
    }

    /* Q1 through Q4 always, so a game at halftime offers the same controls a
     * final one does and an empty quarter reads as "not yet" rather than as a
     * missing button. Overtime is the exception: those chips appear only when
     * the log actually reaches that period, because most games never do. */
    function playFilters(p) {
      var periods = [1, 2, 3, 4];
      (p.all || []).forEach(function (pl) {
        var n = Number(pl.period);
        if (n > 4 && periods.indexOf(n) < 0) periods.push(n);
      });
      periods.sort(function (a, c) { return a - c; });
      var out = [{ key: 'all', text: 'All' }];
      periods.forEach(function (n) { out.push({ key: 'q' + n, text: periodLabel(n) }); });
      if (p.scoring_count) out.push({ key: 'scoring', text: 'Scoring' });
      return out;
    }

    function playsSection(b) {
      var p = b.plays || { count: 0, all: [] };
      if (!p.count) {
        return playedYet(b)
          ? card('Play log', emptyState(b, ['/plays'], 'plays'), true)
          : '';
      }
      var seg = playFilters(p).map(function (f, i) {
        return '<button type="button" data-play-filter="' + esc(f.key) +
          '" aria-pressed="' + (i ? 'false' : 'true') + '">' + esc(f.text) +
          '</button>';
      }).join('');
      return card('Play log',
        '<div class="go-seg" id="play-filters">' + seg + '</div>' +
        '<div class="go-plays" id="play-list"></div>', true);
    }

    /* Wired after every render for the same reason wireProps is: a poll
     * replaces the section wholesale and takes its listeners with it. */
    function wirePlays(b) {
      var segEl = document.getElementById('play-filters');
      var listEl = document.getElementById('play-list');
      if (!segEl || !listEl) return;
      var all = (b.plays || {}).all || [];

      function draw(key) {
        var rows = all.filter(playPredicate(key));
        listEl.innerHTML = rows.length
          ? rows.map(playRow).join('')
          : '<div class="go-empty">No plays in that filter yet.</div>';
      }

      segEl.addEventListener('click', function (e) {
        var btn = e.target && e.target.getAttribute &&
          e.target.getAttribute('data-play-filter') !== null ? e.target : null;
        if (!btn) return;
        var buttons = segEl.querySelectorAll('[data-play-filter]');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].setAttribute('aria-pressed',
            buttons[i] === btn ? 'true' : 'false');
        }
        draw(btn.getAttribute('data-play-filter'));
      });
      draw('all');
    }

    /* ---------- odds ----------
     * Shape settled by probing a live key, not by the docs: one row per
     * sportsbook with spread / moneyline / total in flat columns, and the book
     * in `vendor`. Rendered as one small table per book rather than one wide
     * one: laid out flat, the two sides of every market sit in eight columns
     * that no phone can hold, so the table scrolled sideways and the price a
     * reader came for was off-screen. Pivoted, a book is four columns — team,
     * spread, moneyline, total — and the two teams are the two rows, which
     * fits without scrolling and puts the two sides of a market adjacent. */

    /* Books arrive as their API slug — `draftkings`, `fanduel`. The odds card
     * heads a book's table with it and the props board lists it beside a price,
     * both times against narrow numeric columns where the full name is several
     * times the width of the numbers, so it is shortened to the ticker a
     * line-shopping grid is read with. An unmapped book falls back to its slug
     * uppercased: wrong-looking enough to notice and add rather than quietly
     * rendering as something else. */
    var BOOK_SHORT = {
      draftkings: 'DK', fanduel: 'FD', betmgm: 'MGM', caesars: 'CZR',
      betrivers: 'BR', fanatics: 'FAN', espnbet: 'ESPN', bet365: 'B365',
      pointsbet: 'PB', hardrock: 'HR'
    };

    var BOOK_NAME = {
      draftkings: 'DraftKings', fanduel: 'FanDuel', betmgm: 'BetMGM',
      caesars: 'Caesars', betrivers: 'BetRivers', fanatics: 'Fanatics',
      espnbet: 'ESPN BET', bet365: 'bet365', pointsbet: 'PointsBet',
      hardrock: 'Hard Rock Bet'
    };

    function bookLabel(v) {
      var k = String(v == null ? '' : v).toLowerCase();
      return BOOK_SHORT[k] || k.toUpperCase();
    }

    function bookName(v) {
      var k = String(v == null ? '' : v).toLowerCase();
      return BOOK_NAME[k] || bookLabel(v);
    }

    function bookHeading(v) {
      var k = String(v == null ? '' : v).toLowerCase();
      return heading(bookLabel(v), BOOK_NAME[k] || null);
    }

    function fmtOdds(n) {
      if (n === null || n === undefined || n === '') return '—';
      return (n > 0 ? '+' : '') + n;
    }

    function fmtSpread(v) {
      if (v === null || v === undefined || v === '') return '—';
      var s = String(v);
      return s.charAt(0) === '-' ? s : '+' + s;
    }

    /* A market cell is the line and the price it is offered at — `-3.5 (-110)`.
     * Either half can be missing on a book that has posted one and not the
     * other, and `-3.5 (—)` reads as a price rather than an absence, so a
     * half-quoted market renders only the half that exists. */
    function lineCell(value, odds, fmt) {
      var hasV = value !== null && value !== undefined && value !== '';
      var hasO = odds !== null && odds !== undefined && odds !== '';
      if (!hasV) return hasO ? fmtOdds(odds) : '—';
      return fmt(value) + (hasO ? ' (' + fmtOdds(odds) + ')' : '');
    }

    /* The total is one line quoted from both sides, so it is not a property of
     * either team the way the spread and the moneyline are. It is split down
     * the same two rows anyway — over on top, under below, each prefixed with
     * the side it is — because a third row for one market would cost more than
     * the small fiction that the over belongs to the away team. */
    function totalCell(r, side) {
      return lineCell(r.total_value,
        side === 'over' ? r.total_over_odds : r.total_under_odds,
        function (v) { return (side === 'over' ? 'o' : 'u') + v; });
    }

    function oddsRow(t, spread, ml, tot) {
      return '<tr><th scope="row" class="go-tm">' + teamLogo(t.abbr, 'go-logo-sm') +
        esc(t.abbr) + '</th>' +
        '<td class="is-num">' + esc(spread) + '</td>' +
        '<td class="is-num">' + esc(ml) + '</td>' +
        '<td class="is-num">' + esc(tot) + '</td></tr>';
    }

    /* One book, one table: the book names the team column, the markets are the
     * other three headings, and the away team leads the way it does everywhere
     * else on the page. */
    function bookTable(r, g) {
      var b = bookHeading(r.vendor);
      return '<div class="go-book"><table class="go-table go-odds"><thead><tr>' +
          '<th class="go-tm"' + (b.t ? ' title="' + esc(b.t) + '"' : '') + '>' +
            esc(b.s) + '</th>' +
          thCell(heading('Spread', 'Point spread'), 'is-num') +
          thCell(heading('ML', 'Moneyline'), 'is-num') +
          thCell(heading('Total', 'Total points line'), 'is-num') +
        '</tr></thead><tbody>' +
        oddsRow(g.away,
          lineCell(r.spread_away_value, r.spread_away_odds, fmtSpread),
          fmtOdds(r.moneyline_away_odds),
          totalCell(r, 'over')) +
        oddsRow(g.home,
          lineCell(r.spread_home_value, r.spread_home_odds, fmtSpread),
          fmtOdds(r.moneyline_home_odds),
          totalCell(r, 'under')) +
        '</tbody></table></div>';
    }

    function oddsTable(rows, g) {
      var quotes = rows.slice().sort(function (a, b2) {
        return String(a.vendor).localeCompare(String(b2.vendor));
      });
      return '<div class="go-books">' +
        quotes.map(function (r) { return bookTable(r, g); }).join('') +
        '</div>';
    }

    function oddsSection(b) {
      var o = b.odds || { current: [], opening: [] };
      if (!o.current.length && !o.opening.length) {
        return card('Betting odds',
          emptyState(b, ['/odds', '/odds/opening'], 'odds'), true);
      }
      var body = '';
      if (o.current.length) {
        body += oddsTable(o.current, b.game);
      }
      if (o.opening.length) {
        body += oddsTable(o.opening, b.game);
      }
      
      return card('Betting odds', body);
    }

    /* ---------- props ----------
     * Several thousand rows per game — 34 players x 25 markets x 2 books, and
     * both sides of every over/under — so a flat dump is unreadable and a
     * truncated one is a lie. Two selects cut it to one market, and inside it
     * a player is a row and the lines he is quoted at are the columns.
     *
     * ---------- market shapes ----------
     * Two shapes come back under the same prop_type and they are different
     * bets. `milestone` is an over-only ladder — 50+, 60+, 70+ receiving yards,
     * anytime touchdown, 2+ touchdowns — one price per rung and no under to
     * take. `over_under` is the conventional two-sided line at 59.5.
     *
     * They used to share a table, because the feed shares a market name. A
     * receiving-yards board was then 206 ladder rungs and 19 two-sided lines
     * under three price columns, two of which were empty on every row: a blank
     * Over and Under beside each rung, a blank Odds beside each line. So the
     * split is made at the <select> — Milestones and Over / Under are separate
     * options — and one table only ever holds one shape, which is what lets
     * each of them be laid out as the board it actually is.
     *
     * Anything that is not a milestone is treated as two-sided, which is what
     * the price cells assumed before the split: a third shape the feed adds
     * later renders with Over and Under rather than vanishing from the menu. */
    var MILESTONE = 'milestone';

    function shapeOf(r) {
      return ((r && r.market) || {}).type === MILESTONE ? MILESTONE : 'over_under';
    }

    /* A milestone line is a floor, not a number the market can land on: 50 is
     * "50 or more receiving yards", and the 0.5 an anytime-touchdown quote
     * hangs on is "1 or more". Shown with the + and rounded up, because "0.5"
     * in a touchdown column reads as half a touchdown. */
    function mileLine(v) {
      var n = parseFloat(v);
      return isFinite(n) ? Math.ceil(n) + '+' : String(v == null ? '' : v);
    }

    /* ---------- one book, one line ----------
     * A book hangs one two-sided line per player per market. A second one is
     * the feed's doing, not the book's: DraftKings prices markets the feed
     * has no name for — pass + rush yards, longest completion, longest
     * reception, both quarterbacks' passing yards added together — and they
     * arrive wearing the nearest name it does have. Dak Prescott came back at
     * 261.5 and 273.5 passing yards (the second is 261.5 plus his 7.5 rushing
     * line), Matthew Stafford at 23.5 and 38.5 completions (the second is his
     * longest completion, in yards), Brock Purdy at 243.5 and 513.5 (the
     * second is his line plus Stafford's). Nothing on the row tells them
     * apart: same vendor, same prop_type, same timestamp, prices in the same
     * range.
     *
     * The board reads a second line as two books disagreeing — which is what
     * it is between books — so the player took a second row for a bet the
     * market he is filed under does not contain, and nothing on the page said
     * which of the two to read.
     *
     * So keep one: the lowest, because every impostor is a superset of the
     * market it lands in — a longest-something, a combined something, a
     * this-plus-that — and a superset can only price above the thing it
     * contains. That is the whole rule where no other book quotes the market
     * at all, which is most of them: completions and receptions are a
     * DraftKings board in almost every game.
     *
     * Where other books do quote it they are the check on that reasoning, and
     * they overrule it only when they are decisive: the median of their lines
     * is an anchor, and a higher quote has to sit at less than half the
     * lowest one's distance from it to be believed. Books disagree among
     * themselves by enough to straddle an impostor — in one game the other
     * two were at 267.5 and 273.5 around DraftKings' real 264.5, and their
     * median leant toward the 274.5 that was really 264.5 plus a rushing
     * line — so a bare nearest-the-anchor test picks the wrong line about as
     * often as it saves one.
     *
     * Checked over a full week's board, 22,140 rows: of 1,549 two-sided
     * quotes 55 doubled up, every one of them DraftKings. The lowest line is
     * the real one in all 55; the anchor agrees in 51 of the 52 it can speak
     * to, and the half-distance margin is what keeps the 52nd.
     *
     * Milestone ladders are left alone, and are contaminated the same way —
     * a 45+ receptions rung is a longest-reception rung. A ladder is many rows
     * by design, so "keep one" is not the shape of that fix. */
    function ouLine(r) {
      return shapeOf(r) === MILESTONE ? NaN : parseFloat(r.line_value);
    }

    function median(ns) {
      var s = ns.slice().sort(function (a, b) { return a - b; });
      var i = Math.floor(s.length / 2);
      return s.length % 2 ? s[i] : (s[i - 1] + s[i]) / 2;
    }

    /* How much closer to the anchor a higher quote has to be before it is
     * read as the real line rather than the lowest one. */
    var ANCHOR_MARGIN = 0.5;

    /* The one quote to keep out of the several a book is showing for one
     * player in one market. */
    function realQuote(quotes, others) {
      var low = quotes.reduce(function (best, r) {
        return ouLine(r) < ouLine(best) ? r : best;
      });
      if (!others.length) return low;

      var anchor = median(others);
      var near = quotes.reduce(function (best, r) {
        var d = Math.abs(ouLine(r) - anchor);
        var bd = Math.abs(ouLine(best) - anchor);
        return d < bd || (d === bd && ouLine(r) < ouLine(best)) ? r : best;
      });
      /* A lowest line the books agree with leaves nothing to overrule: its
       * distance is zero and no margin gets under it. */
      return Math.abs(ouLine(near) - anchor) <
             ANCHOR_MARGIN * Math.abs(ouLine(low) - anchor) ? near : low;
    }

    function dropDoubleQuotes(rows) {
      var byBook = {}, byMarket = {};
      rows.forEach(function (r) {
        if (!isFinite(ouLine(r))) return;
        var mkt = r.prop_type + '|' + r.player_id;
        (byMarket[mkt] || (byMarket[mkt] = [])).push(r);
        var bk = r.vendor + '|' + mkt;
        (byBook[bk] || (byBook[bk] = [])).push(r);
      });

      var drop = [];
      Object.keys(byBook).forEach(function (bk) {
        var quotes = byBook[bk];
        if (quotes.length < 2) return;
        var others = byMarket[bk.slice(bk.indexOf('|') + 1)]
          .filter(function (r) { return r.vendor !== quotes[0].vendor; })
          .map(ouLine);
        var keep = realQuote(quotes, others);
        quotes.forEach(function (r) { if (r !== keep) drop.push(r); });
      });

      if (!drop.length) return rows;
      return rows.filter(function (r) { return drop.indexOf(r) < 0; });
    }

    /* Current only. An opening line answers a different question — how the
     * market moved — and that is not what this board is for; carrying it as a
     * filter put a second decision in front of the one price anyone came to
     * read. */
    function propRows(b) {
      return dropDoubleQuotes((b.player_props && b.player_props.current) || []);
    }

    function playerOf(b, id) {
      return (b.players && b.players[String(id)]) || null;
    }

    /* ---------- consensus ----------
     * The board used to give each book a column group of its own — Line, Odds,
     * Over, Under, once per book — which is how a line-shopping grid is read,
     * and is nine columns wide before a third book turns up. On a phone that
     * scrolled sideways, so the price a reader came for was off the right edge.
     * It also bought very little: the books hang their ladders on different
     * numbers (DraftKings on tens, FanDuel on twenty-fives), so most of a row
     * was the em dashes saying the other book is not at this line.
     *
     * One price per line instead, priced the way scripts/build_bun_win_totals.py
     * prices a win total so the two agree: the mean of the books' implied
     * probabilities at that line, converted back to American. The vig stays in —
     * this is a number to hold against a screen, not a fair value nobody can
     * bet. A line only one book hangs is that book's price, and the Books
     * column says which.
     */
    function impliedProb(odds) {
      var o = Number(odds);
      if (!isFinite(o) || o === 0) return null;
      return o < 0 ? (-o) / ((-o) + 100) : 100 / (o + 100);
    }

    function toAmerican(p) {
      if (p >= 0.5) return -Math.round(100 * p / (1 - p));
      return Math.round(100 * (1 - p) / p);
    }

    /* [{vendor, odds}, …] -> {odds, books:[{name, odds}]}, or null when no
     * book priced it. The books come back whole rather than folded into a
     * string: they are the column group this board replaced, and both the
     * hover and the tap overlay below are built out of them. */
    function consensusOdds(quotes) {
      var ps = [], books = [];
      quotes.forEach(function (q) {
        var p = impliedProb(q.odds);
        if (p === null) return;
        ps.push(p);
        books.push({ name: bookName(q.vendor), odds: q.odds });
      });
      if (!ps.length) return null;
      var mean = ps.reduce(function (a, c) { return a + c; }, 0) / ps.length;
      return { odds: toAmerican(mean), books: books };
    }

    /* ---------- price detail ----------
     * What each book is hanging a line at, behind the one consensus number the
     * board shows. It was a title attribute and nothing else, which is a
     * hover, which a phone does not have — and a prop board is mostly read on
     * a phone. The hover stays for a mouse; a tap opens the same thing as an
     * overlay.
     *
     * The row is what carries it, not the price cell. A price cell is a 40px
     * target on a phone and there are three of them in a two-sided row, so
     * tapping the name — the widest, most obvious thing in the row — did
     * nothing, and tapping a price meant hitting the right number rather than
     * the right bet. One panel per row instead: it is a superset of what the
     * per-cell panels held, since a row's sides or rungs are all in it.
     *
     * The row carries an index into this rather than the detail itself: the
     * payload is a player, a line and a price per book per side, and encoding
     * that as attributes on every row of a forty-column ladder is a lot of
     * markup to say what an array position says. Reset per render, which is
     * safe because a render replaces every table on the page. */
    var priceDetail = [];

    /* rows: [{label, quotes}] — the sides of a two-sided line, or the rungs of
     * one player's ladder. Returns the index the <tr> hangs off. */
    function pushDetail(player, line, rows) {
      var vendors = [], seen = {};
      rows.forEach(function (r) {
        r.quotes.forEach(function (q) {
          if (seen[q.vendor]) return;
          seen[q.vendor] = 1;
          vendors.push(q.vendor);
        });
      });
      vendors.sort(function (x, y) {
        return bookLabel(x).localeCompare(bookLabel(y));
      });
      return priceDetail.push({
        player: player, line: line, books: vendors,
        rows: rows.map(function (r) {
          var by = {}, c = consensusOdds(r.quotes);
          r.quotes.forEach(function (q) { by[q.vendor] = q.odds; });
          return { label: r.label, by: by, cons: c ? c.odds : null };
        })
      }) - 1;
    }

    /* The hover stays per cell: a mouse is already pointing at one price, and
     * the whole row is what the tap is for. */
    function consCell(quotes) {
      var c = consensusOdds(quotes);
      if (!c) return '<td class="is-null">—</td>';
      var hover = c.books.map(function (bk) {
        return bk.name + ' ' + fmtOdds(bk.odds);
      }).join(' \u00b7 ');
      return '<td class="is-num" title="' + esc(hover) + '">' +
        esc(fmtOdds(c.odds)) + '</td>';
    }

    /* Every line one player is quoted at, in this market. Keyed on the market
     * shape as well as the number, because a 250+ milestone rung and a 250.5
     * two-sided line are different bets that round to the same place — folded
     * into one row, one book's price would sit in the other's column. */
    function propGroups(rows) {
      var order = [], byKey = {};
      rows.forEach(function (r) {
        var m = r.market || {};
        var k = r.player_id + '|' + r.line_value + '|' + (m.type || '');
        if (!byKey[k]) {
          byKey[k] = {
            player_id: r.player_id, line: r.line_value, type: m.type,
            odds: [], over: [], under: []
          };
          order.push(k);
        }
        var g = byKey[k];
        if (shapeOf(r) === MILESTONE) {
          g.odds.push({ vendor: r.vendor, odds: m.odds });
        } else {
          g.over.push({ vendor: r.vendor, odds: m.over_odds });
          g.under.push({ vendor: r.vendor, odds: m.under_odds });
        }
      });
      /* Sorted by ticker rather than left in whatever order the feed listed
       * the books in, which differs between markets and would read as an
       * unsorted list in the hover the prices are folded into. */
      function byBook(x, y) {
        return bookLabel(x.vendor).localeCompare(bookLabel(y.vendor));
      }
      return order.map(function (k) {
        var g = byKey[k];
        g.odds.sort(byBook); g.over.sort(byBook); g.under.sort(byBook);
        return g;
      });
    }

    /* Sorted on the name as it is displayed, which is the surname: ordering
     * by the full name while showing "P. Mahomes" reads as unsorted to anyone
     * scanning down the page. */
    function playerName(b, id) {
      var pl = playerOf(b, id);
      return (pl && shortenName(pl.name)) || String(id);
    }

    /* The player as the first cell of his own row, rather than a header row
     * spanning the table above the lines that hang off it. A milestone board
     * is one row per player now — the ladder went into the columns — and a
     * two-sided board is one row, two when the books disagree on where to hang
     * the line, so a group header would be a banner over a single line.
     *
     * It is the pinned column instead, the arrangement the injury report
     * already scrolls under: a milestone market runs to two dozen rungs and
     * the board has to go sideways, and the name is the one thing a row cannot
     * afford to have scroll off it. Position and club stay on the name, which
     * is the only cell wide enough to carry them. */
    function playerCell(b, id) {
      var pl = playerOf(b, id);
      var meta = pl ? [pl.position, pl.team].filter(Boolean).join(' \u00b7 ') : '';
      return '<td class="go-plc">' + esc(playerName(b, id)) +
        (meta ? '<span class="go-plmeta">' + esc(meta) + '</span>' : '') + '</td>';
    }

    /* The ladder as columns, one row per player: every rung anyone in this
     * market is quoted at across the head, ascending, and a player's row is
     * his price at each of them.
     *
     * Read down a column it answers the question a milestone board is opened
     * for — who is worth taking at 50+, and at what price — which the old
     * layout could not be read for at all: a rung was one row inside one
     * player's block, so comparing two players at 50+ meant scrolling between
     * two blocks and holding a number in your head.
     *
     * Wide, and allowed to be. A book prices each player's own line as well as
     * the round numbers, so 57 and 63 turn up between 50 and 70 as columns
     * with a single price in them. They stay: it is a real quote, and a board
     * that drops it disagrees with the book it came from. */
    function milestoneTable(b, players, byPlayer, groups) {
      var lines = [], seen = {};
      groups.forEach(function (g) {
        if (seen[g.line]) return;
        seen[g.line] = 1;
        lines.push(g.line);
      });
      lines.sort(function (x, y) { return parseFloat(x) - parseFloat(y); });

      /* One rung is not a ladder, and a board of them is headed Odds rather
       * than by the rung — but only when the rung is 1+, which is every
       * touchdown market and says nothing the market name has not. Any other
       * single rung keeps its number: a board quoted at 50+ and nowhere else
       * headed "Odds" would be a price with no threshold on the page, which is
       * the hole the two-sided board had with its Line column. */
      var trivial = lines.length === 1 && mileLine(lines[0]) === '1+';
      var head = thCell('Player', 'go-plc') + (trivial
        ? thCell(heading('Odds', 'Consensus price for the line and up'), 'is-num')
        : lines.map(function (v) {
            return thCell(heading(mileLine(v),
              'Consensus price for ' + mileLine(v).slice(0, -1) + ' or more'), 'is-num');
          }).join(''));

      /* Ordered down the first rung rather than by name. The board is opened
       * to find who is worth taking at the shortest milestone — the leftmost
       * column — so that column is the order, ascending on the price, chalk at
       * the top.
       *
       * A player the books have not quoted at that rung sorts above every
       * price rather than below them: an unquoted 50+ on a back who is quoted
       * at 70+ is a rung too short for a book to bother hanging, so the blank
       * is shorter than any number in the column, not longer. Ties fall
       * through to the next rung, which is what the players sharing a blank
       * first column have to be separated on, and a name breaks a tie the
       * whole ladder does not. */
      var at = {};
      players.forEach(function (id) {
        var byLine = {};
        byPlayer[id].forEach(function (g) { byLine[g.line] = g; });
        at[id] = byLine;
      });
      function priceAt(id, v) {
        var g = at[id][v], c = g && consensusOdds(g.odds);
        return c ? c.odds : -Infinity;
      }
      players = players.slice().sort(function (x, y) {
        for (var i = 0; i < lines.length; i++) {
          var px = priceAt(x, lines[i]), py = priceAt(y, lines[i]);
          if (px !== py) return px < py ? -1 : 1;
        }
        return playerName(b, x).localeCompare(playerName(b, y));
      });

      var body = players.map(function (id) {
        /* The whole ladder in one panel, rung by rung — which is the board's
         * own row read book by book, and the line shopping the per-book column
         * groups used to be for. */
        var mine = at[id];
        var i = pushDetail(playerName(b, id), null,
          lines.filter(function (v) { return mine[v]; }).map(function (v) {
            return { label: mileLine(v), quotes: mine[v].odds };
          }));
        return '<tr data-pd="' + i + '">' + playerCell(b, id) +
          lines.map(function (v) {
            return mine[v] ? consCell(mine[v].odds) : '<td class="is-null">—</td>';
          }).join('') + '</tr>';
      }).join('');

      return { head: head, body: body };
    }

    /* One row per line, because the books do not agree on where to hang it:
     * FanDuel at 59.5 and DraftKings at 62.5 are two different bets, not two
     * prices on one, and folding them into a row would average across a line
     * that neither book is offering. So the line stays a column and a player
     * takes a second row when he is quoted at a second number.
     *
     * Always drawn, even when every row on the board says the same number.
     * It used to be dropped in that case, on the rule that a column saying one
     * thing says nothing — which is true of the milestone board, where the
     * rung is the column heading, and false here: the line IS the bet. Two
     * quarterbacks quoted at the same 31.5 pass attempts left a board reading
     * "Pass Att, over -106, under -120" with the 31.5 nowhere on the page. */
    function overUnderTable(b, players, byPlayer, groups) {
      var head = thCell('Player', 'go-plc') +
        thCell(heading('Line', 'Line quoted'), 'is-num') +
        thCell(heading('Over', 'Consensus over price'), 'is-num') +
        thCell(heading('Under', 'Consensus under price'), 'is-num');

      var body = players.map(function (id) {
        return byPlayer[id].slice().sort(function (x, y) {
          return parseFloat(x.line) - parseFloat(y.line);
        }).map(function (g) {
          var i = pushDetail(playerName(b, id), g.line, [
            { label: 'Over', quotes: g.over },
            { label: 'Under', quotes: g.under }
          ]);
          return '<tr data-pd="' + i + '">' + playerCell(b, id) +
            '<td class="is-num">' + esc(g.line) + '</td>' +
            consCell(g.over) + consCell(g.under) +
            '</tr>';
        }).join('');
      }).join('');

      return { head: head, body: body };
    }

    function propsTable(b, rows) {
      var groups = propGroups(rows);

      var players = [], byPlayer = {};
      groups.forEach(function (g) {
        var id = String(g.player_id);
        if (!byPlayer[id]) { byPlayer[id] = []; players.push(id); }
        byPlayer[id].push(g);
      });
      players.sort(function (x, y) {
        return playerName(b, x).localeCompare(playerName(b, y));
      });

      /* One shape per table — the market <select> carries it — so the shape is
       * read off the first group and speaks for all of them. The two are
       * different boards, not one board with a column swapped: an over-only
       * ladder has a price per rung and no under anywhere on it, and drawing
       * it the two-sided way left a third of the table permanently empty. */
      var mile = groups[0].type === MILESTONE;
      var t = mile
        ? milestoneTable(b, players, byPlayer, groups)
        : overUnderTable(b, players, byPlayer, groups);

      /* The shape is on the table as well as in its columns: the over/under
       * view stacks ten of these boards, and ten tables each sizing their own
       * columns puts Over and Under at a different place on every one. */
      return '<div class="go-scroll"><table class="go-table go-props go-pinned ' +
        (mile ? 'go-mile' : 'go-ou') + '">' +
        '<thead><tr>' + t.head + '</tr></thead>' +
        '<tbody>' + t.body + '</tbody></table></div>';
    }

    /* ---------- the overlay ----------
     * Fixed to the viewport and parented to the body rather than to the table.
     * The board scrolls inside .go-scroll, and anything positioned inside a
     * scrollport is clipped by it: an overlay on the last column of a
     * milestone ladder would open half outside the box and be cut in half.
     * Placed off the cell's rect instead, flipped above the cell when there is
     * no room below it, and clamped to the viewport on the left and right so a
     * price at the edge of a phone opens a panel that is all on screen.
     *
     * A rect goes stale the moment anything moves, so the panel closes on
     * everything that could move it — a click outside, Escape, a scroll of the
     * page or of the board, a resize — rather than trying to follow it. */
    var openPop = null;

    function closePop() {
      if (!openPop) return;
      var p = openPop;
      openPop = null;
      if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
      if (p.cell) p.cell.classList.remove('is-open');
      document.removeEventListener('mousedown', p.onDoc, true);
      document.removeEventListener('touchstart', p.onDoc, true);
      document.removeEventListener('keydown', p.onKey, true);
      window.removeEventListener('resize', closePop);
      window.removeEventListener('scroll', p.onScroll, true);
    }

    /* A book per column, and a side — or a rung — per row: the column group
     * this board folded up, DK against FD at a glance, on the one bet the
     * reader has just pointed at. The mean is the last column and only when
     * there is a second book for it to be a mean of; on one book it would be
     * that book's price written twice. */
    function popTable(d) {
      var multi = d.books.length > 1;
      return '<table class="go-pop-t"><thead><tr><th></th>' +
          d.books.map(function (v) {
            return '<th title="' + esc(bookName(v)) + '">' +
              esc(bookName(v)) + '</th>';
          }).join('') +
          (multi ? '<th class="go-pop-avg">Avg</th>' : '') +
        '</tr></thead><tbody>' +
        d.rows.map(function (r) {
          return '<tr><th>' + esc(r.label) + '</th>' +
            d.books.map(function (v) {
              var o = r.by[v];
              return '<td>' +
                esc(o === undefined ? '\u2014' : fmtOdds(o)) + '</td>';
            }).join('') +
            (multi ? '<td class="go-pop-avg">' + esc(fmtOdds(r.cons)) +
              '</td>' : '') +
            '</tr>';
        }).join('') +
        '</tbody></table>';
    }

    function openPricePop(row, anchor) {
      var d = priceDetail[Number(row.getAttribute('data-pd'))];
      if (!d || !d.rows.length) return;
      closePop();

      var el = document.createElement('div');
      el.className = 'go-pop';
      el.innerHTML =
        '<div class="go-pop-h">' +
          esc([d.player, d.line].filter(Boolean).join(' \u00b7 ')) +
        '</div>' + popTable(d);
      document.body.appendChild(el);

      var r = (anchor || row).getBoundingClientRect();
      var w = el.offsetWidth, h = el.offsetHeight, pad = 8;
      var left = r.left + r.width / 2 - w / 2;
      left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));
      var top = r.bottom + 6;
      if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - 6);
      el.style.left = Math.round(left) + 'px';
      el.style.top = Math.round(top) + 'px';
      row.classList.add('is-open');

      var p = {
        el: el, cell: row,
        onDoc: function (e) { if (!el.contains(e.target)) closePop(); },
        /* A ladder of two dozen rungs is taller than the panel is allowed to
         * be, so the panel scrolls inside itself — and that scroll is not the
         * page moving out from under it. */
        onScroll: function (e) {
          var t = e.target;
          if (!t || !t.nodeType || !el.contains(t)) closePop();
        },
        onKey: function (e) { if (e.key === 'Escape' || e.keyCode === 27) closePop(); }
      };
      openPop = p;
      /* Registered on the next tick: the click that opened the panel is still
       * on its way up to the document, and a listener added inside it would
       * take that same click as the one dismissing it. */
      setTimeout(function () {
        if (openPop !== p) return;
        document.addEventListener('mousedown', p.onDoc, true);
        document.addEventListener('touchstart', p.onDoc, true);
        document.addEventListener('keydown', p.onKey, true);
        window.addEventListener('resize', closePop);
        window.addEventListener('scroll', p.onScroll, true);
      }, 0);
    }

    /* The markets this bundle holds, split by shape and kept in the bundle's
     * own order — which is alphabetical — with anything the rows carry and the
     * market list does not appended rather than dropped. Derived rather than
     * stored because the two views are built out of it twice: once to lay the
     * card out and once, on every draw, to decide what is still valid. */
    function propMarkets(b) {
      var p = b.player_props || { current: [] };
      var have = {};
      propRows(b).forEach(function (r) {
        (have[r.prop_type] || (have[r.prop_type] = {}))[shapeOf(r)] = 1;
      });
      var order = (p.markets || []).filter(function (m) { return have[m]; });
      Object.keys(have).forEach(function (m) {
        if (order.indexOf(m) < 0) order.push(m);
      });
      return {
        ou: order.filter(function (m) { return have[m].over_under; }),
        mile: order.filter(function (m) { return have[m][MILESTONE]; })
      };
    }

    /* Which board is up, and what the milestone one is filtered to. Kept out
     * here rather than in the DOM because a poll replaces the whole card every
     * thirty seconds: a market held in a control that is thrown away is a
     * board that jumps back to its default while it is being read. Validated
     * against the bundle on every wire, so a market that stops being quoted
     * falls back rather than emptying the table. */
    var propView = 'ou', propMarket = '', propPlayer = '';

    /* ---------- the two views ----------
     * Over/under and milestones are not two filters on one board, they are two
     * boards: one is every player's line in a market and the price on each
     * side of it, the other is one player's ladder priced rung by rung. They
     * had to share a <select>, which meant the same market name appeared twice
     * in one list meaning two different bets, and reading both meant knowing
     * that the second half of the menu was a different kind of thing.
     *
     * A switch instead, in the card head beside the title, marked with icons
     * rather than words. Over/under is the default and needs no market picker
     * at all: there are ten of these
     * markets, each a dozen rows, and all ten fit on the page at once — which
     * is how a prop board is actually read, down the page for a name rather
     * than market by market. Milestones cannot be shown that way — one market
     * is two dozen rungs wide on its own — so that view keeps the pickers.
     */

    /* Both icons are one colour and drawn in strokes of `currentColor`, so the
     * pressed state inverts the glyph along with the button rather than
     * needing a second artwork: gold fill, bar-dark strokes.
     *
     * The over/under mark is the two directions a two-sided line is taken in,
     * one arrow each way. The milestone mark is a ladder because that is what
     * the board is -- rungs at 50+, 60+, 70+, climbed until the price stops
     * being worth it. */
    var PROP_VIEW_ICON = {
      ou: '<path d="M7 20V4"/><path d="M3.2 8L7 4.2 10.8 8"/>' +
          '<path d="M17 4v16"/><path d="M13.2 16l3.8 3.8 3.8-3.8"/>',
      mile: '<path d="M7.5 3v18"/><path d="M16.5 3v18"/>' +
            '<path d="M7.5 7.5h9"/><path d="M7.5 12h9"/><path d="M7.5 16.5h9"/>'
    };

    /* Icons, so the label is a name for the button rather than its face: with
     * the switch in the card head there is one line for a title and two
     * controls, and two words of caps on each button would crowd the title off
     * it. The name still has to be readable, hence aria-label and title. */
    function propViewButton(view, text, count) {
      return '<button type="button" class="go-icobtn" data-prop-view="' +
        esc(view) + '"' + (count ? '' : ' disabled') +
        ' aria-pressed="false" title="' + esc(text) + '"' +
        ' aria-label="' + esc(text) + '">' +
        '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"' +
          ' stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
          ' stroke-linejoin="round" aria-hidden="true" focusable="false">' +
          PROP_VIEW_ICON[view] +
        '</svg></button>';
    }

    /* The markup contract scripts/components/nfl-pickers.js registers against,
     * verbatim from /football/schedule. */
    function ddControl(id, label) {
      return '<div class="dd" id="dd-' + id + '">' +
          '<button type="button" class="dd-btn" id="' + id + '"' +
            ' aria-haspopup="true" aria-expanded="false">' +
            '<span class="dd-value"></span>' +
          '</button>' +
          '<div class="dd-pop dd-menu" id="' + id + '-menu" role="menu"' +
            ' aria-label="' + esc(label) + '" hidden></div>' +
        '</div>';
    }

    function propsSection(b) {
      var p = b.player_props || { current: [] };
      if (!p.current.length) {
        return card('Player props',
          emptyState(b, ['/odds/player_props'], 'player props'), true);
      }
      var mk = propMarkets(b);

      return card('Player props',
        '<div class="go-pbody">' +
          /* Hidden on the over/under board rather than absent from it: the
           * pickers belong to one of the two views, and a row of controls that
           * appears and disappears in place reads as part of the view it is
           * attached to. */
          '<div class="dd-row" id="prop-filters" hidden>' +
            ddControl('prop-market', 'Market') +
            ddControl('prop-player', 'Player') +
          '</div>' +
          '<div id="prop-table"></div>' +
        '</div>', true,
        '<div class="go-seg go-seg-head" id="prop-views" role="group"' +
          ' aria-label="Prop board">' +
          propViewButton('ou', 'Player O/U', mk.ou.length) +
          propViewButton('mile', 'Milestones', mk.mile.length) +
        '</div>');
    }

    /* Every two-sided market at once, each its own board under its own
     * heading. Ten short tables rather than one long one: they do not share a
     * line, a price or even a unit — receptions and passing yards in one table
     * would be a Line column meaning two different things — and stacked, a
     * player's name appears once per market he is quoted in, which is the
     * sweep the board is opened for. */
    function ouBoards(b, markets) {
      var byMarket = {};
      propRows(b).forEach(function (r) {
        if (shapeOf(r) === MILESTONE) return;
        (byMarket[r.prop_type] || (byMarket[r.prop_type] = [])).push(r);
      });
      return markets.filter(function (m) { return byMarket[m]; })
        .map(function (m) {
          var h = marketHeading(m);
          return '<div class="go-mkt"' +
              (h.t ? ' title="' + esc(h.t) + '"' : '') + '>' + esc(h.s) +
            '</div>' + propsTable(b, byMarket[m]);
        }).join('');
    }

    /* innerHTML wipes listeners, so the props controls are wired after every
     * render rather than once at load. */
    function wireProps(b) {
      var viewsEl = document.getElementById('prop-views');
      var filtersEl = document.getElementById('prop-filters');
      var tableEl = document.getElementById('prop-table');
      if (!tableEl) return;

      var mk = propMarkets(b);
      if (propView === 'ou' && !mk.ou.length) propView = 'mile';
      if (propView === 'mile' && !mk.mile.length) propView = 'ou';
      if (mk.mile.indexOf(propMarket) < 0) propMarket = mk.mile[0] || '';

      var mktBtn = document.getElementById('prop-market');
      var mktMenu = document.getElementById('prop-market-menu');
      var plBtn = document.getElementById('prop-player');
      var plMenu = document.getElementById('prop-player-menu');
      var mktDd = registerDropdown(document.getElementById('dd-prop-market'));
      var plDd = registerDropdown(document.getElementById('dd-prop-player'));

      function mileRows() {
        return propRows(b).filter(function (r) {
          return r.prop_type === propMarket && shapeOf(r) === MILESTONE;
        });
      }

      function syncViews() {
        var btns = viewsEl.querySelectorAll('button[data-prop-view]');
        for (var i = 0; i < btns.length; i++) {
          btns[i].setAttribute('aria-pressed',
            btns[i].getAttribute('data-prop-view') === propView ? 'true' : 'false');
        }
        filtersEl.hidden = propView !== 'mile';
      }

      function syncMarket() {
        buildOptionMenu(mktMenu, mk.mile.map(function (m) {
          return { value: m, label: marketHeading(m).s };
        }), 'mkt');
        syncOptionMenu(mktBtn, mktMenu, propMarket,
          propMarket ? marketHeading(propMarket).s : 'No markets', 'mkt');
      }

      /* The player list is per market, not per game: a receiving-yards ladder
       * has no quarterbacks on it, and offering every player quoted anywhere
       * would fill the menu with names that empty the table. Named and ordered
       * the way the first column is, so the menu and the rows read as the same
       * list. A pick that survives a market change is kept — the same player
       * at a different market is a common next look. */
      function syncPlayers() {
        var seen = {}, opts = [];
        mileRows().forEach(function (r) {
          var id = String(r.player_id);
          if (seen[id]) return;
          seen[id] = 1;
          var pl = playerOf(b, r.player_id);
          opts.push({
            value: id, label: playerName(b, id),
            note: pl ? [pl.position, pl.team].filter(Boolean).join(' \u00b7 ') : ''
          });
        });
        opts.sort(function (x, y) { return x.label.localeCompare(y.label); });
        if (!seen[propPlayer]) propPlayer = '';
        buildOptionMenu(plMenu,
          [{ value: '', label: 'All players' }].concat(opts), 'pl');
        syncOptionMenu(plBtn, plMenu, propPlayer,
          propPlayer ? playerName(b, propPlayer) : 'All players', 'pl');
      }

      function draw() {
        closePop();
        /* Reset here rather than in propsTable: the over/under view draws ten
         * of them and each one's cells carry an index into this, so a per-table
         * reset would leave nine boards pointing into the tenth. */
        priceDetail = [];
        var html;
        if (propView === 'ou') {
          html = ouBoards(b, mk.ou);
        } else {
          var rows = mileRows();
