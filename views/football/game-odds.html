<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Game Odds | Dynast-Z</title>
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <link rel="stylesheet" href="/styles/primary/game-odds.css">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script>initPage();</script>

  <div class="masters-content go-wrap">
    <div class="masters-breadcrumbs">
      <a href="/football">Football</a><span class="separator">/</span>
      <a href="/football/schedule">Games</a><span class="separator">/</span>
      <span id="crumb">Game</span>
    </div>

    <div id="page"><p class="go-empty">Loading game…</p></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* One game, from /api/game-odds?game=<id> — the bundle
     * scripts/fetch_bdl_game.py writes to Supabase with --publish.
     *
     * Not a file under /data: a bundle is ~900 KB, nearly all of it player
     * props, and committing one per game would add ~15 MB a week during the
     * season to the repo forever. It lives in Supabase `game_odds` and moves on
     * a push with no deploy, the same split the Action Network book uses.
     *
     * Deep-linked by balldontlie game id, as the last segment of the path:
     * /football/schedule/game/1392216. It sits under the schedule because that
     * is the only thing that links to it, and the id is the same one the rows
     * carry since data/nfl_schedule_*.json moved to balldontlie as its source —
     * so there is no lookup table in between.
     *
     * The page is built to be mostly empty and still say something useful. Of
     * the six sections below, five are behind balldontlie's paid tiers, so on a
     * free key the honest render is a game header plus five explanations. Each
     * section states which tier it needs, taken from the bundle's own
     * `unavailable` notes rather than from a constant here — the fetcher already
     * recorded exactly why each endpoint refused, and repeating that judgement
     * in the page would be a second place to get it wrong.
     *
     * ES5 globals, like the rest of scripts/ — no modules, no build step.
     */

    var INDEX_URL = '/api/game-odds';

    var pageEl = document.getElementById('page');
    var crumbEl = document.getElementById('crumb');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* The same 32 files /football/schedule and the team picker use, served
     * from this app rather than hotlinked. No lazy loading here: there are at
     * most four on the page and two of them are above the fold. */
    var LOGO_DIR = '/assets/icons/nfl/';

    function teamLogo(abbr, cls) {
      return '<img class="' + cls + '" src="' + LOGO_DIR + esc(abbr) +
        '.svg" alt="" aria-hidden="true">';
    }

    /* The id is the last path segment, not a query parameter. Anchored and
     * digits-only for the same reason api/game-odds.py validates it: this value
     * ends up in a request URL, and a path is as capable of carrying junk as a
     * query string is. */
    var PATH_RE = /^\/football\/schedule\/game\/([0-9]{1,12})\/?$/;

    function gameParam() {
      var m = PATH_RE.exec(location.pathname || '');
      return m ? m[1] : '';
    }

    /* ---------- formatting ---------- */

    /* Stat keys arrive as snake_case straight off the API. Title-casing them is
     * the floor, and it is what keeps the bundle a faithful copy of what was
     * fetched: a field the API adds tomorrow still renders under a readable
     * name rather than vanishing because nobody updated a map.
     *
     * Above that floor sit the ABBR maps below, which shorten the ~130 headings
     * this page can draw to the forms a box score is actually read in. The
     * widths are the argument: "Long Reception" is four times the width of the
     * number under it and pushes eight sibling columns off the screen, where
     * "LNG" does not. They are overrides, not a replacement — a key with no
     * entry falls through to label() — and every abbreviated heading carries
     * its long form as a title, so nothing that was on the page is gone, only
     * folded up. */
    function label(key) {
      return String(key).replace(/_/g, ' ').replace(/\b\w/g, function (c) {
        return c.toUpperCase();
      });
    }

    /* The tooltips are built out of label(), which title-cases every word and
     * so turns the acronyms in these keys into words: `qbr` reads "Qbr" and
     * `anytime_td` reads "Anytime Td". Spelled-out is the whole point of a
     * tooltip, so the handful of keys that are acronyms are put back up. */
    var ACRONYM = {
      Qb: 'QB', Qbr: 'QBR', Td: 'TD', Tds: 'TDs', Fg: 'FG', Fgs: 'FGs',
      Int: 'INT', Ints: 'INTs', Rz: 'RZ', Xp: 'XP', Ot: 'OT', Pat: 'PAT'
    };

    function fullLabel(key) {
      return label(key).replace(/[A-Za-z]+/g, function (w) {
        return ACRONYM[w] || w;
      });
    }

    /* A heading is the short form plus the long one it stands for. `t` is null
     * when the two say the same thing, so an unabbreviated heading gets no
     * tooltip rather than one that repeats the text already under the cursor.
     * Compared case-insensitively: "QBR" abbreviates nothing when the long form
     * is also QBR, however label() happened to case it. */
    function heading(short, full) {
      var same = full && String(full).toLowerCase() === String(short).toLowerCase();
      return { s: short, t: (full && !same) ? full : null };
    }

    function thCell(h, cls) {
      if (typeof h === 'string') h = heading(h, null);
      return '<th' + (cls ? ' class="' + cls + '"' : '') +
        (h.t ? ' title="' + esc(h.t) + '"' : '') + '>' + esc(h.s) + '</th>';
    }

    /* ---------- abbreviations ----------
     * Keyed on the JSON path a value arrives under rather than on its rendered
     * string, so a heading can be traced back to the field it came from by
     * grepping the key, and the map does not break the day balldontlie changes
     * its own title-casing.
     *
     * Scoped per section because the same key wants a different width in
     * different places: `passing_attempts` is "Att" in a team comparison with
     * one stat per row and acres of space, and "ATT" in a box score where nine
     * numeric columns share that row. */

    /* team_stats.away|home.* */
    var TEAM_ABBR = {
      first_downs: '1st Downs', first_downs_passing: '1st D Pass',
      first_downs_rushing: '1st D Rush', first_downs_penalty: '1st D Pen',
      third_down_efficiency: '3rd Down %', third_down_conversions: '3rd Down Conv',
      third_down_attempts: '3rd Down Att', fourth_down_efficiency: '4th Down %',
      fourth_down_conversions: '4th Down Conv', fourth_down_attempts: '4th Down Att',
      total_offensive_plays: 'Off Plays', total_yards: 'Tot Yds',
      yards_per_play: 'Y/P', total_drives: 'Drives',
      net_passing_yards: 'Net Pass Yds', passing_completions: 'Comp',
      passing_attempts: 'Att', yards_per_pass: 'Y/A', sacks: 'Sacks',
      sack_yards_lost: 'Sack Yds', rushing_yards: 'Rush Yds',
      rushing_attempts: 'Rush Att', yards_per_rush_attempt: 'Y/C',
      red_zone_scores: 'RZ Scores', red_zone_attempts: 'RZ Att',
      penalties: 'Pen', penalty_yards: 'Pen Yds', turnovers: 'TO',
      fumbles_lost: 'Fum Lost', interceptions_thrown: 'INT',
      defensive_touchdowns: 'Def TD', possession_time: 'TOP'
    };

    /* player_stats.away|home[].<group>.* */
    var STAT_ABBR = {
      passing: {
        passing_completions: 'CMP', passing_attempts: 'ATT',
        passing_yards: 'YDS', yards_per_pass_attempt: 'Y/A',
        passing_touchdowns: 'TD', passing_interceptions: 'INT',
        sacks: 'SK', sacks_loss: 'SKYL', qbr: 'QBR', qb_rating: 'RTG'
      },
      rushing: {
        rushing_attempts: 'ATT', rushing_yards: 'YDS',
        yards_per_rush_attempt: 'AVG', rushing_touchdowns: 'TD',
        long_rushing: 'LNG'
      },
      receiving: {
        receptions: 'REC', receiving_yards: 'YDS',
        yards_per_reception: 'AVG', receiving_touchdowns: 'TD',
        long_reception: 'LNG', receiving_targets: 'TGT'
      },
      defense: {
        total_tackles: 'TCK', defensive_sacks: 'SK', solo_tackles: 'SOLO',
        tackles_for_loss: 'TFL', passes_defended: 'PD', qb_hits: 'QBH',
        defensive_interceptions: 'INT', interception_yards: 'IYDS',
        interception_touchdowns: 'ITD'
      },
      kicking: {
        field_goal_attempts: 'FGA', field_goals_made: 'FGM',
        field_goal_pct: 'FG%', long_field_goal_made: 'LNG',
        extra_points_made: 'XPM', total_points: 'PTS'
      },
      returns: {
        kick_returns: 'KR', kick_return_yards: 'KR YDS',
        yards_per_kick_return: 'KR AVG', long_kick_return: 'KR LNG',
        kick_return_touchdowns: 'KR TD', punt_returns: 'PR',
        punt_return_yards: 'PR YDS', yards_per_punt_return: 'PR AVG',
        long_punt_return: 'PR LNG', punt_return_touchdowns: 'PR TD'
      },
      punting: {
        punts: 'PUNTS', punt_yards: 'YDS', gross_avg_punt_yards: 'AVG',
        touchbacks: 'TB', punts_inside_20: 'IN20', long_punt: 'LNG'
      },
      fumbles: {
        fumbles: 'FUM', fumbles_lost: 'LOST', fumbles_recovered: 'REC',
        fumbles_touchdowns: 'TD'
      }
    };

    /* player_props.markets[] / player_props.<which>[].prop_type — the market
     * <select>. A period is a mechanical suffix on half of the 35 markets, so
     * it is split off, the base abbreviated, and the period put back. Listing
     * every combination would be 35 rows that disagree with each other the
     * first time a market picks up a suffix the list does not have. */
    var MARKET_ABBR = {
      anytime_td: 'Anytime TD', first_td: 'First TD', fg_made: 'FG Made',
      kicking_points: 'Kicking Pts', interceptions: 'INT Thrown',
      passing_attempts: 'Pass Att', passing_completions: 'Pass Comp',
      passing_tds: 'Pass TD', passing_yards: 'Pass Yds',
      receptions: 'Rec', receiving_yards: 'Rec Yds',
      rushing_attempts: 'Rush Att', rushing_yards: 'Rush Yds',
      rushing_receiving_yards: 'Rush+Rec Yds', longest_rush: 'Long Rush'
    };

    var PERIOD = { '1q': '1Q', '2q': '2Q', '3q': '3Q', '4q': '4Q',
                   '1h': '1H', '2h': '2H' };

    function marketHeading(key) {
      var k = String(key == null ? '' : key), suffix = '';
      var m = /^(.*)_(1q|2q|3q|4q|1h|2h)$/.exec(k);
      if (m) { k = m[1]; suffix = ' (' + PERIOD[m[2]] + ')'; }
      return heading((MARKET_ABBR[k] || label(k)) + suffix,
                     fullLabel(k) + suffix);
    }

    function teamHeading(key) {
      return heading(TEAM_ABBR[key] || label(key), fullLabel(key));
    }

    /* injuries.away|home|unknown[].status. Matched case-insensitively and
     * carrying more than the six statuses these bundles happen to contain: the
     * rest of the designation list turns up in-season, and a status with no
     * entry renders whole rather than blank. */
    var STATUS_ABBR = {
      'questionable': 'Q', 'doubtful': 'D', 'out': 'OUT',
      'injured reserve': 'IR', 'ir': 'IR', 'ir-r': 'IR-R',
      'pup-p': 'PUP-P', 'pup-r': 'PUP-R', 'nfi-a': 'NFI-A', 'nfi-r': 'NFI-R',
      'reserve-dnr': 'DNR', 'suspended': 'SUSP', 'active': 'ACT'
    };

    function statusCell(v) {
      var full = String(v == null ? '' : v).trim();
      if (!full) return '<td></td>';
      var h = heading(STATUS_ABBR[full.toLowerCase()] || full, full);
      return '<td' + (h.t ? ' title="' + esc(h.t) + '"' : '') + '>' +
        esc(h.s) + '</td>';
    }

    function isNum(v) { return typeof v === 'number'; }

    /* Players are named in three tables that are all short on width -- the box
     * score, the prop board and the injury report -- and the given name is the
     * part none of them are read for. "P. Mahomes" identifies the same player
     * and hands the width back to the numbers beside it. */
    function initialName(first, last) {
      var f = String(first == null ? '' : first).trim();
      var l = String(last == null ? '' : last).trim();
      if (!f) return l;
      if (!l) return f;
      return f.charAt(0).toUpperCase() + '. ' + l;
    }

    /* The prop board carries the name already joined, so it is split back on
     * the first space only -- everything after it is the surname, which leaves
     * "Amon-Ra St. Brown" and "Michael Pittman Jr." intact. */
    function shortenName(full) {
      var s = String(full == null ? '' : full).trim();
      var i = s.indexOf(' ');
      return i < 0 ? s : initialName(s.slice(0, i), s.slice(i + 1));
    }

    function cell(v) {
      if (v === null || v === undefined || v === '') {
        return '<td class="is-null">—</td>';
      }
      if (isNum(v)) return '<td class="is-num">' + esc(v) + '</td>';
      if (typeof v === 'object') return '<td>' + esc(JSON.stringify(v)) + '</td>';
      return '<td>' + esc(v) + '</td>';
    }

    /* ---------- freshness ----------
     * When this bundle was captured, and when it changes next. Both are read
     * off the bundle rather than decided here: `fetched_at` is stamped by the
     * fetcher, and `refresh` is refresh_plan()'s answer in
     * scripts/fetch_bdl_game.py — the same function scripts/bdl_refresh.py
     * sweeps on. So the "next in 6h" this page prints is the cadence a sweep
     * will actually run, not a second guess at it. */

    function gap(secs) {
      var s = Math.abs(Math.round(secs));
      if (s < 60) return s + 's';
      if (s < 5400) return Math.round(s / 60) + 'm';
      if (s < 172800) return Math.round(s / 3600) + 'h';
      return Math.round(s / 86400) + 'd';
    }

    function stamp(iso) {
      if (!iso) return null;
      var t = Date.parse(String(iso).replace(/T(\d\d:\d\d)Z$/, 'T$1:00Z'));
      return isFinite(t) ? t / 1000 : null;
    }

    function kickoffET(iso) {
      var t = stamp(iso);
      if (t === null) return '';
      try {
        return new Date(t * 1000).toLocaleString('en-US', {
          timeZone: 'America/New_York', weekday: 'short', month: 'short',
          day: 'numeric', hour: 'numeric', minute: '2-digit'
        }) + ' ET';
      } catch (e) { return String(iso); }
    }

    /* Rendered next to the phase chip, because "final" and "captured four
     * months ago" are two different facts and only one of them was on the page.
     * A bundle written before refresh_plan existed has no `refresh` block, so
     * the age stands on its own rather than the whole line disappearing. */
    function freshness(b) {
      var now = Date.now() / 1000;
      var at = stamp(b.fetched_at);
      var r = b.refresh || null;
      var bits = [];
      if (at !== null) bits.push('updated ' + gap(now - at) + ' ago');
      if (r && r.frozen) bits.push('no longer updating');
      else if (r && r.next_ts) {
        bits.push(now >= r.next_ts ? 'next due now'
                                   : 'next in ' + gap(r.next_ts - now));
      }
      if (!bits.length) return '';
      return '<span class="go-fresh"' +
        (r && r.note ? ' title="' + esc(r.note) + '"' : '') + '>' +
        esc(bits.join(' \u00b7 ')) + '</span>';
    }

    /* ---------- generic table ----------
     * Used for odds and props, whose row shapes are undocumented and have never
     * been observed against a live key. Rendering the union of whatever keys
     * arrive cannot be wrong, and is the quickest way to learn the real shape
     * the first time a paid key runs. Nested objects (a player, a team) are
     * flattened one level so their fields become columns rather than JSON. */
    function flatten(row) {
      var out = {};
      Object.keys(row).forEach(function (k) {
        var v = row[k];
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          Object.keys(v).forEach(function (k2) {
            if (v[k2] === null || typeof v[k2] !== 'object') out[k + '.' + k2] = v[k2];
          });
        } else {
          out[k] = v;
        }
      });
      return out;
    }

    function genericTable(rows, labelFn) {
      var headFn = labelFn || label;
      if (!rows || !rows.length) return '';
      var flat = rows.map(flatten);
      var keys = [];
      flat.forEach(function (r) {
        Object.keys(r).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
      });
      // Drop columns that are null in every row — an undocumented payload
      // carries a lot of them and they add nothing but width.
      keys = keys.filter(function (k) {
        return flat.some(function (r) { return r[k] !== null && r[k] !== undefined; });
      });
      return '<div class="go-scroll"><table class="go-table"><thead><tr>' +
        keys.map(function (k) { return thCell(headFn(k)); }).join('') +
        '</tr></thead><tbody>' +
        flat.map(function (r) {
          return '<tr>' + keys.map(function (k) { return cell(r[k]); }).join('') + '</tr>';
        }).join('') +
        '</tbody></table></div>';
    }

    /* ---------- sections ---------- */

    function unavailableFor(bundle, paths) {
      var notes = bundle.unavailable || [];
      for (var i = 0; i < notes.length; i++) {
        if (paths.indexOf(notes[i].path) >= 0) return notes[i];
      }
      return null;
    }

    function emptyState(bundle, paths, what) {
      var note = unavailableFor(bundle, paths);
      if (!note) {
        return '<div class="go-empty">No ' + esc(what) +
          ' in this bundle — the endpoint answered, with nothing in it.</div>';
      }
      var tier = String(note.needs_tier || '').toUpperCase();
      var reason = note.error === 'CassetteMiss'
        ? 'was never recorded, so <code>--replay</code> has nothing to serve'
        : 'needs a plan this key is not on';
      return '<div class="go-empty">' +
        'No ' + esc(what) + ' captured. <code>' + esc(note.path) + '</code> ' + reason +
        ' — <span class="go-tier">' + esc(tier) + '</span><br>' +
        'Re-run <code>python3 scripts/fetch_bdl_game.py --game-id ' +
        esc(bundle.game.id) + ' --record --publish</code> on a ' + esc(tier) +
        ' key and this section fills in.</div>';
    }

    function card(title, body, flush) {
      return '<section class="go-card">' +
        '<div class="go-card-head"><h3>' + esc(title) + '</h3></div>' +
        '<div class="go-card-body' + (flush ? ' is-flush' : '') + '">' +
        body + '</div></section>';
    }

    /* The chip is the whole status line now. Before kickoff that is the
     * kickoff itself -- the only fact a scheduled game has -- and afterwards it
     * is where the game is, in words rather than the bundle's `pregame` /
     * `live` / `final` enum. An unrecognised phase falls back to its own name
     * so a new one from the feed shows up rather than rendering blank. */
    var PHASE_TEXT = { live: 'In progress', final: 'Final' };

    function phaseText(b) {
      var g = b.game;
      if (b.phase === 'pregame') {
        return kickoffET(g.kickoff_raw || g.kickoff_utc) || g.kickoff_et || 'Scheduled';
      }
      return PHASE_TEXT[b.phase] || label(b.phase || '');
    }

    function heroSection(b) {
      var g = b.game;
      var sc = g.score;
      var aw = '', hw = '';
      if (sc && sc.away !== null && sc.home !== null) {
        aw = sc.away > sc.home ? ' is-win' : (sc.away < sc.home ? ' is-loss' : '');
        hw = sc.home > sc.away ? ' is-win' : (sc.home < sc.away ? ' is-loss' : '');
      }
      // The quarter table is drawn only once there is a game to draw it from.
      var line = '';
      if (sc && sc.away_line) {
        var cols = ['1', '2', '3', '4', 'OT'];
        // Overtime column only when someone actually scored in it.
        var n = (sc.away_line[4] || sc.home_line[4]) ? 5 : 4;
        line = '<table class="go-line"><thead><tr><th></th>' +
          cols.slice(0, n).map(function (c) { return '<th>' + c + '</th>'; }).join('') +
          '<th>T</th></tr></thead><tbody>' +
          [['away', g.away.abbr, sc.away_line, sc.away],
           ['home', g.home.abbr, sc.home_line, sc.home]].map(function (r) {
            return '<tr><td>' + esc(r[1]) + '</td>' +
              r[2].slice(0, n).map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') +
              '<td class="go-total">' + esc(r[3]) + '</td></tr>';
          }).join('') + '</tbody></table>';
      }

      /* Kickoff and status both answer "where is this game", and both are now
       * the chip's job, so neither is repeated here. What is left is the one
       * fact the chip does not carry. */
      var meta = [];
      if (g.venue) meta.push('<b>Venue</b> ' + esc(g.venue));

      return '<div class="go-hero"><div class="go-hero-top">' +
        '<div class="go-matchup">' +
          '<span class="go-side' + aw + '">' + teamLogo(g.away.abbr, 'go-logo') +
            esc(g.away.abbr) + '</span>' +
          '<span class="go-at">' + (g.neutral ? 'vs' : '@') + '</span>' +
          '<span class="go-side' + hw + '">' + teamLogo(g.home.abbr, 'go-logo') +
            esc(g.home.abbr) + '</span>' +
        '</div>' +
        '<span class="go-status">' +
          '<span class="go-phase ' + esc(b.phase) + '">' + esc(phaseText(b)) + '</span>' +
          freshness(b) +
        '</span>' +
        '</div>' +
        (meta.length ? '<div class="go-meta">' + meta.join('') + '</div>' : '') +
        line + '</div>';
    }

    function teamStatsSection(b) {
      var a = b.team_stats && b.team_stats.away;
      var h = b.team_stats && b.team_stats.home;
      if (!a || !h) {
        return card('Team stats',
          emptyState(b, ['/team_stats'], 'team stats'), true);
      }
      /* possession_time_seconds is possession_time in a unit nobody reads a
       * clock in — 33:11 and 1991 are one row, not two. */
      var skip = { game: 1, team: 1, home_away: 1, possession_time_seconds: 1 };
      var keys = Object.keys(a).filter(function (k) {
        return !skip[k] && (typeof a[k] !== 'object' || a[k] === null);
      });
      var rows = keys.map(function (k) {
        var av = a[k], hv = h[k];
        var ab = isNum(av) && isNum(hv) && av > hv ? ' is-better' : '';
        var hb = isNum(av) && isNum(hv) && hv > av ? ' is-better' : '';
        var hd = teamHeading(k);
        return '<tr><td class="go-val' + ab + '">' + esc(av === null ? '—' : av) + '</td>' +
          '<td class="go-stat"' + (hd.t ? ' title="' + esc(hd.t) + '"' : '') + '>' +
            esc(hd.s) + '</td>' +
          '<td class="go-val' + hb + '">' + esc(hv === null ? '—' : hv) + '</td></tr>';
      }).join('');
      return card('Team stats',
        '<table class="go-vs"><thead><tr>' +
          '<th class="go-vs-team">' + teamLogo(b.game.away.abbr, 'go-logo-sm') +
            esc(b.game.away.abbr) + '</th><th></th>' +
          '<th class="go-vs-team">' + teamLogo(b.game.home.abbr, 'go-logo-sm') +
            esc(b.game.home.abbr) + '</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>');
    }

    /* The fallback for a box-score key STAT_ABBR has no entry for — a field
     * balldontlie adds after this map was written.
     *
     * A stat's group already names it. Under the Receiving heading, a column
     * called "Receiving Targets" says "receiving" twice and pushes the word that
     * distinguishes it — Targets — to where it is read last. So the group's own
     * prefix comes off its children, which is most of the way to the
     * abbreviation and costs nothing to keep for the keys nobody has seen yet.
     *
     * The prefixes are listed rather than derived from the group name, because
     * three of them do not match it: defense's fields are `defensive_*`,
     * kicking's are `field_goal*`, punting's are `punt_*`. And `returns` is
     * deliberately empty — its fields are `kick_return_yards` and
     * `punt_return_yards`, so stripping to "Yards" would produce two identically
     * named columns and lose the only thing that told them apart.
     *
     * Only a prefix that leaves something behind is removed: the `fumbles` group
     * contains a bare `fumbles`, which must stay "Fumbles" rather than become
     * blank. */
    var GROUP_PREFIX = {
      passing: ['passing_'],
      rushing: ['rushing_'],
      receiving: ['receiving_'],
      fumbles: ['fumbles_'],
      defense: ['defensive_'],
      kicking: ['field_goals_', 'field_goal_'],
      punting: ['punt_'],
      returns: []
    };

    function groupLabel(grp) {
      var prefixes = GROUP_PREFIX[grp] || [grp + '_'];
      var map = STAT_ABBR[grp] || {};
      /* The tooltip is always the whole key spelled out — "Receiving Yards",
       * not the "Yards" the prefix-stripping would leave. Under a Receiving
       * heading the group is obvious in the column and useless in the tooltip,
       * which is read on its own. */
      return function (key) {
        if (map[key]) return heading(map[key], fullLabel(key));
        for (var i = 0; i < prefixes.length; i++) {
          var p = prefixes[i];
          if (key.indexOf(p) === 0 && key.length > p.length) {
            return heading(label(key.slice(p.length)), fullLabel(key));
          }
        }
        return heading(label(key), null);
      };
    }

    function playerStatsSection(b) {
      var ps = b.player_stats || {};
      var total = ['away', 'home'].reduce(function (n, s) {
        return n + ((ps[s] || []).length);
      }, 0);
      if (!total) {
        return card('Box score', emptyState(b, ['/stats'], 'player stats'), true);
      }
      var groups = ['passing', 'rushing', 'receiving', 'defense', 'kicking',
                    'returns', 'punting', 'fumbles'];
      var html = '';
      ['away', 'home'].forEach(function (side) {
        var rows = ps[side] || [];
        if (!rows.length) return;
        html += '<h4 style="margin:14px 0 6px;font-size:12px">' +
          esc(b.game[side].name) + '</h4>';
        groups.forEach(function (grp) {
          var withGrp = rows.filter(function (r) { return r[grp]; });
          if (!withGrp.length) return;
          var flat = withGrp.map(function (r) {
            var o = { player: initialName((r.player || {}).first_name,
              (r.player || {}).last_name) || (r.player || {}).id };
            Object.keys(r[grp]).forEach(function (k) { o[k] = r[grp][k]; });
            return o;
          });
          html += '<div class="go-sub" style="margin:10px 0 4px">' +
            esc(label(grp)) + '</div>' + genericTable(flat, groupLabel(grp));
        });
      });
      return card('Box score', html);
    }

    /* Overtime is period 5 and up, so it was rendering as "Q5" -- not a
     * quarter, and not something the quarter filters below could name either.
     * One label function now answers both. */
    function periodLabel(n) {
      var p = Number(n);
      if (!(p > 0)) return '';
      return p > 5 ? 'OT' + (p - 4) : (p > 4 ? 'OT' : 'Q' + p);
    }

    function playRow(pl) {
      return '<div class="go-play' + (pl.scoring_play ? ' is-scoring' : '') + '">' +
        '<span class="go-clock">' + esc(periodLabel(pl.period)) + ' ' +
          esc(pl.clock_display || '') + '</span>' +
        '<span class="go-pteam">' + esc((pl.team || {}).abbreviation || '') + '</span>' +
        '<span class="go-ptext">' + esc(pl.text || pl.short_text || '') + '</span>' +
        '<span class="go-pscore">' + esc(pl.away_score) + '–' + esc(pl.home_score) +
        '</span></div>';
    }

    /* A filter is one predicate over rows that are already on the page -- the
     * whole log ships inside the bundle, so switching view is not a fetch and
     * not a re-render of anything but the list. `scoring` reads the feed's own
     * flag rather than matching on the play text, and a quarter key is just the
     * period number it ends with, which is what lets the overtime chips fall
     * out of the same three lines. */
    function playPredicate(key) {
      if (key === 'scoring') return function (pl) { return !!pl.scoring_play; };
      if (key.charAt(0) === 'q') {
        var n = parseInt(key.slice(1), 10);
        return function (pl) { return Number(pl.period) === n; };
      }
      return function () { return true; };
    }

    /* Q1 through Q4 always, so a game at halftime offers the same controls a
     * final one does and an empty quarter reads as "not yet" rather than as a
     * missing button. Overtime is the exception: those chips appear only when
     * the log actually reaches that period, because most games never do. */
    function playFilters(p) {
      var periods = [1, 2, 3, 4];
      (p.all || []).forEach(function (pl) {
        var n = Number(pl.period);
        if (n > 4 && periods.indexOf(n) < 0) periods.push(n);
      });
      periods.sort(function (a, c) { return a - c; });
      var out = [{ key: 'all', text: 'All' }];
      periods.forEach(function (n) { out.push({ key: 'q' + n, text: periodLabel(n) }); });
      if (p.scoring_count) out.push({ key: 'scoring', text: 'Scoring' });
      return out;
    }

    function playsSection(b) {
      var p = b.plays || { count: 0, all: [] };
      if (!p.count) {
        return card('Play log', emptyState(b, ['/plays'], 'plays'), true);
      }
      var seg = playFilters(p).map(function (f, i) {
        return '<button type="button" data-play-filter="' + esc(f.key) +
          '" aria-pressed="' + (i ? 'false' : 'true') + '">' + esc(f.text) +
          '</button>';
      }).join('');
      return card('Play log',
        '<div class="go-seg" id="play-filters">' + seg + '</div>' +
        '<div class="go-plays" id="play-list"></div>', true);
    }

    /* Wired after every render for the same reason wireProps is: a poll
     * replaces the section wholesale and takes its listeners with it. */
    function wirePlays(b) {
      var segEl = document.getElementById('play-filters');
      var listEl = document.getElementById('play-list');
      if (!segEl || !listEl) return;
      var all = (b.plays || {}).all || [];

      function draw(key) {
        var rows = all.filter(playPredicate(key));
        listEl.innerHTML = rows.length
          ? rows.map(playRow).join('')
          : '<div class="go-empty">No plays in that filter yet.</div>';
      }

      segEl.addEventListener('click', function (e) {
        var btn = e.target && e.target.getAttribute &&
          e.target.getAttribute('data-play-filter') !== null ? e.target : null;
        if (!btn) return;
        var buttons = segEl.querySelectorAll('[data-play-filter]');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].setAttribute('aria-pressed',
            buttons[i] === btn ? 'true' : 'false');
        }
        draw(btn.getAttribute('data-play-filter'));
      });
      draw('all');
    }

    /* ---------- odds ----------
     * Shape settled by probing a live key, not by the docs: one row per
     * sportsbook with spread / moneyline / total in flat columns, and the book
     * in `vendor`. Rendered as one small table per book rather than one wide
     * one: laid out flat, the two sides of every market sit in eight columns
     * that no phone can hold, so the table scrolled sideways and the price a
     * reader came for was off-screen. Pivoted, a book is four columns — team,
     * spread, moneyline, total — and the two teams are the two rows, which
     * fits without scrolling and puts the two sides of a market adjacent. */

    /* Books arrive as their API slug — `draftkings`, `fanduel`. Both the odds
     * tables and the props grid label the book in a header cell sitting over
     * narrow numeric columns, where the full name is several times the width
     * of the numbers under it, so it is shortened to the ticker a line-shopping
     * grid is read with. An unmapped book falls back to its slug uppercased:
     * wrong-looking enough to notice and add rather than quietly rendering as
     * something else. */
    var BOOK_SHORT = {
      draftkings: 'DK', fanduel: 'FD', betmgm: 'MGM', caesars: 'CZR',
      betrivers: 'BR', fanatics: 'FAN', espnbet: 'ESPN', bet365: 'B365',
      pointsbet: 'PB', hardrock: 'HR'
    };

    var BOOK_NAME = {
      draftkings: 'DraftKings', fanduel: 'FanDuel', betmgm: 'BetMGM',
      caesars: 'Caesars', betrivers: 'BetRivers', fanatics: 'Fanatics',
      espnbet: 'ESPN BET', bet365: 'bet365', pointsbet: 'PointsBet',
      hardrock: 'Hard Rock Bet'
    };

    function bookLabel(v) {
      var k = String(v == null ? '' : v).toLowerCase();
      return BOOK_SHORT[k] || k.toUpperCase();
    }

    function bookHeading(v) {
      var k = String(v == null ? '' : v).toLowerCase();
      return heading(bookLabel(v), BOOK_NAME[k] || null);
    }

    /* The thead of both tables is two rows: one book per spanning cell, then
     * that book's columns under it. `go-bk` marks the first column of each
     * group so the CSS can rule the boundary — skipped on the leading group of
     * a table that starts with one, where the rule would land on the edge. */
    function groupHead(books, sub, lead) {
      return '<tr>' + (lead || '') + books.map(function (v, i) {
          var b = bookHeading(v);
          return '<th' + (i || lead ? ' class="go-bk"' : '') +
            (b.t ? ' title="' + esc(b.t) + '"' : '') +
            ' colspan="' + sub.length + '">' + esc(b.s) + '</th>';
        }).join('') +
        '</tr><tr>' + books.map(function (v, i) {
          return sub.map(function (h, j) {
            return thCell(h, (!j && (i || lead)) ? 'go-bk' : '');
          }).join('');
        }).join('') + '</tr>';
    }

    function fmtOdds(n) {
      if (n === null || n === undefined || n === '') return '—';
      return (n > 0 ? '+' : '') + n;
    }

    function fmtSpread(v) {
      if (v === null || v === undefined || v === '') return '—';
      var s = String(v);
      return s.charAt(0) === '-' ? s : '+' + s;
    }

    /* A market cell is the line and the price it is offered at — `-3.5 (-110)`.
     * Either half can be missing on a book that has posted one and not the
     * other, and `-3.5 (—)` reads as a price rather than an absence, so a
     * half-quoted market renders only the half that exists. */
    function lineCell(value, odds, fmt) {
      var hasV = value !== null && value !== undefined && value !== '';
      var hasO = odds !== null && odds !== undefined && odds !== '';
      if (!hasV) return hasO ? fmtOdds(odds) : '—';
      return fmt(value) + (hasO ? ' (' + fmtOdds(odds) + ')' : '');
    }

    /* The total is one line quoted from both sides, so it is not a property of
     * either team the way the spread and the moneyline are. It is split down
     * the same two rows anyway — over on top, under below, each prefixed with
     * the side it is — because a third row for one market would cost more than
     * the small fiction that the over belongs to the away team. */
    function totalCell(r, side) {
      return lineCell(r.total_value,
        side === 'over' ? r.total_over_odds : r.total_under_odds,
        function (v) { return (side === 'over' ? 'o' : 'u') + v; });
    }

    function oddsRow(t, spread, ml, tot) {
      return '<tr><th scope="row" class="go-tm">' + teamLogo(t.abbr, 'go-logo-sm') +
        esc(t.abbr) + '</th>' +
        '<td class="is-num">' + esc(spread) + '</td>' +
        '<td class="is-num">' + esc(ml) + '</td>' +
        '<td class="is-num">' + esc(tot) + '</td></tr>';
    }

    /* One book, one table: the book names the team column, the markets are the
     * other three headings, and the away team leads the way it does everywhere
     * else on the page. */
    function bookTable(r, g) {
      var b = bookHeading(r.vendor);
      return '<div class="go-book"><table class="go-table go-odds"><thead><tr>' +
          '<th class="go-tm"' + (b.t ? ' title="' + esc(b.t) + '"' : '') + '>' +
            esc(b.s) + '</th>' +
          thCell(heading('Spread', 'Point spread'), 'is-num') +
          thCell(heading('ML', 'Moneyline'), 'is-num') +
          thCell(heading('Total', 'Total points line'), 'is-num') +
        '</tr></thead><tbody>' +
        oddsRow(g.away,
          lineCell(r.spread_away_value, r.spread_away_odds, fmtSpread),
          fmtOdds(r.moneyline_away_odds),
          totalCell(r, 'over')) +
        oddsRow(g.home,
          lineCell(r.spread_home_value, r.spread_home_odds, fmtSpread),
          fmtOdds(r.moneyline_home_odds),
          totalCell(r, 'under')) +
        '</tbody></table></div>';
    }

    function oddsTable(rows, g) {
      var quotes = rows.slice().sort(function (a, b2) {
        return String(a.vendor).localeCompare(String(b2.vendor));
      });
      return '<div class="go-books">' +
        quotes.map(function (r) { return bookTable(r, g); }).join('') +
        '</div>';
    }

    function oddsSection(b) {
      var o = b.odds || { current: [], opening: [] };
      if (!o.current.length && !o.opening.length) {
        return card('Betting odds',
          emptyState(b, ['/odds', '/odds/opening'], 'odds'), true);
      }
      var body = '';
      if (o.current.length) {
        body += '<div class="go-sub" style="margin:0 0 6px 9px">Current</div>' +
          oddsTable(o.current, b.game);
      }
      if (o.opening.length) {
        body += '<div class="go-sub" style="margin:14px 0 6px 9px">Opening</div>' +
          oddsTable(o.opening, b.game);
      }
      // A settled game keeps its opening line but not its closing one — worth
      // saying, because an empty "Current" on a finished game is a property of
      // the feed, not a gap in the capture.
      if (!o.current.length && o.opening.length) {
        body += '<div class="go-empty" style="padding:12px 0 0">' +
          'No current line: balldontlie does not retain closing odds once a game ' +
          'is over. Opening is kept.</div>';
      }
      return card('Betting odds', body);
    }

    /* ---------- props ----------
     * Several thousand rows per game — 34 players x 25 markets x 6 books, and
     * both sides of every over/under — so a flat dump is unreadable and a
     * truncated one is a lie. Two selects cut it to one market, and inside it
     * every book quoting that market sits side by side under its own spanning
     * header, which is the question anyone actually has ("what is Maye's
     * passing yards line, and who has the best price").
     *
     * Two market shapes come back and both are handled: `milestone` is an
     * alternate-line ladder with a single price per line, `over_under` is the
     * conventional two-sided line. */

    /* Current only. An opening line answers a different question — how the
     * market moved — and that is not what this board is for; carrying it as a
     * filter put a second decision in front of the one price anyone came to
     * read. */
    function propRows(b) {
      return (b.player_props && b.player_props.current) || [];
    }

    function playerOf(b, id) {
      return (b.players && b.players[String(id)]) || null;
    }

    function propsTable(b, rows) {
      /* Book as a column group, not a column: a row is one player at one line
       * and holds every book's price for it, so the comparison is read across
       * rather than by hunting down the table for the second row with the same
       * name. Where two books hang the line in different places the row splits
       * and the empty half says which of them is not offering it. */
      var books = ((b.player_props && b.player_props.books) || []).slice();
      rows.forEach(function (r) {
        if (books.indexOf(r.vendor) < 0) books.push(r.vendor);
      });
      books = books.filter(function (v) {
        return rows.some(function (r) { return r.vendor === v; });
      });

      var order = [], byKey = {};
      rows.forEach(function (r) {
        var k = r.player_id + '|' + r.line_value;
        if (!byKey[k]) {
          byKey[k] = { player_id: r.player_id, line: r.line_value, quotes: {} };
          order.push(k);
        }
        byKey[k].quotes[r.vendor] = r;
      });

      /* Sorted on the name as it is displayed, which is now the surname:
       * ordering by the full name while showing "P. Mahomes" reads as unsorted
       * to anyone scanning the first column. */
      var body = order.map(function (k) { return byKey[k]; }).sort(function (x, y) {
        var px = playerOf(b, x.player_id), py = playerOf(b, y.player_id);
        var nx = (px && shortenName(px.name)) || String(x.player_id);
        var ny = (py && shortenName(py.name)) || String(y.player_id);
        if (nx !== ny) return nx.localeCompare(ny);
        return parseFloat(x.line) - parseFloat(y.line);
      }).map(function (row) {
        var pl = playerOf(b, row.player_id);
        return '<tr>' +
          '<td>' + esc(pl ? shortenName(pl.name) : row.player_id) + '</td>' +
          books.map(function (v) {
            var r = row.quotes[v];
            if (!r) {
              return '<td class="is-null go-bk">—</td>' +
                '<td class="is-null">—</td><td class="is-null">—</td>' +
                '<td class="is-null">—</td>';
            }
            var m = r.market || {};
            var mile = m.type === 'milestone', ou = m.type === 'over_under';
            return '<td class="is-num go-bk">' + esc(r.line_value) + '</td>' +
              '<td class="is-num">' + (mile ? esc(fmtOdds(m.odds)) : '') + '</td>' +
              '<td class="is-num">' + (ou ? esc(fmtOdds(m.over_odds)) : '') + '</td>' +
              '<td class="is-num">' + (ou ? esc(fmtOdds(m.under_odds)) : '') + '</td>';
          }).join('') +
        '</tr>';
      }).join('');

      return '<div class="go-scroll"><table class="go-table go-grouped go-pinned"><thead>' +
        groupHead(books, ['Line', 'Odds', 'Over', 'Under'],
          '<th rowspan="2">Player</th>') +
        '</thead><tbody>' + body + '</tbody></table></div>';
    }

    function propsSection(b) {
      var p = b.player_props || { current: [] };
      if (!p.current.length) {
        return card('Player props',
          emptyState(b, ['/odds/player_props'], 'player props'), true);
      }
      /* The bundle's market list is the union across current and opening, so a
       * market priced only at open would be an option that draws an empty
       * table. Kept in the bundle's order, with anything the rows carry and
       * the list does not appended rather than dropped. */
      var have = {};
      p.current.forEach(function (r) { have[r.prop_type] = 1; });
      var markets = (p.markets || []).filter(function (m) { return have[m]; });
      Object.keys(have).forEach(function (m) {
        if (markets.indexOf(m) < 0) markets.push(m);
      });

      var controls =
        '<div class="dd-row" style="margin-bottom:12px;gap:8px;display:flex;flex-wrap:wrap">' +
          '<select id="prop-market" class="go-select">' +
            markets.map(function (m) {
              var h = marketHeading(m);
              return '<option value="' + esc(m) + '"' +
                (h.t ? ' title="' + esc(h.t) + '"' : '') + '>' +
                esc(h.s) + '</option>';
            }).join('') +
          '</select>' +
          '<select id="prop-player" class="go-select"></select>' +
        '</div><div id="prop-table"></div>';
      return card('Player props', controls);
    }

    /* innerHTML wipes listeners, so the props controls are wired after every
     * render rather than once at load. */
    function wireProps(b) {
      var marketEl = document.getElementById('prop-market');
      var playerEl = document.getElementById('prop-player');
      var tableEl = document.getElementById('prop-table');
      if (!tableEl) return;

      // A <select> reports its first option as the value, but only once it is
      // in a document. Setting it explicitly makes the first draw independent
      // of that, which also keeps the page testable outside a browser.
      function firstValue(el) {
        return el && el.options && el.options.length ? el.options[0].value : '';
      }
      if (marketEl && !marketEl.value) marketEl.value = firstValue(marketEl);

      function marketRows() {
        return propRows(b).filter(function (r) {
          return r.prop_type === marketEl.value;
        });
      }

      /* The player list is per market, not per game: a receiving-yards board
       * has no quarterbacks on it, and offering every player who is quoted
       * anywhere would fill the menu with names that empty the table. Named
       * and ordered the way the first column is, so the menu and the rows read
       * as the same list. A selection that survives the market change is
       * kept — the same player at a different market is a common next look. */
      function fillPlayers(rows) {
        var keep = playerEl.value, seen = {}, opts = [];
        rows.forEach(function (r) {
          var id = String(r.player_id);
          if (seen[id]) return;
          seen[id] = 1;
          var pl = playerOf(b, r.player_id);
          opts.push({ id: id, name: (pl && shortenName(pl.name)) || id });
        });
        opts.sort(function (x, y) { return x.name.localeCompare(y.name); });
        playerEl.innerHTML = '<option value="">All players</option>' +
          opts.map(function (o) {
            return '<option value="' + esc(o.id) + '">' + esc(o.name) + '</option>';
          }).join('');
        playerEl.value = seen[keep] ? keep : '';
      }

      function draw() {
        var rows = marketRows();
        if (playerEl.value) {
          rows = rows.filter(function (r) {
            return String(r.player_id) === playerEl.value;
          });
        }
        tableEl.innerHTML = rows.length
          ? propsTable(b, rows)
          : '<div class="go-empty">No quotes for that combination.</div>';
      }

      function onMarket() { fillPlayers(marketRows()); draw(); }

      if (marketEl) marketEl.addEventListener('change', onMarket);
      playerEl.addEventListener('change', draw);
      onMarket();
    }

    /* ---------- injuries ----------
     * /player_injuries returns no team of its own — the team hangs off the
     * player — and embeds the full player record, so the generic table would
     * spread height, weight, college and jersey number across fourteen columns.
     * These are the five fields anyone reads. */

    function injuryTable(rows) {
      var body = rows.map(function (r) {
        var pl = r.player || {};
        return '<tr>' +
          '<td>' + esc(initialName(pl.first_name, pl.last_name)) + '</td>' +
          '<td>' + esc(pl.position_abbreviation || pl.position || '') + '</td>' +
          '<td>' + esc((pl.team || {}).abbreviation || '') + '</td>' +
          statusCell(r.status) +
          '<td class="go-note">' + esc(r.comment || '') + '</td>' +
          '<td>' + esc(r.date || '—') + '</td>' +
        '</tr>';
      }).join('');
      /* Comment is the one free-text column on the page, so it is the one
       * column that wraps and is capped rather than run out to whatever the
       * longest note happens to be. */
      return '<div class="go-scroll"><table class="go-table go-pinned"><thead><tr>' +
        thCell(heading('Player', null)) +
        thCell(heading('Pos', 'Position')) +
        thCell(heading('Team', null)) +
        thCell(heading('Status', 'Injury designation')) +
        thCell(heading('Comment', null), 'go-note') +
        thCell(heading('Updated', 'Last reported')) +
        '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }

    function injuriesSection(b) {
      var inj = b.injuries || {};
      var rows = (inj.away || []).concat(inj.home || []).concat(inj.unknown || []);
      if (!rows.length) {
        return card('Injury report',
          emptyState(b, ['/player_injuries'], 'injury data'), true);
      }
      return card('Injury report', injuryTable(rows));
    }

    /* Sibling games. This listed every captured game when there were four of
     * them; backfilling 2025 turned that into a 278-chip wall on every page,
     * and trimming it to the game's own slate only moved the problem — a
     * capped, re-sorted list of sixteen still spends the bottom of a page
     * about one game on fifteen others, and still has to explain what it left
     * out. The whole set has a page of its own now, so what stays here is the
     * door to it: one line, one link, and the count that says how much is
     * behind it. */
    function othersSection(index, currentId) {
      var games = (index && index.games) || {};
      var n = Object.keys(games).filter(function (id) {
        return id !== String(currentId);
      }).length;
      if (!n) return '';
      return card('Other captured games',
        '<div class="go-empty">' +
          '<a href="/football/schedule/archive">Browse the capture archive</a>' +
          ' — ' + n + ' other game' + (n === 1 ? '' : 's') +
          ' captured, listed by season and week.</div>', true);
    }

    function provenance(b) {
      var n = (b.unavailable || []).length;
      // Say so when the capture is not everything on offer. A prop board that
      // silently omits six books looks like a thin market rather than a choice.
      var filt = b.books_filter && b.books_filter.length
        ? ' · books <code>' + esc(b.books_filter.join(', ')) + '</code>'
        : '';
      return '<p class="go-prov">' +
        'Source <code>balldontlie</code> · game <code>' + esc(b.game.id) + '</code> · ' +
        'captured <code>' + esc(b.fetched_at) + '</code>' + filt +
        (n ? ' · <b>' + n + '</b> endpoint' + (n === 1 ? '' : 's') +
             ' unavailable on the key that fetched this' : '') +
        (b.refresh ? '<br>Refresh policy <code>' + esc(b.refresh.policy) +
          '</code> — ' + esc(b.refresh.note || '') +
          (b.refresh.frozen ? '' :
            ', so this is re-captured every ' + esc(gap(b.refresh.interval_s)) +
            ' by <code>scripts/bdl_refresh.py</code>') + '.' : '') +
        '<br>Published to Supabase by <code>scripts/fetch_bdl_game.py --publish</code>, ' +
        'swept by <code>scripts/bdl_refresh.py</code>. The page re-checks on the ' +
        'same schedule, so it does not need reloading.</p>';
    }

    /* ---------- render ---------- */

    /* ---------- nothing captured yet ----------
     *
     * The interesting half of this page. A bundle exists only once something
     * has fetched it, and until this sweep existed that meant somebody typing a
     * command, so 270-odd of the 272 rows on the schedule landed here. Now the
     * honest answer is a time, not an instruction — so the empty state looks the
     * game up in the committed schedule and says when it gets captured.
     *
     * Mirrors DISTANT_HORIZON in scripts/fetch_bdl_game.py, and is the only
     * piece of the refresh policy this page has to know for itself: a captured
     * game carries refresh_plan()'s real answer in its bundle, and a game that
     * was never captured has no bundle to carry one. */
    var CAPTURE_HORIZON_DAYS = 8;

    /* The season is named for the year it starts in and runs into February, so
     * through the winter both are live. Two files, ~40 KB each, served with an
     * hour of cache — and only ever fetched on this path, where the page has
     * nothing else to say. */
    function likelySeasons() {
      var d = new Date(), y = d.getFullYear();
      var cur = d.getMonth() >= 2 ? y : y - 1;
      return [cur, cur - 1];
    }

    var schedCache = null;

    function scheduleLookup(id) {
      if (!schedCache) {
        schedCache = Promise.all(likelySeasons().map(function (yr) {
          return fetch('/data/nfl_schedule_' + yr + '.json')
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }));
      }
      return schedCache.then(function (docs) {
        for (var i = 0; i < docs.length; i++) {
          var doc = docs[i];
          if (!doc) continue;
          for (var w = 0; w < (doc.weeks || []).length; w++) {
            var wk = doc.weeks[w];
            for (var j = 0; j < (wk.games || []).length; j++) {
              var g = wk.games[j];
              if (String(g.id) === String(id)) {
                return { id: String(g.id), away: g.away, home: g.home,
                         kickoff: g.kickoff, venue: g.venue, neutral: !!g.neutral,
                         week: wk.week, season: doc.season };
              }
            }
          }
        }
        return null;
      }).catch(function () { return null; });
    }

    function whenCaptured(row) {
      if (!row) {
        return 'This id is not on the 2026 or 2025 schedule, so nothing is ' +
          'scheduled to capture it. Check the id, or fetch it directly:';
      }
      var k = stamp(row.kickoff);
      if (k === null) return 'This game has no kickoff time yet, so there is ' +
        'nothing to schedule a capture against.';
      var now = Date.now() / 1000, out = k - now;
      var horizon = CAPTURE_HORIZON_DAYS * 86400;
      if (out > horizon) {
        var opens = new Date((k - horizon) * 1000);
        return 'Capture starts ' + CAPTURE_HORIZON_DAYS + ' days before kickoff — ' +
          'around ' + opens.toLocaleDateString('en-US',
            { weekday: 'short', month: 'short', day: 'numeric' }) +
          ', in about ' + gap(out - horizon) + '. Before then there is nothing ' +
          'to publish: the books have not posted a line.';
      }
      if (out > 0) {
        return 'This game is inside the capture window and has not been swept ' +
          'yet. The next sweep publishes it, and this page picks it up on its ' +
          'own — no reload needed.';
      }
      return 'This game finished without ever being captured. Settled games ' +
        'never change, so nothing re-checks them on a schedule; they get filled ' +
        'in deliberately:';
    }

    function needsCommand(row) {
      if (!row) return true;
      var k = stamp(row.kickoff);
      return k !== null && k < Date.now() / 1000;
    }

    function renderMissing(id, index, row) {
      var games = (index && index.games) || {};
      var known = Object.keys(games).length;
      var head = 'No game selected', body;

      if (!id) {
        crumbEl.textContent = 'Game';
        body = 'A game page is <code>/football/schedule/game/&lt;id&gt;</code>. ' +
          'Pick one below, or start from <a href="/football/schedule">the schedule</a>.';
      } else {
        var tag = row ? row.away + ' @ ' + row.home : 'game ' + id;
        crumbEl.textContent = tag;
        head = 'Not captured yet — ' + tag;
        body = (row
          ? '<div class="go-miss-head">' +
              '<span class="go-matchup go-matchup-sm">' +
                '<span class="go-side">' + teamLogo(row.away, 'go-logo-sm') +
                  esc(row.away) + '</span>' +
                '<span class="go-at">' + (row.neutral ? 'vs' : '@') + '</span>' +
                '<span class="go-side">' + teamLogo(row.home, 'go-logo-sm') +
                  esc(row.home) + '</span>' +
              '</span>' +
              '<span class="go-miss-when">' + esc(kickoffET(row.kickoff)) +
                (row.week ? ' \u00b7 week ' + esc(row.week) : '') + '</span>' +
            '</div>'
          : '') +
          whenCaptured(row) +
          (needsCommand(row)
            ? '<br><br><code>python3 scripts/bdl_refresh.py --game-id ' + esc(id) +
              ' --publish</code>'
            : '');
      }

      pageEl.innerHTML = card(head, '<div class="go-empty">' + body + '</div>', true) +
        (known ? othersSection(index, id) : '') +
        '<p class="go-prov">Every row on <a href="/football/schedule">the schedule</a> ' +
        'links here. ' + known + ' game' + (known === 1 ? '' : 's') +
        ' published so far, swept by <code>scripts/bdl_refresh.py</code>.</p>';
    }

    function render(b, index) {
      var g = b.game;
      crumbEl.textContent = g.away.abbr + ' @ ' + g.home.abbr;
      document.title = g.away.abbr + ' @ ' + g.home.abbr + ' | Dynast-Z';
      /* Before kickoff the prop board is the page: there is no box score and
       * no play log, and the lines are the only thing that has moved all week.
       * Once the game is under way that inverts -- what happened outranks what
       * it was priced at -- so the board drops below the play log rather than
       * sitting between the odds and the game itself. Built once either way;
       * only its position in the string changes. */
      var props = propsSection(b);
      var pregame = b.phase === 'pregame';
      pageEl.innerHTML =
        heroSection(b) +
        oddsSection(b) +
        (pregame ? props : '') +
        teamStatsSection(b) +
        playerStatsSection(b) +
        playsSection(b) +
        (pregame ? '' : props) +
        injuriesSection(b) +
        othersSection(index, g.id) +
        provenance(b);
      wireProps(b);
      wirePlays(b);
    }

    /* ---------- load, and keep loading ----------
     *
     * A game page left open across a kickoff should not have to be reloaded by
     * hand, so it re-checks on the bundle's own schedule: `refresh.next_ts` is
     * the moment the sweep intends to have replaced it. A settled game is never
     * polled at all. It was meant to be cheap to be wrong about — the bundle's
     * etag is the sha256 of its canonical JSON, so an unchanged game should
     * cost a 304 and no body — but the etag does not reach the client (see
     * fetchBundle), so every poll is a full ~600 KB read until that is fixed.
     * The floor below is doing more work than it looks like it is.
     *
     * Held to a 60-second floor whatever the plan says, paused while the tab is
     * hidden, and resumed on the way back — a backgrounded tab polling a live
     * game every two minutes for three hours is somebody's battery. */
    var MIN_POLL = 60;
    var MISSING_POLL = 180;     // not captured yet: the sweep decides, not us
    var currentIndex = null;
    var timer = null;
    var frozen = false;         // settled: nothing upstream will change again

    /* `cache: 'no-store'` is not belt-and-braces, it is the fix. The endpoint
     * sends `no-store` on its 404 and an ETag on its 200, and neither survives
     * the hop: every /api/* response on production comes back stamped
     * `public, max-age=0, must-revalidate` with no validator, from a header
     * rule sitting above the functions. A `public` 404 with nothing to
     * revalidate against is exactly the response iOS Safari keeps on disk and
     * replays, which is how a phone ends up pinned to "not captured yet" while
     * a desktop shows the full board. Going around the HTTP cache from here
     * makes the page correct without depending on that rule being fixed.
     *
     * FAILED, not null, when the request itself falls over: null is the real
     * "no bundle stored yet" answer and it repaints the page as empty. A
     * dropped connection on a phone is not evidence the game is uncaptured,
     * and treating it as such wipes a board that was on the screen. */
    var FAILED = {};

    function fetchBundle(id) {
      // A 404 here is the ordinary "not captured yet" case, not an error.
      return fetch('/api/game-odds?game=' + encodeURIComponent(id),
                   { cache: 'no-store' })
        .then(function (r) {
          if (r.ok) return r.json();
          return r.status === 404 ? null : FAILED;
        })
        .catch(function () { return FAILED; });
    }

    function schedulePoll(id, b) {
      if (timer) { clearTimeout(timer); timer = null; }
      if (!id) return;
      var wait;
      if (!b) {
        wait = MISSING_POLL;
      } else if (b.refresh && b.refresh.frozen) {
        frozen = true;          // settled: there is no next capture to wait for
        return;
      } else if (b.refresh && b.refresh.next_ts) {
        wait = b.refresh.next_ts - Date.now() / 1000;
      } else {
        wait = 300;             // a bundle from before refresh_plan existed
      }
      timer = setTimeout(function () { poll(id); },
                         Math.max(MIN_POLL, wait) * 1000);
    }

    function paint(id, b) {
      if (b === FAILED) {
        // Leave whatever is on the page alone and come back sooner than the
        // sweep would have us: the request failed, the game did not change.
        if (timer) { clearTimeout(timer); timer = null; }
        if (id) timer = setTimeout(function () { poll(id); }, MIN_POLL * 1000);
        return;
      }
      if (b) render(b, currentIndex);
      else if (!id) renderMissing('', currentIndex, null);
      schedulePoll(id, b);
      if (!b && id) {
        scheduleLookup(id).then(function (row) {
          renderMissing(id, currentIndex, row);
        });
      }
    }

    function poll(id) {
      if (document.hidden) {
        // Come back when the tab does, rather than burning the request now.
        return schedulePoll(id, null);
      }
      fetchBundle(id).then(function (b) { paint(id, b); });
    }

    /* Coming back to the page is the moment its contents are most likely to be
     * wrong, and the two ways back are different events. `visibilitychange`
     * covers a tab switch; `pageshow` with `persisted` covers a bfcache
     * restore, where iOS hands back the rendered DOM from hours ago and
     * re-runs no script at all. Neither is gated on `timer` any more — a page
     * restored with no pending timer is the case that most needs the poll. */
    function resume() {
      var id = gameParam();
      if (id && !frozen) poll(id);
    }

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) resume();
    });

    window.addEventListener('pageshow', function (e) {
      if (e.persisted) resume();
    });

    function load() {
      var id = gameParam();
      // The index is fetched either way: it is what turns "nothing here" into
      // "nothing here, but these exist".
      var idxP = fetch(INDEX_URL, { cache: 'no-store' }).then(function (r) {
        return r.ok ? r.json() : null;
      }).catch(function () { return null; });

      Promise.all([id ? fetchBundle(id) : Promise.resolve(null), idxP])
        .then(function (res) {
          currentIndex = res[1];
          paint(id, res[0]);
        });
    }

    load();
  })();
  </script>
</body>
</html>
