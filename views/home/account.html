<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Account | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <link rel="stylesheet" href="/styles/primary/golf.css">
  <link rel="stylesheet" href="/styles/style/score-colors.css">
  <style>
    /* Lighter, higher-contrast treatment scoped to the account page only. */
    body.account-page { background: var(--panel-hi); }

    .account-page .masters-content h2 { color: var(--text-hi); }
    .account-page .masters-content .subtitle { color: var(--text-3); }
    .account-page .masters-breadcrumbs { color: var(--text-3); }

    .account-page .group-form {
      background: var(--panel-hi2);
      border: 1px solid var(--hairline-hi);
      box-shadow: 0 1px 3px var(--shadow-color);
    }
    /* "CREATE ACCOUNT" / "SIGN IN" eyebrow labels */
    .account-page .group-form > span { color: var(--text-3) !important; }
    .account-page .group-form label { color: var(--text-2); }

    .account-page .masters-search {
      background: var(--hairline);
      border-color: var(--hairline-hi);
      color: var(--text-bright);
    }
    .account-page .masters-search::placeholder { color: var(--text-4); }
    .account-page .masters-search:focus { border-color: var(--accent-2); }

    .account-page .masters-btn:not(.danger) {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: var(--bg);
    }
    .account-page .masters-btn:not(.danger):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .account-page .masters-btn:disabled { opacity: 0.55; cursor: default; }

    .account-page #acct-name { color: var(--text-hi) !important; }
  </style>
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body account-page">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <script>initPage();</script>

  <div class="masters-content" style="max-width:420px">
    <div class="masters-breadcrumbs"><a href="/">Home</a><span class="separator">/</span><span>Account</span></div>

    <!-- Logged-in state -->
    <div id="logged-in" style="display:none">
      <h2>Your Account</h2>
      <p class="subtitle">Signed in as <strong id="acct-name" style="color:var(--text-bright)"></strong></p>

      <button class="masters-btn danger" id="sign-out" style="margin-top:16px;width:100%;padding:10px">Sign Out</button>
    </div>

    <!-- Logged-out state -->
    <div id="logged-out">
      <h2>Account</h2>
      <p class="subtitle">Sync your selections across devices</p>

      <!-- Sign in -->
      <div class="group-form" style="margin-top:12px">
        <span style="font-size:11px;color:var(--text-5);font-family:monospace;display:block;margin-bottom:8px">SIGN IN</span>
        <div class="form-row">
          <label>USERNAME</label>
          <input type="text" class="masters-search" id="login-name" placeholder="Username" autocomplete="username" style="margin:0;max-width:none;flex:1">
        </div>
        <div class="form-row">
          <label>PASSWORD</label>
          <input type="password" class="masters-search" id="login-password" placeholder="Password" autocomplete="current-password" style="margin:0;max-width:none;flex:1">
        </div>
        <button class="masters-btn" id="login-btn" style="width:100%;padding:8px;margin-top:4px">Sign In</button>
        <div id="login-error" style="color:var(--bad-soft);font-size:11px;font-family:monospace;margin-top:6px;display:none"></div>
      </div>

      <!-- Create account -->
      <div class="group-form" style="margin-top:16px">
        <span style="font-size:11px;color:var(--text-5);font-family:monospace;display:block;margin-bottom:8px">CREATE ACCOUNT</span>
        <div class="form-row">
          <label>USERNAME</label>
          <input type="text" class="masters-search" id="reg-name" placeholder="Username" autocomplete="username" style="margin:0;max-width:none;flex:1">
        </div>
        <div class="form-row">
          <label>PASSWORD</label>
          <input type="password" class="masters-search" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password" style="margin:0;max-width:none;flex:1">
        </div>
        <button class="masters-btn" id="reg-btn" style="width:100%;padding:8px;margin-top:4px">Create Account</button>
        <div id="reg-error" style="color:var(--bad-soft);font-size:11px;font-family:monospace;margin-top:6px;display:none"></div>
      </div>

    </div>
  </div>

  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/sync.js"></script>
  <script src="/scripts/primary/golf-utils.js"></script>
  <script>
    // Pages that need an account link here with ?next= (Baker's Oven), so
    // signing in lands you back on the thing you were trying to open instead of
    // the home page. Same-origin paths only — never a caller-supplied host.
    function nextParam() {
      const n = new URLSearchParams(location.search).get('next');
      return n && n.startsWith('/') && !n.startsWith('//') ? n : null;
    }

    function showState() {
      const user = getUser();
      if (user) {
        document.getElementById('logged-out').style.display = 'none';
        document.getElementById('logged-in').style.display = 'block';
        document.getElementById('acct-name').textContent = user.username;
      } else {
        document.getElementById('logged-in').style.display = 'none';
        document.getElementById('logged-out').style.display = 'block';
      }
    }

    // Create account
    document.getElementById('reg-btn').addEventListener('click', async () => {
      const name = document.getElementById('reg-name').value.trim();
      const password = document.getElementById('reg-password').value;
      const errEl = document.getElementById('reg-error');
      errEl.style.display = 'none';
      if (!name) { errEl.textContent = 'Enter a username'; errEl.style.display = 'block'; return; }
      if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters'; errEl.style.display = 'block'; return; }

      try {
        document.getElementById('reg-btn').disabled = true;
        await register(name, password);

        // Auto-migrate existing localStorage data to server
        const sel = getSelections();
        if (sel && Object.keys(sel).length > 0) syncPush('masters', 'selections', sel);
        const ball = get3BallGroups();
        if (ball && ball.rounds && Object.keys(ball.rounds).length > 0) syncPush('masters', '3ball', ball);

        const next = nextParam();
        if (next) window.location.replace(next);
        else showState();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        document.getElementById('reg-btn').disabled = false;
      }
    });

    // Sign in
    document.getElementById('login-btn').addEventListener('click', async () => {
      const name = document.getElementById('login-name').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      if (!name || !password) { errEl.textContent = 'Enter username and password'; errEl.style.display = 'block'; return; }

      try {
        document.getElementById('login-btn').disabled = true;
        await login(name, password);

        // Pull server data into localStorage
        const sel = await syncPull('masters', 'selections');
        if (sel) localStorage.setItem('masters_selections', JSON.stringify(sel));
        const ball = await syncPull('masters', '3ball');
        if (ball) localStorage.setItem('masters_3ball', JSON.stringify(ball));

        window.location.replace(nextParam() || '/');
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        document.getElementById('login-btn').disabled = false;
      }
    });

    // Sign out
    document.getElementById('sign-out').addEventListener('click', () => {
      clearUser();
      showState();
    });

    showState();
  </script>
</body>
</html>
