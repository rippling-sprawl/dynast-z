<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Home-screen install. The two *-capable tags are what make an iOS icon
       launch the site standalone — its own window, no address bar — instead of
       opening a Safari tab; the manifest says the same thing to everyone else,
       and to iOS 16.4+. standalone.js keys the drawer's share row off exactly
       that state, so dropping these tags silently removes the row too. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/app-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynast-Z">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Acknowledgements | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/primary/index.css">
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="index-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/standalone.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <script>initPage();</script>

  <main class="home">
    <h1 class="home-title">Acknowledgements</h1>
    <div class="home-grid">
      <a class="home-tile" href="https://fantasycalc.com/dynasty-rankings" target="_blank">
        <img class="home-tile-icon" src="/assets/icons/fantasycalc.png" alt="" loading="lazy">
        <span class="home-tile-text">
          <span class="home-tile-title">FantasyCalc</span>
          <span class="home-tile-desc">Dynasty rankings &amp; trade values</span>
        </span>
      </a>
      <a class="home-tile" href="https://keeptradecut.com/dynasty-rankings" target="_blank">
        <img class="home-tile-icon" src="/assets/icons/keeptradecut.png" alt="" loading="lazy">
        <span class="home-tile-text">
          <span class="home-tile-title">KeepTradeCut</span>
          <span class="home-tile-desc">Community dynasty rankings</span>
        </span>
      </a>
      <a class="home-tile" href="https://www.pro-football-reference.com/" target="_blank">
        <img class="home-tile-icon" src="/assets/icons/pro-football-reference.png" alt="" loading="lazy">
        <span class="home-tile-text">
          <span class="home-tile-title">Pro Football Reference</span>
          <span class="home-tile-desc">NFL stats &amp; history</span>
        </span>
      </a>
      <a class="home-tile" href="https://www.fantasypros.com/" target="_blank">
        <img class="home-tile-icon" src="/assets/icons/fantasypros.png" alt="" loading="lazy">
        <span class="home-tile-text">
          <span class="home-tile-title">Fantasy Pros</span>
          <span class="home-tile-desc">Expert rankings &amp; projections</span>
        </span>
      </a>
    </div>
  </main>
</body>
</html>
