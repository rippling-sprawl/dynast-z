<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Home-screen install. The two *-capable tags are what make an iOS icon
       launch the site standalone — its own window, no address bar — instead of
       opening a Safari tab; the manifest says the same thing to everyone else,
       and to iOS 16.4+. standalone.js keys the drawer's share row off exactly
       that state, so dropping these tags silently removes the row too. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/app-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynast-Z">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Archive | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/standalone.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <script>initPage();</script>

  <div class="masters-content">
    <h2>Archive</h2>
    <p class="subtitle">Browse past tournament results</p>

    <div id="archive-list">
      <div class="masters-loading">Loading archive...</div>
    </div>
  </div>

  <style>
    .archive-season {
      margin-bottom: 24px;
    }
    .archive-season h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--hairline);
    }
    .archive-tournament {
      display: block;
      padding: 12px;
      margin-bottom: 4px;
      background: var(--panel-hi);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s;
    }
    .archive-tournament:hover {
      border-color: var(--accent-2);
    }
    .archive-tournament .name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright);
    }
    .archive-tournament .meta {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
  </style>

  <script>
    fetch('/data/tournaments.json')
      .then(r => r.json())
      .then(data => {
        const years = Object.keys(data).sort().reverse();
        const container = document.getElementById('archive-list');

        let html = '';
        for (const year of years) {
          const season = data[year];
          const completed = Object.entries(season).filter(([_, t]) => t.status === 'complete');
          if (completed.length === 0) continue;

          html += '<div class="archive-season">';
          html += `<h3>${year} Season</h3>`;
          for (const [slug, t] of completed) {
            html += `<a class="archive-tournament" href="/golf/${year}/${slug}">
              <div class="name">${t.name}</div>
              <div class="meta">${t.venue} &bull; ${t.dates}</div>
            </a>`;
          }
          html += '</div>';
        }

        if (!html) {
          html = '<p class="masters-empty">No archived tournaments yet.</p>';
        }

        container.innerHTML = html;
      })
      .catch(() => {
        document.getElementById('archive-list').innerHTML = '<p class="masters-empty">Failed to load archive</p>';
      });
  </script>
</body>
</html>
