<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Bets | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/primary/bets.css">
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <script>initPage();</script>

  <main class="bets-content">
    <div class="bets-breadcrumbs"><a href="/">Home</a><span class="sep">/</span><span>Bets</span></div>

    <h2 class="bets-h2">🎯 Bets</h2>
    <p class="bets-sub">Track your wagers and see how your picks shake out.</p>

    <div class="bets-actions">
      <a class="bets-action" href="/bets/place">
        <span class="title">➕ Track</span>
      </a>
      <a class="bets-action" href="/bets/history">
        <span class="title">📜 History</span>
      </a>
      <a class="bets-action" href="/bets/settle">
        <span class="title">💰 Settle Up</span>
      </a>
    </div>

    <div class="bets-section-label">Pending Bets</div>
    <div id="pending-list" class="bet-list"></div>
  </main>

  <script src="/scripts/primary/bets-api.js"></script>
  <script src="/scripts/primary/bets.js"></script>
  <script src="/scripts/primary/bet-tile.js"></script>
  <script src="/scripts/primary/bet-edit-modal.js"></script>
  <script>
    (async function () {
      if (!isLoggedIn()) { location.href = '/account'; return; }
      // Admin-only Audit entry: manage any user's bets.
      if (isAdmin()) {
        const actions = document.querySelector('.bets-actions');
        if (actions) {
          const card = document.createElement('a');
          card.className = 'bets-action';
          card.href = '/bets/audit';
          card.innerHTML = '<span class="title">🛡️ Audit</span>';
          actions.appendChild(card);
        }
      }
      mountAuditBanner();
      await initBets();
      await loadTestBets();
      const pending = pendingBetsWithSeed()
        .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));
      const list = document.getElementById('pending-list');
      if (!pending.length) {
        list.innerHTML = '<div class="bets-empty">No pending bets. <a href="/bets/place" style="color:var(--accent)">Track one →</a></div>';
        return;
      }
      list.innerHTML = pending.map(renderBetTile).join('');
    })();
  </script>
</body>
</html>
