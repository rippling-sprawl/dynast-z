<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Home-screen install. The two *-capable tags are what make an iOS icon
       launch the site standalone — its own window, no address bar — instead of
       opening a Safari tab; the manifest says the same thing to everyone else,
       and to iOS 16.4+. standalone.js keys the drawer's share row off exactly
       that state, so dropping these tags silently removes the row too. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/app-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynast-Z">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Bet Tracker | Dynast-Z</title>
  <!-- Theme first: theme.js sets <html data-theme> before the first paint,
       theme.css holds every colour token the sheets below spend. -->
  <script src="/scripts/base/theme.js"></script>
  <link rel="stylesheet" href="/styles/base/theme.css">
  <link rel="stylesheet" href="/styles/base/styles.css">
  <link rel="stylesheet" href="/styles/base/hub.css">
  <!-- The same VegasInsider skin the /football hub wears. -->
  <link rel="stylesheet" href="/styles/primary/hub.css">
  <link rel="stylesheet" href="/styles/base/lightbox.css">
  <!-- Vercel Web Analytics. The /_vercel/insights/* routes are injected by
       Vercel at deploy time, so this 404s harmlessly when serving locally. -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="masters-body">
  <div id="header-mount"></div>
  <div id="nav-drawer-mount"></div>
  <script src="/scripts/base/auth.js"></script>
  <script src="/scripts/base/standalone.js"></script>
  <script src="/scripts/base/nav.js"></script>
  <script src="/scripts/base/lightbox.js"></script>
  <script>initPage();</script>

  <main class="masters-content">
    <div class="masters-breadcrumbs"><a href="/football">Football</a><span class="separator">/</span><span>Bet Tracker</span></div>

    <h2>🎯 Bet Tracker</h2>
    <p class="subtitle">Track your wagers and see how your picks shake out.</p>

    <div class="hub-grid">
      <a class="hub-card is-title-only" href="/bets/place">
        <h3>➕ Track</h3>
      </a>
      <a class="hub-card is-title-only" href="/bets/history">
        <h3>📜 History</h3>
      </a>
      <a class="hub-card is-title-only" href="/bets/settle">
        <h3>💰 Settle Up</h3>
      </a>
    </div>

    <div class="hub-section">Pending Bets</div>
    <div id="pending-list" class="bet-list"></div>
  </main>

  <script src="/scripts/primary/bets-api.js"></script>
  <script src="/scripts/primary/bets.js"></script>
  <script src="/scripts/primary/bet-tile.js"></script>
  <script src="/scripts/primary/bet-edit-modal.js"></script>
  <script>
    (async function () {
      if (!isLoggedIn()) { location.href = '/account'; return; }
      // Admin-only Audit entry: manage any user's bets.
      if (isAdmin()) {
        const actions = document.querySelector('.hub-grid');
        if (actions) {
          const card = document.createElement('a');
          card.className = 'hub-card is-title-only';
          card.href = '/bets/audit';
          card.innerHTML = '<h3>🛡️ Audit</h3>';
          actions.appendChild(card);
        }
      }
      mountAuditBanner();
      await initBets();
      await loadTestBets();
      const pending = pendingBetsWithSeed()
        .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));
      const list = document.getElementById('pending-list');
      if (!pending.length) {
        list.innerHTML = '<div class="bets-empty">No pending bets. <a href="/bets/place" style="color:var(--accent)">Track one →</a></div>';
        return;
      }
      list.innerHTML = pending.map(renderBetTile).join('');
    })();
  </script>
</body>
</html>
